name: The Wise Frontier - Daily Run

on:
  schedule:
    - cron: '0 22 * * *'  # UTC 22:00 = KST 07:00 매일 자동 실행
  workflow_dispatch:        # GitHub에서 수동 실행도 가능

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: RSS 수집 및 발송
        run: python scripts/rss_fetcher.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
