name: Fix Article Titles (1회용)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 기사 제목 정리
        run: python scripts/fix_titles.py

      - name: 상태 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/articles.db
          git diff --staged --quiet || git commit -m "Fix article titles"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
