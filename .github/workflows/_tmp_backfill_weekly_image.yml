name: _tmp backfill weekly market image
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}
        working-directory: scripts
        run: |
          python -c "
          import requests, os
          from article_image import fetch_seeded_pixabay_image
          from weekly_market_card import _IMAGE_KEYWORDS
          from datetime import date
          week_end = date(2026,9,25)
          keywords = _IMAGE_KEYWORDS['비트코인']
          url = fetch_seeded_pixabay_image(keywords, seed=week_end.toordinal(), key_hint=f'weekly_market_{week_end.isoformat()}')
          print('image_url:', url)
          assert url, '이미지 못 구함'
          h = {'apikey': os.environ['SUPABASE_SERVICE_KEY'], 'Authorization': 'Bearer '+os.environ['SUPABASE_SERVICE_KEY'], 'Content-Type':'application/json', 'Prefer':'return=minimal'}
          r = requests.patch(os.environ['SUPABASE_URL']+'/rest/v1/articles?id=eq.292424', headers=h, json={'image_url': url})
          print('supabase patch:', r.status_code)
          from db import mirror_article_update
          mirror_article_update(292424, {'image_url': url})
          print('aiven mirror done')
          "
