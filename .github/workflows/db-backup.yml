name: DB 암호화 백업

on:
  # GitHub 자체 schedule: 트리거는 이 저장소에서 반복적으로 무응답/지연
  # 사고를 낸 전례가 있어 다른 워크플로와 동일하게 외부 크론(cron-job.org)의
  # workflow_dispatch로 대체한다(2026-09-03 점검 — 이 워크플로만 옛날
  # schedule: 그대로 남아있었음).
  #
  # 2026-09-23: 매일 → 주 1회(일요일)로 변경(사용자 결정). Supabase 무료 플랜
  # 이그레스 한도(5GB) 초과로 유예기간 진입 — pg_dump는 매번 DB 전체를 밖으로
  # 빼내(압축 전 수백 MB) 매일이면 이것만으로 한도에 육박한다. 그날 덤프는
  # IO 스로틀 상태에서 71분 걸리며 사이트까지 느려지게 했다.
  #
  # 2026-09-24: 주 1회로도 여전히 이그레스를 태우는 근본 원인(Supabase DB
  # 전체 pg_dump)이라 완전히 중단했었다(사용자 결정) — 대신 Aiven 스탠바이의
  # 실시간 미러(발행된 NewsFinal 자체 기사만, article_store.insert_final_article
  # 경유 — 수집 원자재는 raw_candidates로 분리돼 애초에 미러 대상 아님)가
  # 백업 역할을 대신했다. 트레이드오프로 시점 복구(특정 날짜로 되돌리기)를
  # 포기했었다.
  #
  # 2026-09-25: 사용자 지적("백업 로직은 Supabase 말고 Aiven을 이용하는 게
  # 낫지 않나") — 맞다. pg_dump 소스를 Supabase에서 Aiven으로 바꾸면 (1)
  # Supabase 이그레스를 전혀 안 건드리고 (2) Aiven엔 articles 테이블만 있어
  # 덤프가 훨씬 작고(~30MB대) (3) 포기했던 시점 복구가 되살아난다(암호화
  # 스냅샷을 주기적으로 뜸). Aiven 자체가 문제 생겨도 별도 보관본이 있는
  # 이중 안전장치이기도 하다. 주 1회(일요일) 자동으로 다시 켠다 — Supabase에
  # 부담이 없으니 이그레스 걱정 없이 가능. cron-job.org가 매일 호출하지만
  # 일요일이 아니면 gate가 건너뛴다. 급하면 수동 실행 시 force=true.
  workflow_dispatch:
    inputs:
      force:
        description: '요일과 무관하게 지금 백업 실행'
        required: false
        default: 'false'

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.day.outputs.run }}
    steps:
      - id: day
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ] || [ "$(date -u +%u)" = "7" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "run=false" >> "$GITHUB_OUTPUT"; echo "일요일 아님 — 건너뜀(수동 실행 시 force=true로 우회 가능)"; fi

  backup:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: PostgreSQL 17 클라이언트 설치
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      # 2026-09-25: 소스를 Supabase→Aiven으로 전환(Supabase 이그레스 전혀 안 씀,
      # Aiven엔 발행 기사(articles)만 있어 덤프가 훨씬 작음). raw_candidates는
      # 스키마만 있고 데이터를 미러링하지 않으므로(원자재는 백업 대상 아님)
      # 덤프에 빈 테이블로만 잡혀도 무해하다.
      - name: DB 덤프 (Aiven)
        env:
          PGCONNSTR: ${{ secrets.AIVEN_SERVICE_URI }}
        run: pg_dump "$PGCONNSTR" --no-owner --no-privileges -F c -f backup.dump

      - name: 암호화 (AES-256)
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in backup.dump \
            -out "newsfinal-$(date +%Y%m%d).dump.enc" \
            -pass env:BACKUP_PASSWORD
          rm backup.dump
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}

      # 백업 저장소: Cloudflare R2 비공개 버킷. 이 저장소는 public이라 Actions 아티팩트는
      # GitHub 계정만 있으면 누구나 내려받을 수 있다(2026-09-22 점검) — 프롬프트·설정 테이블이 든
      # 덤프를 그렇게 둘 수 없어 옮긴다. 버킷은 공개 접근/커스텀 도메인을 켜지 않는 한 비공개.
      # 한계: wrangler object put은 파일 1개 약 300MB 상한(현재 덤프 약 130MB) — 넘으면 S3 멀티파트로 전환.
      - name: R2 버킷 준비 (비공개, 30일 만료)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 bucket info newsfinal-backups >/dev/null 2>&1 || npx --yes wrangler@4 r2 bucket create newsfinal-backups
          npx --yes wrangler@4 r2 bucket lifecycle list newsfinal-backups 2>&1 | grep -q expire-30d || npx --yes wrangler@4 r2 bucket lifecycle add newsfinal-backups expire-30d "" --expire-days 30 --force

      - name: R2 업로드 + 무결성 대조
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          f=$(ls newsfinal-*.dump.enc)
          npx --yes wrangler@4 r2 object put "newsfinal-backups/$f" --file "$f" --remote
          npx --yes wrangler@4 r2 object get "newsfinal-backups/$f" --file "roundtrip.enc" --remote
          cmp "$f" roundtrip.enc && echo "R2 왕복 대조 일치: $(stat -c %s "$f") bytes"
          rm -f roundtrip.enc


      # 최종 백업: 구글 드라이브(유료 용량 600GB+). 지우지 않고 영구 보관한다(2026-09-22 사용자 결정) —
      # R2는 30일 지나면 자동 삭제되는 임시 사본이고, 드라이브가 마지막 보루다. 이 단계에는 삭제 명령을 넣지 말 것.
      # 시크릿 RCLONE_DRIVE_TOKEN(rclone authorize 출력) 또는 RCLONE_CONFIG(rclone.conf 전체, remote 이름 gdrive)가 없으면 건너뛴다.
      # ⚠️ 시크릿을 RCLONE_* 이름의 환경변수로 넘기지 말 것 — rclone이 그 이름을 자기 옵션(예: --drive-token)으로 읽어 오류가 난다.
      # 최종 백업이라 실패하면 실행을 빨갛게 실패시킨다(검증 단계는 if: always()로 그래도 돈다).
      - name: 구글 드라이브 최종 백업 (영구 보관)
        env:
          GDRIVE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
          GDRIVE_TOKEN_DATA: ${{ secrets.RCLONE_DRIVE_TOKEN }}
        run: |
          if [ -z "$GDRIVE_CONFIG_DATA" ] && [ -z "$GDRIVE_TOKEN_DATA" ]; then echo "RCLONE_DRIVE_TOKEN/RCLONE_CONFIG 시크릿 없음 - 드라이브 복사 건너뜀"; exit 0; fi
          sudo apt-get install -y -qq rclone
          mkdir -p ~/.config/rclone
          if [ -n "$GDRIVE_CONFIG_DATA" ]; then printf '%s' "$GDRIVE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          else
            # rclone authorize 출력은 두 가지 형태: 토큰 JSON({...}) 또는 base64 묶음(client_id/secret/token). 둘 다 받는다.
            python3 - <<'PY'
          import os, json, base64
          v = os.environ["GDRIVE_TOKEN_DATA"].strip()
          conf = ["[gdrive]", "type = drive", "scope = drive.file"]
          if v.startswith("{"):
              tok = v
          else:
              b = v + "=" * (-len(v) % 4)
              try: d = json.loads(base64.urlsafe_b64decode(b))
              except Exception: d = json.loads(base64.b64decode(b))
              tok = d["token"] if isinstance(d["token"], str) else json.dumps(d["token"])
              for k in ("client_id", "client_secret"):
                  if d.get(k): conf.append(f"{k} = {d[k]}")
          conf.append("token = " + tok)
          open(os.path.expanduser("~/.config/rclone/rclone.conf"), "w").write("\n".join(conf) + "\n")
          PY
          fi
          f=$(ls newsfinal-*.dump.enc)
          rclone copyto "$f" "gdrive:newsfinal-backups/$f"
          rclone lsl "gdrive:newsfinal-backups/$f"   # copyto가 업로드 후 해시를 대조한다
          rclone size gdrive:newsfinal-backups

      # R2 업로드 뒤에 검증한다: 이 단계가 잘못돼도 백업 자체는 이미 저장돼 있다.
      # 복호화 → 아카이브 목차 읽기 → 핵심 테이블 데이터 존재 확인. 깨진/빈 덤프면 실행이 빨갛게 실패한다.
      # Aiven 소스로 바뀌면서 확인 대상도 실제로 거기 있는 테이블(articles)만 —
      # prompts/user_roles/article_translations는 Supabase 전용이라 Aiven엔 없다.
      - name: 복구 가능 검증 (복호화 + 목차 확인)
        if: always()
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in newsfinal-*.dump.enc -out verify.dump -pass env:BACKUP_PASSWORD
          /usr/lib/postgresql/17/bin/pg_restore -l verify.dump > toc.txt
          echo "TOC 항목 수: $(wc -l < toc.txt)"
          grep -Eq "TABLE DATA public articles( |$)" toc.txt || { echo "::error::articles 테이블 데이터가 덤프에 없음"; exit 1; }
          rm -f verify.dump toc.txt
