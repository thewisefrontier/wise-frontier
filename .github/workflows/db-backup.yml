name: DB 암호화 백업

on:
  # GitHub 자체 schedule: 트리거는 이 저장소에서 반복적으로 무응답/지연
  # 사고를 낸 전례가 있어 다른 워크플로와 동일하게 외부 크론(cron-job.org)의
  # workflow_dispatch로 대체한다(2026-09-03 점검 — 이 워크플로만 옛날
  # schedule: 그대로 남아있었음). 원래 주기: 매일 03:00 KST.
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: PostgreSQL 17 클라이언트 설치
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: DB 덤프 (Session Pooler, IPv4)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pg_dump -h aws-1-ap-northeast-2.pooler.supabase.com -p 5432 \
            -U postgres.fotdngseksqaghvtcvqh -d postgres \
            --no-owner --no-privileges -F c -f backup.dump

      - name: 암호화 (AES-256)
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in backup.dump \
            -out "newsfinal-$(date +%Y%m%d).dump.enc" \
            -pass env:BACKUP_PASSWORD
          rm backup.dump
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}

      # 백업 저장소: Cloudflare R2 비공개 버킷. 이 저장소는 public이라 Actions 아티팩트는
      # GitHub 계정만 있으면 누구나 내려받을 수 있다(2026-09-22 점검) — 프롬프트·설정 테이블이 든
      # 덤프를 그렇게 둘 수 없어 옮긴다. 버킷은 공개 접근/커스텀 도메인을 켜지 않는 한 비공개.
      # 한계: wrangler object put은 파일 1개 약 300MB 상한(현재 덤프 약 130MB) — 넘으면 S3 멀티파트로 전환.
      - name: R2 버킷 준비 (비공개, 30일 만료)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 bucket info newsfinal-backups >/dev/null 2>&1 || npx --yes wrangler@4 r2 bucket create newsfinal-backups
          npx --yes wrangler@4 r2 bucket lifecycle list newsfinal-backups 2>&1 | grep -q expire-30d || npx --yes wrangler@4 r2 bucket lifecycle add newsfinal-backups expire-30d "" --expire-days 30 --force

      - name: R2 업로드 + 무결성 대조
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          f=$(ls newsfinal-*.dump.enc)
          npx --yes wrangler@4 r2 object put "newsfinal-backups/$f" --file "$f" --remote
          npx --yes wrangler@4 r2 object get "newsfinal-backups/$f" --file "roundtrip.enc" --remote
          cmp "$f" roundtrip.enc && echo "R2 왕복 대조 일치: $(stat -c %s "$f") bytes"
          rm -f roundtrip.enc


      # 최종 백업: 구글 드라이브(유료 용량 600GB+). 지우지 않고 영구 보관한다(2026-09-22 사용자 결정) —
      # R2는 30일 지나면 자동 삭제되는 임시 사본이고, 드라이브가 마지막 보루다. 이 단계에는 삭제 명령을 넣지 말 것.
      # 시크릿 RCLONE_DRIVE_TOKEN(rclone authorize 출력) 또는 RCLONE_CONFIG(rclone.conf 전체, remote 이름 gdrive)가 없으면 건너뛴다.
      # 최종 백업이라 실패하면 실행을 빨갛게 실패시킨다(검증 단계는 if: always()로 그래도 돈다).
      - name: 구글 드라이브 최종 백업 (영구 보관)
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
          RCLONE_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
        run: |
          if [ -z "$RCLONE_CONFIG_DATA" ] && [ -z "$RCLONE_DRIVE_TOKEN" ]; then echo "RCLONE_DRIVE_TOKEN/RCLONE_CONFIG 시크릿 없음 - 드라이브 복사 건너뜀"; exit 0; fi
          sudo apt-get install -y -qq rclone
          mkdir -p ~/.config/rclone
          if [ -n "$RCLONE_CONFIG_DATA" ]; then printf '%s' "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          else
            # rclone authorize 출력은 두 가지 형태: 토큰 JSON({...}) 또는 base64 묶음(client_id/secret/token). 둘 다 받는다.
            python3 - <<'PY'
          import os, json, base64
          v = os.environ["RCLONE_DRIVE_TOKEN"].strip()
          conf = ["[gdrive]", "type = drive", "scope = drive.file"]
          if v.startswith("{"):
              tok = v
          else:
              b = v + "=" * (-len(v) % 4)
              try: d = json.loads(base64.urlsafe_b64decode(b))
              except Exception: d = json.loads(base64.b64decode(b))
              tok = d["token"] if isinstance(d["token"], str) else json.dumps(d["token"])
              for k in ("client_id", "client_secret"):
                  if d.get(k): conf.append(f"{k} = {d[k]}")
          conf.append("token = " + tok)
          # 진단(값은 출력하지 않음): 형식 확인용
          print("secret len=%d head=%s | token len=%d head=%s valid_json=%s" % (len(v), v[:3], len(tok), tok[:1], (lambda s: (json.loads(s) is not None))(tok) if tok[:1] == "{" else False))
          open(os.path.expanduser("~/.config/rclone/rclone.conf"), "w").write("\n".join(conf) + "\n")
          PY
          fi
          f=$(ls newsfinal-*.dump.enc)
          rclone copyto "$f" "gdrive:newsfinal-backups/$f"
          rclone lsl "gdrive:newsfinal-backups/$f"   # copyto가 업로드 후 해시를 대조한다
          rclone size gdrive:newsfinal-backups

      # R2 업로드 뒤에 검증한다: 이 단계가 잘못돼도 백업 자체는 이미 저장돼 있다.
      # 복호화 → 아카이브 목차 읽기 → 핵심 테이블 데이터 존재 확인. 깨진/빈 덤프면 실행이 빨갛게 실패한다.
      - name: 복구 가능 검증 (복호화 + 목차 확인)
        if: always()
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in newsfinal-*.dump.enc -out verify.dump -pass env:BACKUP_PASSWORD
          /usr/lib/postgresql/17/bin/pg_restore -l verify.dump > toc.txt
          echo "TOC 항목 수: $(wc -l < toc.txt)"
          for t in articles prompts user_roles article_translations; do
            grep -Eq "TABLE DATA public $t( |$)" toc.txt || { echo "::error::$t 테이블 데이터가 덤프에 없음"; exit 1; }
          done
          rm -f verify.dump toc.txt
