name: DB 암호화 백업

on:
  # GitHub 자체 schedule: 트리거는 이 저장소에서 반복적으로 무응답/지연
  # 사고를 낸 전례가 있어 다른 워크플로와 동일하게 외부 크론(cron-job.org)의
  # workflow_dispatch로 대체한다(2026-09-03 점검 — 이 워크플로만 옛날
  # schedule: 그대로 남아있었음). 원래 주기: 매일 03:00 KST.
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: PostgreSQL 17 클라이언트 설치
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: DB 덤프 (Session Pooler, IPv4)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pg_dump -h aws-1-ap-northeast-2.pooler.supabase.com -p 5432 \
            -U postgres.fotdngseksqaghvtcvqh -d postgres \
            --no-owner --no-privileges -F c -f backup.dump

      - name: 암호화 (AES-256)
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in backup.dump \
            -out "newsfinal-$(date +%Y%m%d).dump.enc" \
            -pass env:BACKUP_PASSWORD
          rm backup.dump
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}

      - name: 백업 업로드 (30일 보관)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: "*.dump.enc"
          retention-days: 30

      # 업로드 뒤에 검증한다: 이 단계가 잘못돼도 백업 자체는 이미 저장돼 있다.
      # 복호화 → 아카이브 목차 읽기 → 핵심 테이블 데이터 존재 확인. 깨진/빈 덤프면 실행이 빨갛게 실패한다.
      - name: 복구 가능 검증 (복호화 + 목차 확인)
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in newsfinal-*.dump.enc -out verify.dump -pass env:BACKUP_PASSWORD
          pg_restore -l verify.dump > toc.txt
          echo "TOC 항목 수: $(wc -l < toc.txt)"
          for t in articles prompts user_roles article_translations; do
            grep -Eq "TABLE DATA public $t( |$)" toc.txt || { echo "::error::$t 테이블 데이터가 덤프에 없음"; exit 1; }
          done
          rm -f verify.dump toc.txt
