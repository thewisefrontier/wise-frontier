name: DB 암호화 백업

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 03:00 KST
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: PostgreSQL 17 클라이언트 설치
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: DB 덤프 (Session Pooler, IPv4)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -u
          DB_USER="postgres.fotdngseksqaghvtcvqh"
          DUMPED=0
          for HOST in aws-1-ap-northeast-2.pooler.supabase.com aws-0-ap-northeast-2.pooler.supabase.com; do
            echo "시도: $HOST"
            if pg_dump -h "$HOST" -p 5432 -U "$DB_USER" -d postgres --no-owner --no-privileges -F c -f backup.dump; then
              echo "✅ 성공: $HOST"
              DUMPED=1
              break
            fi
          done
          if [ "$DUMPED" -ne 1 ]; then
            echo "❌ 두 pooler 호스트 모두 실패"
            exit 1
          fi

      - name: 암호화 (AES-256)
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in backup.dump \
            -out "newsfinal-$(date +%Y%m%d).dump.enc" \
            -pass env:BACKUP_PASSWORD
          rm backup.dump
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}

      - name: 백업 업로드 (30일 보관)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: "*.dump.enc"
          retention-days: 30
