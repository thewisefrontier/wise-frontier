name: NewsFinal - US Market Holiday Notice

# 미국 증시(NYSE/NASDAQ) 휴장일 안내 기사. 사용자 요청(2026-09-07): "주말은
# 당연히 쉬는 거지만 근로자의 날 같은 연휴는 기사화할만 하다".
#
# 수치는 전부 야후 파이낸스 실측값을 그대로 쓰는 결정론적 템플릿이라
# GEMINI_API_KEY가 필요 없다(us_market_holiday_writer.py 참고).
#
# 휴장일은 1년에 9번뿐이라 ny_market_open.yml처럼 좁은 시간창을 자주 찌를
# 필요는 없지만, 이 저장소의 GitHub 자체 schedule 트리거 무응답/지연 전례
# (run.yml/frontier_markets.yml/lotto.yml 참고) 때문에 여기서도 외부 크론
# (cron-job.org)의 workflow_dispatch로 호출한다. 뉴욕 09:00 ET 전후
# (22:00 KST EDT / 23:00 KST EST) 1회면 충분 — already_published()가 같은
# 날짜 중복 발행을 막으므로 여러 번 호출돼도 안전하다.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsfinal-us-market-holiday
  cancel-in-progress: false

jobs:
  us_market_holiday:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: 암호화 파일 잠금 해제(git-crypt)
        # 프롬프트·검수 코드는 git-crypt로 암호화돼 있다(2026-10-18) — 키는 시크릿 GIT_CRYPT_KEY.
        # 암호화 지정(.gitattributes)이 없으면 그냥 통과해서, 도입 전후 어느 쪽에서도 안전하다.
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          if ! grep -qs "filter=git-crypt" .gitattributes; then echo "암호화 파일 없음 — 건너뜀"; exit 0; fi
          sudo apt-get install -y -qq git-crypt >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq git-crypt >/dev/null)
          printf '%s' "$GIT_CRYPT_KEY" | base64 -d > "$RUNNER_TEMP/gc.key"
          git-crypt unlock "$RUNNER_TEMP/gc.key"
          rm -f "$RUNNER_TEMP/gc.key"

      - name: Aiven PostgREST 기동(Supabase 이탈, 2026-10-20)
        uses: ./.github/actions/aiven-postgrest
        with:
          aiven-uri: ${{ secrets.AIVEN_SERVICE_URI }}
          jwt-secret: ${{ secrets.PGRST_JWT_SECRET }}
          pool: "1"

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 미국 증시 휴장 안내 기사 생성
        run: python scripts/us_market_holiday_writer.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}

      - name: 웹사이트 데이터 내보내기
        run: python scripts/export_articles.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update US market holiday article"
          for i in 1 2 3 4 5; do
            git pull origin main -X ours --no-rebase
            git push && break
            echo "push failed (attempt $i) - another workflow pushed first, retrying"
            sleep $((RANDOM % 8 + 3))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
