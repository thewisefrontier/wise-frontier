on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsfinal-us-market-holiday
  cancel-in-progress: false

jobs:
  us_market_holiday:
    runs-on: ubuntu-latest

    steps:
      - name: ì½”ë“œ ì²´í¬?„ì›ƒ
        uses: actions/checkout@v5

      - name: Python ?¤ì •
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: ?¨í‚¤ì§€ ?¤ì¹˜
        run: pip install -r requirements.txt

      - name: ë¯¸êµ­ ì¦ì‹œ ?´ì¥ ?ˆë‚´ ê¸°ì‚¬ ?ì„±
        run: python scripts/us_market_holiday_writer.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}

      - name: ?¹ì‚¬?´íŠ¸ ?°ì´???´ë³´?´ê¸°
        run: python scripts/export_articles.py
