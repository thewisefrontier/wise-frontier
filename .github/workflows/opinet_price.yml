name: NewsFinal - Daily Domestic Oil Price (Opinet)

on:
  # 2026-08-28: ???åÌÅ¨?åÎ°ú?∞Í? 08:00 KST ?àÏ†ï?êÏÑú 7?úÍ∞Ñ ?òÍ≤å ??? 15:50?êÏïº
  # Ï≤òÏùå ?§Ìñâ??Í≤ÉÏùÑ ?ïÏù∏(run.ymlÍ≥?Í∞ôÏ? GitHub schedule ?∏Î¶¨Í±?Î¨¥Ïùë??
  # ?¨Í≥†, Í∞ôÏ? ???Ä?•ÏÜå ?ÑÎ∞ò??Í±∏Ï≥ê Î∞úÏÉù). schedule ?úÍ±∞, ?∏Î? ?¨Î°†
  # (cron-job.org)??workflow_dispatchÎ°??ÑÌôò. ?§ÌÅ¨Î¶ΩÌä∏ ?êÏ≤¥Í∞Ä
  # already_published()Î°?Í≤åÏù¥?∏ÌïòÎØÄÎ°??êÏ£º ?∏Ï∂ú?¥ÎèÑ ?àÏ†Ñ.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsfinal-opinet-price
  cancel-in-progress: false

jobs:
  opinet_price:
    runs-on: ubuntu-latest

    steps:
      - name: ÏΩîÎìú Ï≤¥ÌÅ¨?ÑÏõÉ
        uses: actions/checkout@v5

      - name: Python ?§Ï†ï
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: ?®ÌÇ§ÏßÄ ?§Ïπò
        run: pip install -r requirements.txt

      - name: Íµ?Ç¥ ?†Í? Í∏∞ÏÇ¨ ?ùÏÑ±
        run: python scripts/opinet_price_writer.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}

      - name: ?πÏÇ¨?¥Ìä∏ ?∞Ïù¥???¥Î≥¥?¥Í∏∞
        run: python scripts/export_articles.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}

      - name: Î≥ÄÍ≤ΩÏÇ¨??Ïª§Î∞ã Î∞??∏Ïãú
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update domestic oil price article"
          for i in 1 2 3 4 5; do
            git pull origin main -X ours --no-rebase
            git push && break
            echo "push failed (attempt $i) - another workflow pushed first, retrying"
            sleep $((RANDOM % 8 + 3))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
