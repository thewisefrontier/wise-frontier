name: NewsFinal - Daily Domestic Oil Price (Opinet)

on:
  # 2026-08-28: 이 워크플로우가 08:00 KST 예정에서 7시간 넘게 늦은 15:50에야
  # 처음 실행된 것을 확인(run.yml과 같은 GitHub schedule 트리거 무응답
  # 사고, 같은 날 저장소 전반에 걸쳐 발생). schedule 제거, 외부 크론
  # (cron-job.org)의 workflow_dispatch로 전환. 스크립트 자체가
  # already_published()로 게이트하므로 자주 호출해도 안전.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsfinal-opinet-price
  cancel-in-progress: false

jobs:
  opinet_price:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: 암호화 파일 잠금 해제(git-crypt)
        # 프롬프트·검수 코드는 git-crypt로 암호화돼 있다(2026-10-18) — 키는 시크릿 GIT_CRYPT_KEY.
        # 암호화 지정(.gitattributes)이 없으면 그냥 통과해서, 도입 전후 어느 쪽에서도 안전하다.
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          if ! grep -qs "filter=git-crypt" .gitattributes; then echo "암호화 파일 없음 — 건너뜀"; exit 0; fi
          sudo apt-get install -y -qq git-crypt >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq git-crypt >/dev/null)
          printf '%s' "$GIT_CRYPT_KEY" | base64 -d > "$RUNNER_TEMP/gc.key"
          git-crypt unlock "$RUNNER_TEMP/gc.key"
          rm -f "$RUNNER_TEMP/gc.key"

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 국내 유가 기사 생성
        run: python scripts/opinet_price_writer.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}

      - name: 웹사이트 데이터 내보내기
        run: python scripts/export_articles.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update domestic oil price article"
          for i in 1 2 3 4 5; do
            git pull origin main -X ours --no-rebase
            git push && break
            echo "push failed (attempt $i) - another workflow pushed first, retrying"
            sleep $((RANDOM % 8 + 3))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
