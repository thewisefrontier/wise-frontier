name: One-Off Maintenance Task

# 수동 실행 또는 scripts/one_off/queue/ 폴더에 파일 push시 자동 실행
on:
  workflow_dispatch:
    inputs:
      script:
        description: '실행할 스크립트 파일명 (scripts/ 폴더 기준)'
        required: true
        default: 'one_off/fix_country_names.py'
  push:
    paths:
      - 'scripts/one_off/queue/*.py'

permissions:
  contents: write

jobs:
  run_script:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 실행할 스크립트 결정
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # queue/ 폴더에 새로 추가된 .py 파일 찾기
            SCRIPT=$(git diff --name-only HEAD~1 HEAD -- 'scripts/one_off/queue/*.py' | head -1)
            if [ -z "$SCRIPT" ]; then
              SCRIPT=$(ls scripts/one_off/queue/*.py 2>/dev/null | head -1)
            fi
            # scripts/ 기준 상대경로로 변환
            SCRIPT=${SCRIPT#scripts/}
            echo "script=$SCRIPT" >> $GITHUB_OUTPUT
            echo "auto=true" >> $GITHUB_OUTPUT
          else
            echo "script=${{ inputs.script }}" >> $GITHUB_OUTPUT
            echo "auto=false" >> $GITHUB_OUTPUT
          fi

      - name: 스크립트 실행
        run: |
          echo "실행: scripts/${{ steps.resolve.outputs.script }}"
          python scripts/${{ steps.resolve.outputs.script }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: 실행 완료 후 queue에서 제거
        if: steps.resolve.outputs.auto == 'true' && steps.resolve.outputs.script != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f "scripts/${{ steps.resolve.outputs.script }}" || true
          git commit -m "chore: remove executed queue script" || true
          git push || true
