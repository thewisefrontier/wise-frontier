name: One-Off Maintenance Task

# 수동 실행 전용
on:
  workflow_dispatch:
    inputs:
      script:
        description: '실행할 스크립트 파일명 (scripts/ 폴더 기준, 예: one_off/backfill_companies.py)'
        required: true
        default: 'one_off/backfill_companies.py'

permissions:
  contents: read

jobs:
  run_script:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 스크립트 실행
        # 2026-09-03 보안 점검: 워크플로 입력값을 run: 셸에 직접 치환하면
        # script 입력에 셸 메타문자를 넣어 임의 명령 실행이 가능했다(GitHub
        # 공식 문서가 경고하는 스크립트 인젝션 안티패턴 — 이 job은 모든
        # 시크릿을 env로 갖고 있어 위험이 컸다). env로 받아 파일명 패턴을
        # 검증한 뒤에만 실행한다.
        run: |
          echo "실행: scripts/${SCRIPT}"
          if [[ ! "$SCRIPT" =~ ^[A-Za-z0-9_./-]+\.py$ ]]; then
            echo "::error::허용되지 않는 파일명 형식: $SCRIPT"
            exit 1
          fi
          python "scripts/${SCRIPT}"
        env:
          SCRIPT: ${{ inputs.script }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
          KMA_BRIEFING_KEY: ${{ secrets.KMA_BRIEFING_KEY }}
