name: Deploy Export Trigger Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ÏΩîÎìú Ï≤¥ÌÅ¨?ÑÏõÉ
        uses: actions/checkout@v5

      - name: Node.js ?§Ï†ï
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: wrangler ?§Ïπò
        run: npm install -g wrangler

      - name: Worker Î∞∞Ìè¨
        run: wrangler deploy --config wrangler-export-trigger.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: ?∏Î¶¨Í±?ÎπÑÎ????§Ï†ï
        run: echo "${{ secrets.EXPORT_TRIGGER_SECRET }}" | wrangler secret put EXPORT_TRIGGER_SECRET --config wrangler-export-trigger.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: GitHub dispatch ?†ÌÅ∞ ?§Ï†ï
        run: echo "${{ secrets.EXPORT_GITHUB_DISPATCH_TOKEN }}" | wrangler secret put GITHUB_DISPATCH_TOKEN --config wrangler-export-trigger.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
