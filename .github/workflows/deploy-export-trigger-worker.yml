name: Deploy Export Trigger Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: wrangler 설치
        run: npm install -g wrangler

      - name: Worker 배포
        run: wrangler deploy --config wrangler-export-trigger.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 트리거 비밀키 설정
        run: echo "${{ secrets.EXPORT_TRIGGER_SECRET }}" | wrangler secret put EXPORT_TRIGGER_SECRET --config wrangler-export-trigger.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: GitHub dispatch 토큰 설정
        run: echo "${{ secrets.EXPORT_GITHUB_DISPATCH_TOKEN }}" | wrangler secret put GITHUB_DISPATCH_TOKEN --config wrangler-export-trigger.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
