name: NewsFinal - Auto Dedup

on:
  workflow_run:
    workflows: ["NewsFinal - Auto Run"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsfinal-auto-dedup
  cancel-in-progress: false

jobs:
  dedup:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: ÏΩîÎìú Ï≤¥ÌÅ¨?ÑÏõÉ
        uses: actions/checkout@v5
        with:
          # run.ymlÍ≥??ôÏùº???¥Ïú†Î°?ref Î™ÖÏãú(?∏Î¶¨Í±??úÏ†ê SHA Í≥†Ï†ï Î∞©Ï?). ???åÌÅ¨?åÎ°ú?∞Îäî
          # run.yml ?ÑÎ£å(workflow_run)ÎßàÎã§ Îß§Î≤à Í±∏Î¶¨?îÎç∞, run.yml??100Î∂?Í∞Ä?úÎ°ú ?§ÌÇµ?òÎ©¥
          # (Ïª§Î∞ã ?ÜÏùå) ?¨Í∏∞?úÎèÑ ???ºÏù¥ ?ÜÎã§ ??Î∞îÎ°ú ?ÑÎûò Í∞Ä?úÍ? Í∑∏Í±∏ ?ïÏù∏?úÎã§.
          ref: main

      # run.yml?Ä 100Î∂?Í∞Ä?úÎ°ú ?§ÌÇµ????Ïª§Î∞ã???ÑÏòà ???®Í∏¥?? ???åÌÅ¨?åÎ°ú?∞Îäî
      # workflow_run?ºÎ°ú run.yml "?ÑÎ£å"ÎßàÎã§ Í±∏Î¶¨ÎØÄÎ°??§ÌÇµ?¥Îì† ?Ä?¥Îì† conclusion=success),
      # Í∞Ä???ÜÏù¥????Í∏∞ÏÇ¨Í∞Ä ?òÎÇò???ÜÎäî?∞ÎèÑ 25~40Î∂ÑÎßà???åÍ≤å ?úÎã§(?§Ï∏° 2026-08-09~10,
      # "Auto-unpublish duplicate articles" Ïª§Î∞ã???§ÌÇµ Íµ¨Í∞Ñ?êÎèÑ Í≥ÑÏÜç Ï∞çÌûò ??Ï≤òÎ¶¨??Í≤?      # ?ÜÏñ¥??RPC Ï°∞Ìöå ?êÏ≤¥??Îß§Î≤à ?òÍ∞î?§Îäî ??. HEAD??ÎßàÏ?Îß?Ïª§Î∞ã Î©îÏãúÏßÄÍ∞Ä
      # run.yml??"Update articles & state"Í∞Ä ?ÑÎãàÎ©?ÏßÅÏ†Ñ run.yml???§ÌÇµ?êÎã§???ªÏù¥ÎØÄÎ°?      # ?¨Í∏∞???§ÌÇµ?úÎã§.
      - name: Í∞Ä??(ÏßÅÏ†Ñ run.yml???§Ï†úÎ°??ëÏóÖ?àÏùÑ ?åÎßå ÏßÑÌñâ)
        id: guard
        if: github.event_name == 'workflow_run'
        run: |
          last_msg=$(git log -1 --format=%s)
          echo "ÏßÅÏ†Ñ Ïª§Î∞ã: $last_msg"
          if [ "$last_msg" != "Update articles & state" ]; then
            echo "ÏßÅÏ†Ñ run.yml???§ÌÇµ????Í∏∞ÏÇ¨ ?ÜÏùå) -> ?¥Î≤à ?§Ìñâ?Ä ?ëÏóÖ ?ÜÏù¥ ?µÍ≥º"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Python ?§Ï†ï
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: ?®ÌÇ§ÏßÄ ?§Ïπò
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Ï§ëÎ≥µÍ∏∞ÏÇ¨ ?êÎèô ÎØ∏Î∞ú??        if: steps.guard.outputs.skip != 'true'
        run: python scripts/auto_dedup.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}

      - name: ?πÏÇ¨?¥Ìä∏ ?∞Ïù¥???¥Î≥¥?¥Í∏∞
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/export_articles.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}

      - name: Î≥ÄÍ≤ΩÏÇ¨??Ïª§Î∞ã Î∞??∏Ïãú
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-unpublish duplicate articles"
          for i in 1 2 3 4 5; do
            git pull origin main -X ours --no-rebase
            git push && break
            echo "push failed (attempt $i) - another workflow pushed first, retrying"
            sleep $((RANDOM % 8 + 3))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
