name: _tmp aiven add raw_candidates

# 2026-09-24 일회성: Aiven 스탠바이 스키마에 raw_candidates 추가(스키마만, 데이터 없음).
# 클라우드 세션은 raw TCP로 Aiven에 접속 불가(docs/DB_STANDBY.md) — GH Actions
# 러너는 이미 이 서비스와 통신 검증됨(db.py Aiven 미러). 끝나면 삭제.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: PostgreSQL 17 클라이언트 설치
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: 스키마 적용
        env:
          PGCONNSTR: ${{ secrets.AIVEN_SERVICE_URI }}
        run: |
          psql "$PGCONNSTR" -v ON_ERROR_STOP=1 -f migrations/aiven_add_raw_candidates.sql
          echo "--- 확인 ---"
          psql "$PGCONNSTR" -c "\d raw_candidates"
