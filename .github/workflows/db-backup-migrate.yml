name: DB 백업 → 구글 드라이브 이전 (일회성)

# public 저장소의 Actions 아티팩트는 누구나 내려받을 수 있어 백업 저장소를 옮긴다(2026-09-22).
# 최종 백업은 구글 드라이브(영구 보관). 남은 옛 백업을 드라이브로 직접 옮긴다:
#   1) 아직 남은 GitHub 아티팩트 → 드라이브 복사 → 크기 대조 → 일치하면 아티팩트 삭제
#   2) 이미 R2로 옮겨졌던 것(파일명 newsfinal-YYYYMMDD-<run id>.dump.enc) → 드라이브 복사(R2 원본은 30일 뒤 자동 만료)
# 다 옮긴 뒤 이 파일은 삭제한다.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 도구 준비 (rclone, wrangler)
        run: |
          sudo apt-get install -y -qq rclone
          npm install -g wrangler@4 >/dev/null 2>&1

      - name: 아티팩트/R2 → 구글 드라이브
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # ⚠️ RCLONE_* 이름의 환경변수는 rclone이 자기 옵션으로 읽는다 — GDRIVE_* 이름을 쓴다.
          GDRIVE_TOKEN_DATA: ${{ secrets.RCLONE_DRIVE_TOKEN }}
        run: |
          set -uo pipefail
          BASE=$PWD
          R=${{ github.repository }}
          mkdir -p ~/.config/rclone
          python3 - <<'PY'
          import os, json, base64
          v = os.environ["GDRIVE_TOKEN_DATA"].strip()
          conf = ["[gdrive]", "type = drive", "scope = drive.file"]
          if v.startswith("{"):
              tok = v
          else:
              b = v + "=" * (-len(v) % 4)
              try: d = json.loads(base64.urlsafe_b64decode(b))
              except Exception: d = json.loads(base64.b64decode(b))
              tok = d["token"] if isinstance(d["token"], str) else json.dumps(d["token"])
              for k in ("client_id", "client_secret"):
                  if d.get(k): conf.append(f"{k} = {d[k]}")
          conf.append("token = " + tok)
          open(os.path.expanduser("~/.config/rclone/rclone.conf"), "w").write("\n".join(conf) + "\n")
          PY
          rclone lsd gdrive: >/dev/null || { echo "드라이브 접속 실패"; exit 1; }

          gh api --paginate "repos/$R/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired==false and (.name|startswith("db-backup-"))) | "\(.name) \(.id)"' > "$BASE/arts.txt"
          gh api --paginate "repos/$R/actions/workflows/db-backup.yml/runs?per_page=100&status=completed" \
            --jq '.workflow_runs[] | "\(.id) \(.created_at)"' > "$BASE/runs.txt"
          echo "남은 아티팩트 $(wc -l < "$BASE/arts.txt")개, 성공한 실행 $(wc -l < "$BASE/runs.txt")개"

          ok=0; fail=0; skipped=0
          cutoff=$(date -u -d '35 days ago' +%s)
          # 루프 안의 gh/rclone/wrangler가 stdin을 먹지 않도록 목록은 fd 3으로 읽는다
          while read -r rid created <&3; do
            ts=$(date -u -d "$created" +%s)
            [ "$ts" -lt "$cutoff" ] && continue
            d1=$(date -u -d "@$ts" +%Y%m%d); d2=$(date -u -d "@$((ts + 86400))" +%Y%m%d)
            work=$(mktemp -d); cd "$work"
            src=""; file=""; aid=""
            aid=$(awk -v n="db-backup-$rid" '$1==n {print $2}' "$BASE/arts.txt")
            if [ -n "$aid" ]; then
              if gh api "repos/$R/actions/artifacts/$aid/zip" > a.zip && unzip -q a.zip; then
                f=$(ls newsfinal-*.dump.enc | head -1); key="${f%.dump.enc}-$rid.dump.enc"; file="$f"; src=artifact
              fi
            else
              for d in "$d1" "$d2"; do
                rm -f r2.enc
                if wrangler r2 object get "newsfinal-backups/newsfinal-$d-$rid.dump.enc" --file r2.enc --remote >/dev/null 2>&1 && [ -s r2.enc ]; then
                  key="newsfinal-$d-$rid.dump.enc"; file=r2.enc; src=r2; break
                fi
              done
            fi
            if [ -z "$src" ]; then skipped=$((skipped+1)); cd "$BASE"; rm -rf "$work"; continue; fi
            size=$(stat -c %s "$file")
            if rclone copyto "$file" "gdrive:newsfinal-backups/$key" \
               && [ "$(rclone lsl "gdrive:newsfinal-backups/$key" | awk '{print $1}')" = "$size" ]; then
              if [ "$src" = artifact ]; then
                gh api -X DELETE "repos/$R/actions/artifacts/$aid" >/dev/null \
                  && echo "OK   [$src] run $rid -> $key ($size bytes), 아티팩트 삭제" \
                  || { echo "WARN [$src] run $rid 복사 OK, 아티팩트 삭제 실패"; }
              else
                echo "OK   [$src] run $rid -> $key ($size bytes)"
              fi
              ok=$((ok+1))
            else
              echo "FAIL [$src] run $rid $key : 드라이브 복사/크기 대조 실패 — 원본 유지"; fail=$((fail+1))
            fi
            cd "$BASE"; rm -rf "$work"
          done 3< "$BASE/runs.txt"
          echo "완료: 성공 $ok, 실패 $fail, 건너뜀(해당 파일 없음) $skipped"
          rclone size gdrive:newsfinal-backups
          [ "$fail" -eq 0 ]
