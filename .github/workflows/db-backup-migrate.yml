name: DB 백업 아티팩트 → R2 이전 (일회성)

# public 저장소의 Actions 아티팩트는 누구나 내려받을 수 있어 백업 저장소를 R2 비공개 버킷으로 옮겼다.
# 남아 있는 옛 아티팩트를 R2로 복사하고, 왕복 대조가 일치한 것만 아티팩트에서 삭제한다.
# 다 옮긴 뒤 이 파일은 삭제한다.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 아티팩트 → R2 복사 → 대조 → 삭제
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          R=${{ github.repository }}
          gh api --paginate "repos/$R/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired==false and (.name|startswith("db-backup-"))) | "\(.id) \(.name)"' > list.txt
          echo "이전 대상: $(wc -l < list.txt)개"
          ok=0; fail=0
          while read -r id name; do
            work=$(mktemp -d); cd "$work"
            if gh api "repos/$R/actions/artifacts/$id/zip" > a.zip && unzip -q a.zip; then
              f=$(ls newsfinal-*.dump.enc | head -1)
              key="${f%.dump.enc}-${name#db-backup-}.dump.enc"
              if npx --yes wrangler@4 r2 object put "newsfinal-backups/$key" --file "$f" --remote >/dev/null \
                 && npx --yes wrangler@4 r2 object get "newsfinal-backups/$key" --file rt.enc --remote >/dev/null \
                 && cmp -s "$f" rt.enc; then
                gh api -X DELETE "repos/$R/actions/artifacts/$id" >/dev/null
                echo "OK   $name -> $key ($(stat -c %s "$f") bytes), 아티팩트 삭제"
                ok=$((ok+1))
              else
                echo "FAIL $name : R2 업로드/대조 실패 — 아티팩트 유지"; fail=$((fail+1))
              fi
            else
              echo "FAIL $name : 다운로드 실패 — 아티팩트 유지"; fail=$((fail+1))
            fi
            cd - >/dev/null; rm -rf "$work"
          done < list.txt
          echo "완료: 성공 $ok, 실패 $fail"
          [ "$fail" -eq 0 ]
