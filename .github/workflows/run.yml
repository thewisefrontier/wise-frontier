name: NewsFinal - Auto Run

on:
  # 2026-08-27: GitHub 자체 schedule 트리거가 11:11~18:47(7시간 반) 동안
  # 단 한 번도 안 쐈던 사고 발생(이미 2026-07-29, 08-03에도 같은 유형의
  # 누락이 반복됐었음 — 이중 cron으로도 못 막음). schedule 트리거를 완전히
  # 제거하고 외부 크론 핑 서비스(cron-job.org, wise-frontier-trigger 잡)가
  # workflow_dispatch를 30분마다 호출하는 방식으로 전환(newsissue 프로젝트의
  # fetch_news.yml에서 2026-08-19에 먼저 적용해 검증된 패턴).
  # ⚠️ cron-job.org 계정/토큰 상태가 죽으면 이 파이프라인 전체가 같이
  # 멈춘다 — 가끔 확인할 것.
  workflow_dispatch:

permissions:
  contents: write

env:
  # Python은 stdout이 TTY가 아니면(파이프로 GH Actions에 잡힐 때가 그렇다)
  # 기본이 블록 버퍼링이라, print()가 즉시 안 나오고 수백~수천 줄이 한 번에
  # 몰려 나온다. 이 때문에 "Gemini 요약 고도화"가 20분 타임아웃으로 강제
  # 종료됐는데도 로그엔 아무 출력이 없어 실제로 멈춘 건지 일만 하고
  # 있었는지조차 구분이 안 됐다(2026-09-22, 원인 조사 중 발견). 언버퍼드로
  # 강제해 타임아웃/행 진단이 실시간으로 가능하게 한다.
  PYTHONUNBUFFERED: "1"

# ⚠️ 2026-09-22 아키텍처 변경: 단일 job + 단일 concurrency였던 걸 job 2개로
# 쪼갰다(collectors / heavy, 아래 jobs: 참고). 그 결과 워크플로우 레벨
# concurrency는 더 이상 안 쓴다 — 각 job이 자기 concurrency를 따로 갖는다.
# 경위: 가드로 "무거운 스텝만" 60분 제한을 걸어도 수집 계열(RSS·GDELT·
# 국내뉴스 등)이 같은 job 안에 같이 있으면 무거운 사이클(당시 실측 90분
# 안팎)이 끝날 때까지 큐에서 대기해야 했다(실측: 한 디스패치가 23분
# 대기 후 시작). 사용자 지적("RSS+GDELT 이걸 메인에서 분리해서 따로
# 돌리자고")으로 job 자체를 분리 — 이제 수집 계열은 무거운 계열이 뭘
# 하든 상관없이 자기 concurrency 큐에서 30분마다 돈다.
jobs:
  # ── 수집/집필 계열 — git 커밋 없이 DB만 쓰는 멱등적 작업 ──────────────
  # 전부 (a) 링크/클러스터키 유니크 제약 등으로 재실행에 안전하고 (b) 서로도
  # 무거운 계열과도 같은 사이클 안에서 순서를 지켜야 할 실제 의존성이 없다
  # (코드로 확인: domestic_kr_writer는 DB 현재 상태만 읽고, multilang_translate도
  # DomesticKR-Synth를 그때그때 조회, gemini_summarizer의 외부 트렌드 감지는
  # GDELT API를 직접 호출해 이 job의 GDELT 수집과 무관, explainer_writer는
  # DAILY_CAP=1이라 자주 돌아도 실제 생성은 하루 한 번뿐). 그래서 가드 없이
  # 무조건 실행 — heavy job의 60분 제한과 무관하게 디스패치(30분)마다 돈다.
  collectors:
    runs-on: ubuntu-latest
    concurrency:
      group: newsfinal-collectors
      cancel-in-progress: false
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: RSS 수집 (큐 적재 전용)
        # 수집/발송을 합쳐 15분+ 걸리던 구조를 분리 — 수집만 하면 40 워커 기준
        # 1200+ 소스도 3분 내 끝난다(rss_split_test.yml 실전 검증, 2026-09-22).
        # 그래도 동일한 이유(개별 소스 hang)로 안전장치는 유지.
        timeout-minutes: 15
        continue-on-error: true
        run: python scripts/rss_collector.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: RSS 큐 처리 및 발송
        timeout-minutes: 20
        continue-on-error: true
        run: python scripts/rss_processor.py
        env:
          # 2026-09-22 1500→1000, 2026-09-23 2000→1200: 병렬화(10워커)+큐
          # 1000행 상한 페이지네이션 제거까지 했는데도 2000을 20분 안에 못
          # 채우고 다시 타임아웃(원인: 텔레그램 429 방지를 위해 발송 자체를
          # 초당 1건으로 직렬화했다 — rss_fetcher.py TELEGRAM_MIN_INTERVAL,
          # CHAT_ID가 단일 채널이라 이게 진짜 근본 병목). 발송만 놓고 보면
          # 20분에 최대 약 1,140건(1200*60/1.05)이 물리적 한계라 그 아래로
          # 잡는다. 안전장치는 여전히 개수가 아니라 timeout-minutes(그
          # 시점까지 처리분은 queue_delete로 이미 반영돼 유실 없음).
          MAX_PROCESS_PER_RUN: "1200"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: GDELT 글로벌 뉴스 검색 수집 (2026-09-08 신설)
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/gdelt_fetcher.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: 국내(한국) 뉴스 수집 — 다국어 채널 전용 (2026-09-08 신설)
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/domestic_kr_fetcher.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}

      - name: 국내기사 클러스터링·집필 — 다국어 채널 전용 (2026-09-15 신설)
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/domestic_kr_writer.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: 머니파이널 미국 시장뉴스 수집 (2026-09-03 신설)
        continue-on-error: true
        run: python scripts/market_news_fetcher.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MONEYFINAL_FEED_KEY: ${{ secrets.MONEYFINAL_FEED_KEY }}

      - name: 이슈 파이널(해설) 초안 작성 — 어드민 검토 후 발행 (2026-09-22 신설)
        # DAILY_CAP=1(explainer_writer.py) — 자주 돌아도 하루 한 번만 실제 생성,
        # 나머지 호출은 "이미 작성 — 스킵"으로 즉시 끝난다.
        timeout-minutes: 10
        continue-on-error: true
        run: python scripts/explainer_writer.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_L: ${{ secrets.NVIDIA_API_KEY_L }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: 다국어 채널 번역 배치 (2026-09-08 신설)
        # DomesticKR-Synth 중 article_translations에 언어 4개가 아직 안 채워진
        # 것만 골라 번역하는 멱등적 배치 — 원본(국내기사 집필)은 바로 위에서
        # 매 실행 돌고 있어 재료가 항상 쌓여 있다.
        timeout-minutes: 10
        continue-on-error: true
        run: python scripts/multilang_translate.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_L: ${{ secrets.NVIDIA_API_KEY_L }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  # ── 속보 경로 (2026-09-23 신설) ──────────────────────────────────────
  # 사용자 지적: "순차적으로 돌던가, 분리해야 하는거 아냐?" — collectors와
  # heavy를 완전히 분리하니, 수집 직후 들어온 진짜 속보가 heavy의 60분
  # 배치까지 묻히는 문제가 생겼다. needs: [collectors]로 진짜 순차 연결 —
  # collectors가 끝난 직후, 방금 모은 신선한 데이터를 바로 이어받아 중대성
  # 높은 클러스터 1~2개만 즉시 써서 발행한다(gemini_writer.py run_breaking).
  # 가드 없이 디스패치(30분)마다 돌지만, heavy가 이미 처리한 클러스터는
  # run()의 기존 SKIP 분기가 걸러줘 중복 집필 없음. 나머지 일반 기사는
  # 그대로 heavy가 시간당 배치로 처리.
  breaking:
    needs: collectors
    runs-on: ubuntu-latest
    concurrency:
      group: newsfinal-breaking
      cancel-in-progress: false
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 속보 판단 및 즉시 발행
        timeout-minutes: 10
        continue-on-error: true
        run: python scripts/gemini_writer.py --breaking
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}

  # ── 무거운 계열 — Gemini 클러스터링·집필 + 사이트 반영/커밋 ────────────
  # 이 job만 60분 가드가 걸린다. 실측(2026-09-22, collectors 분리 후) 총
  # 55~61분 안팎 — 30분 디스패치 격자 + 가드 임계 60분과 맞물려 시간당
  # 1회 안팎으로 자연 수렴한다(사용자 2026-09-09 결정: "한 시간에 한 번").
  heavy:
    runs-on: ubuntu-latest
    concurrency:
      group: newsfinal-heavy
      cancel-in-progress: false
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5
        with:
          # ⚠️ ref를 명시하지 않으면 actions/checkout이 기본으로 github.sha를 쓰는데,
          # 이건 "이 워크플로우가 트리거된 시점"의 SHA로 고정된다. concurrency가 두 번째
          # 실행을 대기시키는 동안 대기 중인 실행의 SHA가 옛 상태로 굳어버려서, 실제로
          # 잡이 시작될 땐 원격에 새 커밋이 올라가 있어도 그 커밋이 없는 옛 상태를
          # 체크아웃한다. 그 결과 가드가 "직전 사이클 없음"으로 오판해 25~30분 만에
          # 풀 런이 중복 실행됐다(실사고 2026-08-09~10, 하루 6회 이상 관측).
          # ref를 브랜치명으로 명시하면 잡이 실제로 시작되는 시점에 최신 상태를 다시 조회한다.
          ref: main
          # 가드가 git log로 직전 사이클 완료 시각을 읽어야 하므로 히스토리 확보.
          # 사이클당 커밋 2건 안팎이라 100이면 이틀치 이상이다.
          fetch-depth: 100

      # 임계 60분(2026-09-09 사용자 결정: "그냥 심플하게 한시간에 한번은
      # 돌아가도록"). 트리거가 30분 격자라 임계와 무관하게 최대 30분의
      # 반올림이 더 붙는다.
      #
      # ⚠️ 이 가드가 지키려는 대상이 시간이 지나며 계속 바뀌었다 — 히스토리:
      # 2026-08-06 100분(그 시절 GitHub 자체 schedule 트리거의 잦은 누락 때문,
      # 지금은 외부 cron-job.org라 무관) → 2026-09-09 60분으로 완화, 그런데
      # GDELT/국내뉴스 신설로 사이클이 2시간+로 늘어난 사고 발생(원인수정:
      # 커서 순환 도입) → 2026-09-22 RSS 수집/처리 신설로 무거운 스텝 총합이
      # 다시 60분을 넘어 사이클 간격이 135분까지 벌어짐. 그런데 그 조사 중
      # 9/20~9/21(RSS 분리 이전) 기록을 실측해보니 이미 그때부터 평균 122분
      # (108~134분)이었다는 게 드러나 "RSS가 회귀를 일으켰다"는 진단은 틀렸고,
      # 원래도 무거운 스텝 자체(수집 계열 포함 8개 순차 실행) 합계가 60분을
      # 넘고 있었던 게 진짜 원인이었다. 최종 조치: 수집 계열(RSS·GDELT·
      # 국내뉴스·국내집필·market news·이슈파이널·다국어번역)을 아예 별도
      # job(collectors, 위 참고)으로 분리 — 이 job엔 이제 진짜 Gemini
      # 클러스터링·집필과 사이트 반영만 남아 60분 안에 다시 들어온다(실측
      # 55~61분). 사용자 지적("RSS+GDELT 이걸 메인에서 분리해서 따로
      # 돌리자고")으로 job 분리까지 진행.
      - name: 중복 실행 가드 (직전 사이클 완료 후 60분 미만이면 스킵)
        id: guard
        run: |
          last=$(git log -1 --format=%cI --grep='^Update articles & state$' || true)
          if [ -z "$last" ]; then
            echo "직전 사이클 커밋 없음 -> 진행"
            exit 0
          fi
          d=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 60 ))
          echo "직전 사이클 완료: $last (${d}분 전)"
          if [ "$d" -lt 60 ]; then
            echo "60분 이내 -> 이번 실행은 작업 없이 통과(success)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Python 설정
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Gemini 요약 고도화
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 20
        continue-on-error: true
        run: python scripts/gemini_summarizer.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}

      - name: API 한도 대기 (60초)
        if: steps.guard.outputs.skip != 'true'
        run: sleep 60

      - name: Gemini 자체 기사 생성 (30분마다 클러스터 감지)
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 15
        continue-on-error: true
        run: python scripts/gemini_writer.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}

      - name: 경제 일정 금리결정 기사 자동생성
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 10
        continue-on-error: true
        run: python scripts/econ_writer.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}

      - name: 주간 시세 카드 — 토요일 10시(KST) 이후 주 1회, 결정론적 집계 (2026-09-22 신설)
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 5
        continue-on-error: true
        run: python scripts/weekly_market_card.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: 주간 정리 초안 — 일요일 20시(KST) 이후 주 1회, 어드민 검토 후 발행 (2026-09-22 신설)
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 10
        continue-on-error: true
        run: python scripts/weekly_recap_writer.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_L: ${{ secrets.NVIDIA_API_KEY_L }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: 웹사이트 데이터 내보내기
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/export_articles.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: 다국어 채널 데이터 내보내기 (2026-09-08 신설)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: python scripts/export_global.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: 변경사항 커밋 및 푸시 (docs/ + state)
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update articles & state"
          git pull origin main --rebase --strategy-option=theirs || true
          git push --force-with-lease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
