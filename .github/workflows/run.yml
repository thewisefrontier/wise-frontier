name: NewsFinal - Auto Run

on:
  # 2026-08-27: GitHub 자체 schedule 트리거가 11:11~18:47(7시간 반) 동안
  # 단 한 번도 안 쐈던 사고 발생(이미 2026-07-29, 08-03에도 같은 유형의
  # 누락이 반복됐었음 — 이중 cron으로도 못 막음). schedule 트리거를 완전히
  # 제거하고 외부 크론 핑 서비스(cron-job.org, wise-frontier-trigger 잡)가
  # workflow_dispatch를 30분마다 호출하는 방식으로 전환(newsissue 프로젝트의
  # fetch_news.yml에서 2026-08-19에 먼저 적용해 검증된 패턴).
  # ⚠️ cron-job.org 계정/토큰 상태가 죽으면 이 파이프라인 전체가 같이
  # 멈춘다 — 가끔 확인할 것.
  workflow_dispatch:

permissions:
  contents: write

# 동시 실행 방지 — 이전 실행이 끝날 때까지 대기시킨다.
# (true로 두면 :17 실행이 :47에 중도 취소되어 작업이 잘린다)
concurrency:
  group: newsfinal-auto-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # 2026-09-22: Python은 stdout이 TTY가 아니면(파이프로 GH Actions에
      # 잡힐 때가 그렇다) 기본이 블록 버퍼링이라, print()가 즉시 안 나오고
      # 수백~수천 줄이 한 번에 몰려 나온다. 이 때문에 "Gemini 요약 고도화"가
      # 20분 타임아웃으로 강제 종료됐는데도 로그엔 아무 출력이 없어 실제로
      # 멈춘 건지 일만 하고 있었는지조차 구분이 안 됐다(원인 조사 중 발견).
      # 언버퍼드로 강제해 앞으로는 타임아웃/행 진단이 실시간으로 가능하게 한다.
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5
        with:
          # ⚠️ ref를 명시하지 않으면 actions/checkout이 기본으로 github.sha를 쓰는데,
          # 이건 "이 워크플로우가 트리거된 시점"의 SHA로 고정된다. concurrency가 두 번째
          # 실행을 대기시키는 동안(:17 실행 ~27분 소요, :47 실행은 그동안 대기) 대기 중인
          # 실행의 SHA는 이미 :47 시점(첫 실행이 아직 커밋 전)으로 굳어버려서, 실제로 잡이
          # 시작될 땐 원격에 새 커밋이 올라가 있어도 그 커밋이 없는 옛 상태를 체크아웃한다.
          # 그 결과 가드가 "직전 사이클 없음"으로 오판해 25~30분 만에 풀 런이 중복 실행됐다
          # (실사고 2026-08-09~10, 하루 6회 이상 관측: 18:17→18:42, 15:24→15:49 등).
          # ref를 브랜치명으로 명시하면 잡이 실제로 시작되는 시점에 최신 상태를 다시 조회한다.
          ref: main
          # 가드가 git log로 직전 사이클 완료 시각을 읽어야 하므로 히스토리 확보.
          # 사이클당 커밋 2건 안팎이라 100이면 이틀치 이상이다.
          fetch-depth: 100

      # 무거운(가드 대상) 스텝까지 다 도는 실행은 90분 안팎 걸린다(2026-09-22
      # 실측). 스케줄은 30분 간격(:17/:47)이라 트리거 대부분은 무거운 작업 없이
      # 흘려보내야 한다. 그 방법이 이 가드다(RSS 수집/처리는 가드 대상이 아니라
      # 매번 돈다 — 아래 상세 설명 참고).
      #
      # ⚠️ 정정(2026-09-22): 바로 아래 "RSS 수집/처리 신설로 135분까지 벌어짐"
      # 주석은 원인 진단이 틀렸었다. 9/20~9/21(RSS 분리 이전) 커밋 간격을
      # 실측하니 표본 19개 평균 122분(108~134분)으로 이미 그때부터 이 범위였다
      # — RSS와 무관하게 애초에 무거운 스텝 자체(GDELT+국내뉴스+국내집필+
      # 요약고도화+자체기사+econ+이슈파이널+번역배치, RSS 빼고도 합계
      # 77~95분)가 60분 목표를 넘어서고 있었다. RSS를 가드에서 뺀 수정
      # 자체는 유효하다(RSS가 이제 무거운 사이클을 안 기다리고 30분마다
      # 확실히 돈다) — 다만 "60분→135분 회귀를 고쳤다"가 아니라 "RSS도
      # 120분에 한 번만 돌던 걸 고쳤다"로 정정. 무거운 체인 자체의 90분
      # 문제는 별도 원인 조사 대상(2026-09-22 사용자 지시로 착수).
      #
      # 이전 방식은 `gh run cancel` + `exit 1`이라 스킵될 때마다 run이 failed/cancelled로
      # 남아 알림이 계속 울렸고, sleep 120이 하루 약 48분의 러너 시간을 태웠다.
      # run 상태(status=success) 대신 '직전 사이클의 커밋 시각'을 기준으로 바꾸면
      # 스킵된 run을 success로 끝내도 기준이 오염되지 않는다 — 스킵은 커밋을 남기지 않기 때문.
      # 그래서 자기 취소가 필요 없어졌고, actions: write 권한도 뺐다.
      #
      # ⚠️ 기준점이 바뀐 점에 주의. 종전 45분은 성공 run의 '시작' 시각 기준이었고,
      #    지금 100분은 커밋 = '완료' 시각 기준이다. 같은 숫자라도 의미가 다르다.
      #
      # 임계 60분(2026-09-09 사용자 결정: "그냥 심플하게 한시간에 한번은
      # 돌아가도록"). 종전 100분(2026-08-06 결정)은 그 시절 GitHub 자체
      # schedule 트리거의 잦은 누락 때문이었는데, 지금은 cron-job.org가
      # 외부에서 30분 격자로 안정적으로 호출하는 구조라 그 이유가 더 이상
      # 적용되지 않는다. 트리거가 30분 격자라 임계와 무관하게 최대 30분의
      # 반올림이 더 붙는다. ⚠️ 2026-09-09 GDELT/국내뉴스 수집 신설로 사이클이
      # 한때 2시간+로 늘어난 사고가 있었음(원인 수정 완료 — 커서 순환 도입).
      # 임계를 60분으로 낮췄으니 사이클 소요시간이 다시 늘어나면 겹쳐 돌 수
      # 있다(concurrency로 순차 대기는 되지만 밀릴 수 있음) — 지켜볼 것.
      #
      # ⚠️ 2026-09-22 재발: 바로 이 경고대로 됐다. RSS 수집/처리(collector/
      # processor) 신설로 사이클 총 소요가 65분까지 늘어 60분 가드를 넘겼고,
      # "가드 통과 → 65분 실행 → 다음 30분 디스패치는 대기열에 밀렸다가 그다음
      # 디스패치에 밀려 취소"가 반복되며 실제 사이클 간격이 135분까지 벌어짐
      # (실측). 이번엔 임계를 더 낮추는 대신, RSS 수집/처리를 이 가드 대상에서
      # 빼서(아래 4개 스텝) 30분마다 무조건 돌게 하고 무거운 나머지만 이
      # 가드로 시간당 1회를 지키는 쪽으로 수정 — RSS는 git 커밋이 없는
      # 멱등적 DB 작업이라 애초에 이 가드가 지키는 대상(중복 커밋 방지)이 아니었다.
      - name: 중복 실행 가드 (무거운 스텝만 대상 — 직전 사이클 완료 후 60분 미만이면 스킵)
        id: guard
        run: |
          last=$(git log -1 --format=%cI --grep='^Update articles & state$' || true)
          if [ -z "$last" ]; then
            echo "직전 사이클 커밋 없음 -> 진행"
            exit 0
          fi
          d=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 60 ))
          echo "직전 사이클 완료: $last (${d}분 전)"
          if [ "$d" -lt 60 ]; then
            echo "60분 이내 -> RSS 수집/처리만 실행, 나머지(무거운 스텝)는 통과(success)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # ⚠️ 2026-09-22: 아래 Python 설정부터 "RSS 큐 처리"까지 4개 스텝은 가드를
      # 안 건다(무조건 실행). 이유: RSS 수집/처리는 git 커밋을 안 남기고 DB만
      # 쓰는 멱등적 작업(링크 유니크 제약 + 큐 delete)이라 60분 가드가 막을
      # 이유가 없는데, 여기 걸려 있는 바람에 RSS가 무거운 사이클(90분 안팎,
      # 위 가드 스텝 주석 참고 — RSS와 무관하게 원래도 60분을 넘던 문제)과
      # 같은 주기로만 돌고 있었다. 큐 적체 실측 8,400건(가장 오래된 건 6시간+)
      # 으로 확인됨. RSS만 30분마다(디스패치 주기 그대로) 따로 돌리고, 무거운
      # 나머지(요약 고도화·자체기사·econ·export+커밋)는 기존 60분 가드를
      # 그대로 유지해 시간당 1회 의도를 지킨다.
      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: RSS 수집 (큐 적재 전용, 2026-09-22 수집/집필 분리)
        # 수집/발송을 합쳐 15분+ 걸리던 구조를 분리 — 수집만 하면 40 워커 기준
        # 1200+ 소스도 3분 내 끝난다(rss_split_test.yml 실전 검증, 2026-09-22).
        # 그래도 동일한 이유(개별 소스 hang)로 안전장치는 유지. 2026-09-22
        # 10분→15분: RSS를 30분마다 무조건 돌리기 시작한 직후 실행 중 한 번
        # 10분 타임아웃에 걸림(일시적인지 30분 주기 자체 부하인지 아직 불명) —
        # 여유를 늘려 지켜본다. continue-on-error라 타임아웃 나도 뒷 스텝은 진행됨.
        timeout-minutes: 15
        continue-on-error: true
        run: python scripts/rss_collector.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: RSS 큐 처리 및 발송 (2026-09-22 수집/집필 분리)
        timeout-minutes: 20
        continue-on-error: true
        run: python scripts/rss_processor.py
        env:
          # 2026-09-22 실사고로 1500→1000 정정. 항목 하나당 크롤링→번역→번역→
          # 텔레그램→DB저장을 순차 처리해 실측 처리량이 15분에 200건(시간당
          # 800건)뿐이었다 — 1500은 도달 불가능한 상한이었고 그사이 큐가
          # 8,400→10,698건으로 늘어나는 걸 보고 발견했다(rss_processor.py의
          # 병렬화로 같이 대응). 1000인 이유: queue_claim_batch가 PostgREST
          # 서버 기본 행 상한(추정 db-max-rows=1000)에 걸려 1500을 요청해도
          # 실제로는 1000건만 돌아왔다 — 그 이상 올리려면 페이지네이션부터
          # 추가해야 하므로, 지금은 실제로 받아오는 만큼만 상한값도 맞춘다.
          MAX_PROCESS_PER_RUN: "1000"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: GDELT 글로벌 뉴스 검색 수집 (2026-09-08 신설)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/gdelt_fetcher.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: 국내(한국) 뉴스 수집 — 다국어 채널 전용 (2026-09-08 신설)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/domestic_kr_fetcher.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}

      - name: 국내기사 클러스터링·집필 — 다국어 채널 전용 (2026-09-15 신설)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/domestic_kr_writer.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: 머니파이널 미국 시장뉴스 수집 (2026-09-03 신설)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: python scripts/market_news_fetcher.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MONEYFINAL_FEED_KEY: ${{ secrets.MONEYFINAL_FEED_KEY }}

      - name: Gemini 요약 고도화
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 20
        continue-on-error: true
        run: python scripts/gemini_summarizer.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}

      - name: API 한도 대기 (60초)
        if: steps.guard.outputs.skip != 'true'
        run: sleep 60

      - name: Gemini 자체 기사 생성 (30분마다 클러스터 감지)
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 15
        continue-on-error: true
        run: python scripts/gemini_writer.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}

      - name: 경제 일정 금리결정 기사 자동생성
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 10
        continue-on-error: true
        run: python scripts/econ_writer.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}

      - name: 이슈 파이널(해설) 초안 작성 — 어드민 검토 후 발행 (2026-09-22 신설)
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 10
        continue-on-error: true
        run: python scripts/explainer_writer.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
