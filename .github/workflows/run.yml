name: NewsFinal - Auto Run

on:
  schedule:
    # 매시 47분. 정각(0분)은 전 세계 저장소가 몰려 GitHub이 예약 실행을
    # 지연·누락시키는 구간이라 옮김(2026-07-29: 14개 시간대 중 8회만 실행,
    # 08:27~12:21 4시간 공백 실측). 다른 워크플로우와도 분 단위로 분리:
    #   :10/:40 backfill, :20 weather, :30 oil_price → :47 사용
    # 2026-08-03: :47 단독으로도 누락 재발(10:18 이후 3사이클 공백).
    # 이중화 + 아래 '중복 실행 가드'로 45분 이내 재실행은 스스로 취소.
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# 동시 실행 방지 — 이전 실행이 끝날 때까지 대기시킨다.
# (true로 두면 :17 실행이 :47에 중도 취소되어 작업이 잘린다)
concurrency:
  group: newsfinal-auto-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5
        with:
          # 가드가 git log로 직전 사이클 완료 시각을 읽어야 하므로 히스토리 확보.
          # 사이클당 커밋 2건 안팎이라 100이면 이틀치 이상이다.
          fetch-depth: 100

      # 스케줄이 30분 간격(:17/:47)인데 1사이클 실제 소요는 121~136분이다
      # (2026-08-05 실측: 12:58→15:13 135분, 15:13→17:29 136분, 17:29→19:30 121분).
      # 즉 트리거 4~5회 중 1회만 실제로 일한다. 나머지를 어떻게 흘려보내느냐가 관건.
      #
      # 이전 방식은 `gh run cancel` + `exit 1`이라 스킵될 때마다 run이 failed/cancelled로
      # 남아 알림이 계속 울렸고, sleep 120이 하루 약 48분의 러너 시간을 태웠다.
      # run 상태(status=success) 대신 '직전 사이클의 커밋 시각'을 기준으로 바꾸면
      # 스킵된 run을 success로 끝내도 기준이 오염되지 않는다 — 스킵은 커밋을 남기지 않기 때문.
      # 그래서 자기 취소가 필요 없어졌고, actions: write 권한도 뺐다.
      #
      # 임계 100분: 실측 최소 간격이 121분이라 종전 45분은 사실상 의미가 없었다.
      - name: 중복 실행 가드 (직전 사이클 완료 후 100분 미만이면 스킵)
        id: guard
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%cI --grep='^Update articles & state$' || true)
          if [ -z "$last" ]; then
            echo "직전 사이클 커밋 없음 -> 진행"
            exit 0
          fi
          d=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 60 ))
          echo "직전 사이클 완료: $last (${d}분 전)"
          if [ "$d" -lt 100 ]; then
            echo "100분 이내 -> 이번 실행은 작업 없이 통과(success)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Python 설정
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: RSS 수집 및 발송
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/rss_fetcher.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Gemini 요약 고도화
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 20
        continue-on-error: true
        run: python scripts/gemini_summarizer.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: API 한도 대기 (60초)
        if: steps.guard.outputs.skip != 'true'
        run: sleep 60

      - name: Gemini 자체 기사 생성 (30분마다 클러스터 감지)
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 15
        continue-on-error: true
        run: python scripts/gemini_writer.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: 경제 일정 금리결정 기사 자동생성
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 10
        continue-on-error: true
        run: python scripts/econ_writer.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: 웹사이트 데이터 내보내기
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/export_articles.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: 변경사항 커밋 및 푸시 (docs/ + state)
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update articles & state"
          git pull origin main --rebase --strategy-option=theirs || true
          git push --force-with-lease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
