name: The Wise Frontier - Auto Run

on:
  schedule:
    - cron: '0,30 * * * *'   # 30분마다 (RSS 수집 + 요약)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: RSS 수집 및 발송
        run: python scripts/rss_fetcher.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Gemini 요약 고도화
        timeout-minutes: 3
        continue-on-error: true
        run: python scripts/gemini_summarizer.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: API 한도 대기 (60초)
        run: sleep 60

      - name: Gemini 자체 기사 생성 (30분마다 클러스터 감지)
        timeout-minutes: 5
        continue-on-error: true
        run: python scripts/gemini_writer.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 웹사이트 데이터 내보내기
        run: python scripts/export_articles.py

      - name: wise-frontier-web에 articles.json 푸시
        run: |
          git clone https://x-access-token:${{ secrets.WEB_PUSH_TOKEN }}@github.com/thewisefrontier/wise-frontier-web.git web_repo
          mkdir -p web_repo/data
          cp docs/data/articles.json web_repo/data/articles.json
          cp docs/data/market_data.json web_repo/data/market_data.json
          cd web_repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/articles.json data/market_data.json
          git diff --staged --quiet || git commit -m "Update articles"
          git pull --rebase origin main
          git push

      - name: 상태 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/state.json data/articles.db
          git diff --staged --quiet || git commit -m "Update state and DB"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
