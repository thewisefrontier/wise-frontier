name: The Wise Frontier - Auto Run

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: RSS 수집 및 발송
        run: python scripts/rss_fetcher.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

      - name: 웹사이트 데이터 내보내기
        run: python scripts/export_articles.py

      - name: 상태 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/state.json data/articles.db docs/data/articles.json
          git diff --staged --quiet || git commit -m "Update state, DB and website data"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
