name: NewsFinal - Auto Run

on:
  schedule:
    # 매시 47분. 정각(0분)은 전 세계 저장소가 몰려 GitHub이 예약 실행을
    # 지연·누락시키는 구간이라 옮김(2026-07-29: 14개 시간대 중 8회만 실행,
    # 08:27~12:21 4시간 공백 실측). 다른 워크플로우와도 분 단위로 분리:
    #   :10/:40 backfill, :20 weather, :30 oil_price → :47 사용
    # 2026-08-03: :47 단독으로도 누락 재발(10:18 이후 3사이클 공백).
    # 이중화 + 아래 '중복 실행 가드'로 45분 이내 재실행은 스스로 취소.
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # 가드가 자기 자신을 취소하는 데 필요

# 동시 실행 방지 — 이전 실행이 끝날 때까지 대기시킨다.
# (true로 두면 :17 실행이 :47에 중도 취소되어 작업이 잘린다)
concurrency:
  group: newsfinal-auto-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: 중복 실행 가드 (45분 이내 성공분 있으면 자기 취소)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/run.yml/runs?status=success&per_page=1" \
                 --jq '.workflow_runs[0].created_at // empty' || true)
          if [ -n "$last" ]; then
            d=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 60 ))
            echo "마지막 성공 실행: $last (${d}분 전)"
            if [ "$d" -lt 45 ]; then
              echo "45분 이내 실행됨 -> 이번 실행 취소(cancelled 로 남겨 연쇄 스킵 방지)"
              gh run cancel ${{ github.run_id }}
              sleep 120
              exit 1
            fi
          else
            echo "이전 성공 실행 없음 -> 진행"
          fi

      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: RSS 수집 및 발송
        run: python scripts/rss_fetcher.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Gemini 요약 고도화
        timeout-minutes: 20
        continue-on-error: true
        run: python scripts/gemini_summarizer.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: API 한도 대기 (60초)
        run: sleep 60

      - name: Gemini 자체 기사 생성 (30분마다 클러스터 감지)
        timeout-minutes: 15
        continue-on-error: true
        run: python scripts/gemini_writer.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: 경제 일정 금리결정 기사 자동생성
        timeout-minutes: 10
        continue-on-error: true
        run: python scripts/econ_writer.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: 웹사이트 데이터 내보내기
        run: python scripts/export_articles.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: 변경사항 커밋 및 푸시 (docs/ + state)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update articles & state"
          git pull origin main --rebase --strategy-option=theirs || true
          git push --force-with-lease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
