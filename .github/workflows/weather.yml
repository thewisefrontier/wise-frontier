name: NewsFinal - Daily Weather

on:
  # 2026-08-27: run.ymlÍ≥??ôÏùº???¥Ïú†Î°?GitHub ?êÏ≤¥ schedule ?∏Î¶¨Í±??úÍ±∞,
  # ?∏Î? ?¨Î°†(cron-job.org, wise-frontier-trigger ????workflow_dispatchÎ°?
  # ?ÑÌôò. ?§ÌÅ¨Î¶ΩÌä∏ ?êÏ≤¥Í∞Ä Íµ??Î≥??ÑÏ? ?ÑÏπ® ?úÍ∞Ñ???êÎã®??Î∞úÌñâ ?¨Î?Î•?
  # Í≤∞Ï†ï?òÎ?Î°? ?∏Ï∂ú Ï£ºÍ∏∞???¥Ï†Ñ ?§Ï?Ï§?Îß§Ïãú 20¬∑50Î∂?Í≥?ÎπÑÏä∑?òÍ≤å 30Î∂?
  # Í∞ÑÍ≤©?ºÎ°ú ÎßûÏ∂îÎ©??úÎã§.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsfinal-weather
  cancel-in-progress: false

jobs:
  weather:
    runs-on: ubuntu-latest

    steps:
      - name: ÏΩîÎìú Ï≤¥ÌÅ¨?ÑÏõÉ
        uses: actions/checkout@v5

      - name: Python ?§Ï†ï
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: ?®ÌÇ§ÏßÄ ?§Ïπò
        run: pip install -r requirements.txt

      - name: ?†Ïî® Î¶¨Ìè¨???ùÏÑ± (Íµ??Î≥??ÑÏ? ?ÑÏπ® ?úÍ∞Ñ?êÎßå Î∞úÌñâ, ?úÍµ≠?Ä Í∏∞ÏÉÅÏ≤??®Í∏∞?àÎ≥¥ ?∞ÏÑ†)
        run: python scripts/weather_report.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
          KMA_BRIEFING_KEY: ${{ secrets.KMA_BRIEFING_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

      - name: ?πÏÇ¨?¥Ìä∏ ?∞Ïù¥???¥Î≥¥?¥Í∏∞
        run: python scripts/export_articles.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}

      - name: Î≥ÄÍ≤ΩÏÇ¨??Ïª§Î∞ã Î∞??∏Ïãú
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update weather reports"
          for i in 1 2 3 4 5; do
            git pull origin main -X ours --no-rebase
            git push && break
            echo "push failed (attempt $i) - another workflow pushed first, retrying"
            sleep $((RANDOM % 8 + 3))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
