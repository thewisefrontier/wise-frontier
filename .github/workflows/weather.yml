name: NewsFinal - Daily Weather

on:
  # 2026-08-27: run.yml과 동일한 이유로 GitHub 자체 schedule 트리거 제거,
  # 외부 크론(cron-job.org, wise-frontier-trigger 잡)의 workflow_dispatch로
  # 전환. 스크립트 자체가 국가별 현지 아침 시간을 판단해 발행 여부를
  # 결정하므로, 호출 주기는 이전 스케줄(매시 20·50분)과 비슷하게 30분
  # 간격으로 맞추면 된다.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsfinal-weather
  cancel-in-progress: false

jobs:
  weather:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 날씨 리포트 생성 (국가별 현지 아침 시간에만 발행, 한국은 기상청 단기예보 우선)
        run: python scripts/weather_report.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
          KMA_BRIEFING_KEY: ${{ secrets.KMA_BRIEFING_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

      - name: 웹사이트 데이터 내보내기
        run: python scripts/export_articles.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update weather reports"
          for i in 1 2 3 4 5; do
            git pull origin main -X ours --no-rebase
            git push && break
            echo "push failed (attempt $i) - another workflow pushed first, retrying"
            sleep $((RANDOM % 8 + 3))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
