name: NewsFinal - RSS 소스 발굴 (주간)

on:
  workflow_dispatch:
  # 주간 저빈도 작업이라 schedule 트리거 사용 — run.yml(30분 간격 고빈도
  # 파이프라인)에서 겪은 다중시간 미발화 사고와 리스크 성격이 다르다.
  # 한 주 정도 안 돌아도 다음 주에 자연 복구되고, 지연에 민감하지 않다.
  schedule:
    - cron: '0 3 * * 1'  # 매주 월요일 03:00 UTC(한국시간 정오)

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 암호화 파일 잠금 해제(git-crypt)
        # 프롬프트·검수 코드는 git-crypt로 암호화돼 있다(2026-10-18) — 키는 시크릿 GIT_CRYPT_KEY.
        # 암호화 지정(.gitattributes)이 없으면 그냥 통과해서, 도입 전후 어느 쪽에서도 안전하다.
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          if ! grep -qs "filter=git-crypt" .gitattributes; then echo "암호화 파일 없음 — 건너뜀"; exit 0; fi
          sudo apt-get install -y -qq git-crypt >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq git-crypt >/dev/null)
          printf '%s' "$GIT_CRYPT_KEY" | base64 -d > "$RUNNER_TEMP/gc.key"
          git-crypt unlock "$RUNNER_TEMP/gc.key"
          rm -f "$RUNNER_TEMP/gc.key"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: RSS 소스 발굴·검증·검수대기 등록
        timeout-minutes: 20
        run: python scripts/rss_source_discovery.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}
