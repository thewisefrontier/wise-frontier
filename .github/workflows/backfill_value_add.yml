name: NewsFinal - Backfill Value-Add

on:
  # 2026-08-03: 백필 100% 완료(4,275/4,275)로 cron 비활성화.
  # 재개가 필요하면 아래 2줄의 주석을 해제할 것.
  # schedule:
  #   - cron: '10,40 * * * *'   # 매시 10분·40분 (run.yml 47분, weather.yml 20,50분과 겹치지 않게 오프셋)
  workflow_dispatch:

concurrency:
  group: backfill-value-add
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 3줄요약/투자아이디어 백필
        run: python scripts/backfill_value_add.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
