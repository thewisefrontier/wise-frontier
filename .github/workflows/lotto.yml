name: NewsFinal - Lottery Results Daily

# GitHub ?êÏ≤¥ schedule: ?∏Î¶¨Í±∞Í? ?†Î¢∞?????ÜÏñ¥(2026-08-29 21:00 KST ?àÏïΩÎ∂ÑÏù¥
# ?µÏß∏Î°??§ÌÇµ?òÍ≥†, ?§Ïùå??Î∂ÑÎèÑ ÏßÄ?∞Îêò???§Ï†úÎ°úÎäî 2026-08-31 00:51 KST?êÏïº ?§Ìñâ??
# cron-job.org ?∏Î? ?∏Î¶¨Í±∞Î°ú ?ÄÏ≤??§Î•∏ 5Í∞??åÌÅ¨?åÎ°ú?∞Ï? ?ôÏùº??Ï°∞Ïπò).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsfinal-lotto
  cancel-in-progress: false

jobs:
  lotto:
    runs-on: ubuntu-latest

    steps:
      - name: ÏΩîÎìú Ï≤¥ÌÅ¨?ÑÏõÉ
        uses: actions/checkout@v5

      - name: Python ?§Ï†ï
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: ?®ÌÇ§ÏßÄ ?§Ïπò
        run: pip install -r requirements.txt

      - name: Playwright Î∏åÎùº?∞Ï? ?§Ïπò (Î°úÎòê Ï∂îÏ≤®Í≤∞Í≥º Ï∫°Ï≤ò??
        run: python -m playwright install --with-deps chromium

      - name: Î≥µÍ∂å ?πÏ≤®?ïÎ≥¥ Í∏∞ÏÇ¨ ?ùÏÑ±
        run: python scripts/lotto_writer.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}

      - name: ?πÏÇ¨?¥Ìä∏ ?∞Ïù¥???¥Î≥¥?¥Í∏∞
        run: python scripts/export_articles.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}

      - name: Î≥ÄÍ≤ΩÏÇ¨??Ïª§Î∞ã Î∞??∏Ïãú
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update lottery results article"
          for i in 1 2 3 4 5; do
            git pull origin main -X ours --no-rebase
            git push && break
            echo "push failed (attempt $i) - another workflow pushed first, retrying"
            sleep $((RANDOM % 8 + 3))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
