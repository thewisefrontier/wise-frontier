name: NewsFinal - Lottery Results Daily

# GitHub 자체 schedule: 트리거가 신뢰할 수 없어(2026-08-29 21:00 KST 예약분이
# 통째로 스킵되고, 다음날 분도 지연되어 실제로는 2026-08-31 00:51 KST에야 실행됨)
# cron-job.org 외부 트리거로 대체(다른 5개 워크플로우와 동일한 조치).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsfinal-lotto
  cancel-in-progress: false

jobs:
  lotto:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치 (로또 추첨결과 캡처용)
        run: python -m playwright install --with-deps chromium

      - name: 복권 당첨정보 기사 생성
        run: python scripts/lotto_writer.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}

      - name: 웹사이트 데이터 내보내기
        run: python scripts/export_articles.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update lottery results article"
          for i in 1 2 3 4 5; do
            git pull origin main -X ours --no-rebase
            git push && break
            echo "push failed (attempt $i) - another workflow pushed first, retrying"
            sleep $((RANDOM % 8 + 3))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
