on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsfinal-site-discovery
  cancel-in-progress: false

jobs:
  site_discovery:
    runs-on: ubuntu-latest

    steps:
      - name: ì½”ë“œ ì²´í¬?„ì›ƒ
        uses: actions/checkout@v5

      - name: Python ?¤ì •
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: ?¨í‚¤ì§€ ?¤ì¹˜
        run: pip install -r requirements.txt

      - name: ?¬ì´???„ì²´ ê¸°ì‚¬ ë°œê²¬
        run: python scripts/site_discovery.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}

      - name: ?œë²ˆ(cursor) ?íƒœ ì»¤ë°‹
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/site_discovery_state.json
          git diff --staged --quiet || git commit -m "Update site_discovery cursor"
          for i in 1 2 3 4 5; do
            git pull origin main -X ours --no-rebase
            git push && break
            echo "push failed (attempt $i) - retrying"
            sleep $((RANDOM % 8 + 3))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
