name: _tmp create articles indexes

# 2026-09-23 일회성: DB CPU/IO 과부하 대응 인덱스 생성. MCP 커넥터가 긴 DDL을
# 도중에 끊어 롤백되므로 psql로 statement_timeout 없이 실행한다. 끝나면 삭제.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create_indexes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 인덱스 생성
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGOPTIONS: "-c statement_timeout=0 -c lock_timeout=0"
        run: |
          psql -h aws-1-ap-northeast-2.pooler.supabase.com -p 5432 \
            -U postgres.fotdngseksqaghvtcvqh -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          \timing on
          SET statement_timeout = 0;
          SET lock_timeout = 0;
          SHOW statement_timeout;
          DROP INDEX IF EXISTS public.articles_source_created_idx;
          DROP INDEX IF EXISTS public.articles_source_subcategory_idx;
          DROP INDEX IF EXISTS public.articles_pub_noindex_created_idx;
          CREATE INDEX articles_source_created_idx ON public.articles (source, created_at DESC);
          CREATE INDEX articles_source_subcategory_idx ON public.articles (source, subcategory);
          CREATE INDEX articles_pub_noindex_created_idx ON public.articles (is_published, noindex, created_at DESC);
          ANALYZE public.articles;
          SELECT i.indexname, x.indisvalid
            FROM pg_indexes i JOIN pg_index x ON x.indexrelid = (i.schemaname||'.'||i.indexname)::regclass
           WHERE i.tablename = 'articles';
          SQL
