name: _tmp aiven cleanup leak

# 2026-09-24: Aiven articles에 미발행 원자재가 99,687건(359MB) 새어 들어가
# 있었다. 단일 대량 DELETE(FK cascade로 article_keywords까지 훑음)는 Aiven
# 무료 인스턴스(1vCPU/1GB)가 "administrator command"로 연결을 강제 종료함 —
# 배치로 나눠 매번 새 연결로 지운다(Supabase cleanup_stale_raw.py와 동일 원칙).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: PostgreSQL 17 클라이언트 설치
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: 배치 삭제
        env:
          PGCONNSTR: ${{ secrets.AIVEN_SERVICE_URI }}
        run: |
          before=$(psql "$PGCONNSTR" -t -A -c "SELECT count(*) FROM articles WHERE is_published = false;")
          echo "삭제 대상: $before 건"
          total=0
          while true; do
            n=$(psql "$PGCONNSTR" -t -A -v ON_ERROR_STOP=1 -c \
              "WITH d AS (DELETE FROM articles WHERE id IN (SELECT id FROM articles WHERE is_published = false LIMIT 500) RETURNING 1) SELECT count(*) FROM d;")
            total=$((total + n))
            echo "  … 누적 삭제 ${total}건"
            if [ "$n" -eq 0 ]; then break; fi
          done
          echo "총 삭제: ${total}건"

      - name: VACUUM + 최종 확인
        if: always()
        env:
          PGCONNSTR: ${{ secrets.AIVEN_SERVICE_URI }}
        run: |
          psql "$PGCONNSTR" -v ON_ERROR_STOP=1 -c "VACUUM (VERBOSE) articles;"
          psql "$PGCONNSTR" -c "SELECT is_published, count(*) FROM articles GROUP BY is_published;"
          psql "$PGCONNSTR" -c "SELECT pg_size_pretty(pg_total_relation_size('articles')) articles_size, pg_size_pretty(pg_database_size(current_database())) db_size;"
