name: Deploy Image Upload Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크?�웃
        uses: actions/checkout@v5

      - name: Node.js ?�정
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: wrangler ?�치
        run: npm install -g wrangler

      - name: Worker 배포
        run: wrangler deploy --config wrangler-image.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: ?�로??비�????�정
        run: echo "${{ secrets.UPLOAD_SECRET }}" | wrangler secret put UPLOAD_SECRET --config wrangler-image.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
