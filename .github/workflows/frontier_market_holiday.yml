          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}

      - name: ë³€ê²½ì‚¬??ì»¤ë°‹ ë°??¸ì‹œ
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update frontier market holiday articles"
          for i in 1 2 3 4 5; do
            git pull origin main -X ours --no-rebase
