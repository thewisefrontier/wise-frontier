    runs-on: ubuntu-latest

    steps:
      - name: ì½”ë“œ ì²´í¬?„ì›ƒ
        uses: actions/checkout@v5

      - name: Python ?¤ì •
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: ?¨í‚¤ì§€ ?¤ì¹˜
        run: pip install -r requirements.txt

      - name: ?¼ë³¸ ì¦ì‹œ ?´ì¥ ?ˆë‚´ ê¸°ì‚¬ ?ì„±
        run: python scripts/jp_market_holiday_writer.py
