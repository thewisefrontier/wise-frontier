name: Deploy Pixabay Search Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크?�웃
        uses: actions/checkout@v5

      - name: Node.js ?�정
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: wrangler ?�치
        run: npm install -g wrangler

      - name: Worker 배포
        run: wrangler deploy --config wrangler-pixabay.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Pixabay API ???�정
        run: echo "${{ secrets.PIXABAY_API_KEY }}" | wrangler secret put PIXABAY_API_KEY --config wrangler-pixabay.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
