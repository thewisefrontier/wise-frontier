name: NewsFinal - Monthly Economic Calendar

on:
  # GitHub 자체 schedule: 트리거는 이 저장소에서 반복적으로 무응답/지연
  # 사고를 낸 전례가 있어 다른 워크플로와 동일하게 외부 크론(cron-job.org)의
  # workflow_dispatch로 대체한다(2026-09-03 점검 — 이 워크플로만 옛날
  # schedule: 그대로 남아있었음). 원래 주기: 매월 1일 UTC 01:00 = KST 10:00.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch_calendar:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests python-dotenv

      - name: 경제 일정 수집 (공식 출처 크롤링 + 정적 일정)
        run: python scripts/econ_calendar_fetch.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
