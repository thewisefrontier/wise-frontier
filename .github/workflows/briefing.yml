name: The Wise Frontier - Daily Briefing

on:
  schedule:
    - cron: '0 9 * * *'    # UTC 09:00 = KST 18:00 저녁 1회
  workflow_dispatch:

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: DB 캐시 복원
        uses: actions/cache@v4
        with:
          path: data/articles.db
          key: articles-db
          restore-keys: articles-db

      - name: 일일 브리핑 발송
        run: python scripts/briefing.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

      - name: 웹사이트 데이터 내보내기
        run: python scripts/export_articles.py

      - name: 웹사이트 배포
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/articles.json
          git diff --staged --quiet || git commit -m "Update website data"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
