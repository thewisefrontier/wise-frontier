name: NewsFinal - Daily Briefing

on:
  schedule:
    - cron: '0 8 * * *'    # UTC 08:00 = KST 17:00 오후 5시
  workflow_dispatch:

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 일일 브리핑 발송
        run: python scripts/briefing.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: 웹사이트 데이터 내보내기
        run: python scripts/export_articles.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: wise-frontier-web에 articles.json 푸시
        run: |
          git clone https://x-access-token:${{ secrets.WEB_PUSH_TOKEN }}@github.com/thewisefrontier/wise-frontier-web.git web_repo
          mkdir -p web_repo/data
          cp docs/data/articles.json web_repo/data/articles.json
          cd web_repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/articles.json
          git diff --staged --quiet || git commit -m "Update briefing"
          git pull --rebase origin main
          git push
