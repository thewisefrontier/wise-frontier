name: NewsFinal - Article Review

on:
  # GitHub 자체 schedule: 트리거는 이 저장소에서 반복적으로 무응답/지연
  # 사고를 낸 전례가 있어(run.yml/frontier_markets.yml/lotto.yml 등 참조)
  # 다른 워크플로와 동일하게 외부 크론(cron-job.org)의 workflow_dispatch로
  # 대체한다(2026-09-03 — "그런건 본 적이 없는데": 이 워크플로가 schedule:
  # 그대로 남아있었던 게 원인 중 하나로 확인됨).
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 기사 검수 (합쇼체 자동 변환 + 위반 플래그)
        run: python scripts/article_reviewer.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          REVIEW_WINDOW_HOURS: '48'
