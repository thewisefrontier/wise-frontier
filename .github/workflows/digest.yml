name: NewsFinal - Daily Digest

on:
  schedule:
    - cron: '0 13 * * *'    # UTC 13:00 = KST 22:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 오늘의 다이제스트 생성
        run: python scripts/daily_digest.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: 웹사이트 데이터 내보내기
        run: python scripts/export_articles.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: wise-frontier-web에 articles.json 푸시
        run: |
          git clone https://x-access-token:${{ secrets.WEB_PUSH_TOKEN }}@github.com/thewisefrontier/wise-frontier-web.git web_repo
          mkdir -p web_repo/data
          cp docs/data/articles.json web_repo/data/articles.json
          cp -f docs/sitemap.xml web_repo/sitemap.xml 2>/dev/null || true
          cd web_repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/articles.json sitemap.xml
          git diff --staged --quiet || git commit -m "Update daily digest"
          git pull --rebase origin main
          git push
