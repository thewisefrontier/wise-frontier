name: NewsFinal - Daily Digest

on:
  # GitHub 자체 schedule: 트리거는 이 저장소에서 반복적으로 무응답/지연
  # 사고를 낸 전례가 있어 다른 워크플로와 동일하게 외부 크론(cron-job.org)의
  # workflow_dispatch로 대체한다(2026-09-03 점검 — 이 워크플로만 옛날
  # schedule: 그대로 남아있었음). 원래 주기: 매일 UTC 20:00 = KST 05:00(다음날).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: 암호화 파일 잠금 해제(git-crypt)
        # 프롬프트·검수 코드는 git-crypt로 암호화돼 있다(2026-10-18) — 키는 시크릿 GIT_CRYPT_KEY.
        # 암호화 지정(.gitattributes)이 없으면 그냥 통과해서, 도입 전후 어느 쪽에서도 안전하다.
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          if ! grep -qs "filter=git-crypt" .gitattributes; then echo "암호화 파일 없음 — 건너뜀"; exit 0; fi
          sudo apt-get install -y -qq git-crypt >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq git-crypt >/dev/null)
          printf '%s' "$GIT_CRYPT_KEY" | base64 -d > "$RUNNER_TEMP/gc.key"
          git-crypt unlock "$RUNNER_TEMP/gc.key"
          rm -f "$RUNNER_TEMP/gc.key"

      - name: Aiven PostgREST 기동(Supabase 이탈, 2026-10-20)
        uses: ./.github/actions/aiven-postgrest
        with:
          aiven-uri: ${{ secrets.AIVEN_SERVICE_URI }}
          jwt-secret: ${{ secrets.PGRST_JWT_SECRET }}
          pool: "1"

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 오늘의 다이제스트 생성
        run: python scripts/daily_digest.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}

      - name: 오늘의 AI 소식 생성
        run: python scripts/ai_digest.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}

      - name: 오늘의 스타트업 생성
        run: python scripts/ai_digest.py startup
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}

      - name: 오늘의 신기술 생성
        run: python scripts/ai_digest.py newtech
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}

      - name: 미발행 기사 만료 정리(중복·분량 부족·복수 토픽, 3일 경과)
        # 2026-10-27 신설 — 삭제분은 article_revisions에 14일 보관 후 정리(scripts/expire_unpublished.py 참고)
        continue-on-error: true
        run: python scripts/expire_unpublished.py --apply
        env:
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}

      - name: 웹사이트 데이터 내보내기
        run: python scripts/export_articles.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update daily digest"
          for i in 1 2 3 4 5; do
            git pull origin main -X ours --no-rebase
            git push && break
            echo "push failed (attempt $i) - another workflow pushed first, retrying"
            sleep $((RANDOM % 8 + 3))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
