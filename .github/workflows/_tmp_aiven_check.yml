name: _tmp aiven check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: PostgreSQL 17 클라이언트 설치
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: 미발행분 최신 유입 확인
        env:
          PGCONNSTR: ${{ secrets.AIVEN_SERVICE_URI }}
        run: |
          psql "$PGCONNSTR" -c "select id, created_at, source from articles where is_published=false order by id desc limit 10;"
          psql "$PGCONNSTR" -c "select count(*) from articles where is_published=false;"
