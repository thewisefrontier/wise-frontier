name: R2 사용량 조회 (일회성)
on:
  workflow_dispatch:
jobs:
  usage:
    runs-on: ubuntu-latest
    steps:
      - name: 버킷별 용량
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 bucket list
          for b in $(npx --yes wrangler@4 r2 bucket list 2>/dev/null | grep -E '^name:' | awk '{print $2}'); do
            echo "=== $b"; npx --yes wrangler@4 r2 bucket info "$b"
          done
