name: _tmp aiven limits check
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
        name: psql 18 설치
      - env:
          PGCONNSTR: ${{ secrets.AIVEN_SERVICE_URI }}
        name: 한도 관련 정보 조회
        run: |
          echo "== 버전/설정"
          /usr/lib/postgresql/18/bin/psql "$PGCONNSTR" -c "select version();"
          /usr/lib/postgresql/18/bin/psql "$PGCONNSTR" -c "show max_connections;"
          /usr/lib/postgresql/18/bin/psql "$PGCONNSTR" -c "select count(*) active_connections from pg_stat_activity;"
          echo "== DB/테이블 크기"
          /usr/lib/postgresql/18/bin/psql "$PGCONNSTR" -c "select pg_size_pretty(pg_database_size(current_database())) db_size;"
          /usr/lib/postgresql/18/bin/psql "$PGCONNSTR" -c "select relname, pg_size_pretty(pg_total_relation_size(oid)) sz from pg_class where relkind='r' and relnamespace='public'::regnamespace order by pg_total_relation_size(oid) desc;"
          echo "== 디스크(가능하면)"
          /usr/lib/postgresql/18/bin/psql "$PGCONNSTR" -c "select * from pg_stat_wal;" 2>&1 | head -5
