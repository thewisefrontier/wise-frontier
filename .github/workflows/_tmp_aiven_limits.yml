name: _tmp aiven limits check
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
        name: psql 18 설치
      - env:
          PGCONNSTR: ${{ secrets.AIVEN_SERVICE_URI }}
        name: 잔재 테이블 확인
        run: |
          P=/usr/lib/postgresql/18/bin/psql
          echo "== view_snapshots 구조"
          $P "$PGCONNSTR" -c "\d view_snapshots" 2>&1
          echo "== view_snapshots 행수"
          $P "$PGCONNSTR" -c "select count(*) from view_snapshots;" 2>&1
          echo "== rss_raw_queue 구조"
          $P "$PGCONNSTR" -c "\d rss_raw_queue" 2>&1
          echo "== rss_raw_queue 행수"
          $P "$PGCONNSTR" -c "select count(*) from rss_raw_queue;" 2>&1
          echo "== 현재 접속 목록"
          $P "$PGCONNSTR" -c "select pid, usename, application_name, state, query_start, left(query,60) q from pg_stat_activity where pid <> pg_backend_pid() order by query_start;" 2>&1
