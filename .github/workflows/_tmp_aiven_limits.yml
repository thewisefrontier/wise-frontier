name: _tmp aiven limits check
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
        name: psql 18 설치
      - env:
          PGCONNSTR: ${{ secrets.AIVEN_SERVICE_URI }}
        name: 화석 테이블 비우기 + 최종 확인
        run: |
          P=/usr/lib/postgresql/18/bin/psql
          $P "$PGCONNSTR" -v ON_ERROR_STOP=1 -c "TRUNCATE view_snapshots, rss_raw_queue;"
          $P "$PGCONNSTR" -c "VACUUM (FULL, VERBOSE) view_snapshots;"
          $P "$PGCONNSTR" -c "VACUUM (FULL, VERBOSE) rss_raw_queue;"
          $P "$PGCONNSTR" -c "select pg_size_pretty(pg_database_size(current_database())) db_size;"
          $P "$PGCONNSTR" -c "select relname, pg_size_pretty(pg_total_relation_size(oid)) sz from pg_class where relkind='r' and relnamespace='public'::regnamespace order by pg_total_relation_size(oid) desc limit 6;"
