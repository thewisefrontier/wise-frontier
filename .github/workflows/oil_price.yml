name: NewsFinal - Daily Oil Price

on:
  # 2026-08-27: run.yml/weather.ymlÍ≥?Í∞ôÏ? ?¥Ïú†Î°?GitHub schedule ?úÍ±∞,
  # ?∏Î? ?¨Î°†(cron-job.org)??workflow_dispatchÎ°??ÑÌôò. ?àÏ†Ñ???¨Ïãú?ÑÏö©
  # ??Î≤àÏß∏ cron('0 0 * * 2-6')???∞Î°ú Î∞ïÏïÑ?ÄÏßÄÎß? ?¥Ï†ú 30Î∂ÑÎßà???∏Ï∂ú?òÍ≥†
  # ?§ÌÅ¨Î¶ΩÌä∏ ?êÏ≤¥Í∞Ä market_is_closed()/already_published()Î°?Í≤åÏù¥?∏ÌïòÎØÄÎ°?
  # Í∑??¨Ïãú???¨Î°Ø?Ä Î∂àÌïÑ?îÌï¥???úÍ±∞.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsfinal-oil-price
  cancel-in-progress: false

jobs:
  oil_price:
    runs-on: ubuntu-latest

    steps:
      - name: ÏΩîÎìú Ï≤¥ÌÅ¨?ÑÏõÉ
        uses: actions/checkout@v5

      - name: Python ?§Ï†ï
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: ?®ÌÇ§ÏßÄ ?§Ïπò
        run: pip install -r requirements.txt

      - name: ?†Í? Í∏∞ÏÇ¨ ?ùÏÑ±
        run: python scripts/oil_price_writer.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}

      - name: ?πÏÇ¨?¥Ìä∏ ?∞Ïù¥???¥Î≥¥?¥Í∏∞
        run: python scripts/export_articles.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}

      - name: Î≥ÄÍ≤ΩÏÇ¨??Ïª§Î∞ã Î∞??∏Ïãú
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update oil price article"
          for i in 1 2 3 4 5; do
            git pull origin main -X ours --no-rebase
            git push && break
            echo "push failed (attempt $i) - another workflow pushed first, retrying"
            sleep $((RANDOM % 8 + 3))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
