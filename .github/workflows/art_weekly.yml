name: NewsFinal - Daily Culture Features (Art & Literature)

# 2026-09-27: 문학작품 이야기(literature_writer.py)도 같은 일일 트리거에 얹었다 —
# cron-job.org 잡을 새로 만들지 않기 위해. ⚠️ 파일명(art_weekly.yml)은 cron-job.org
# 호출 URL에 박혀 있으니 바꾸지 말 것.

# 고전 명화 한 점을 소개하는 "읽을거리" 기사(2026-09-08 신설, 2026-09-27
# 주 1회 → 일 1회로 전환, 사용자 요청). already_published()가 날짜 단위로
# 게이트하므로 이 워크플로우가 여러 번 실행돼도 안전하다. 다른 writer들과
# 동일하게 GitHub 자체 schedule: 대신 cron-job.org의 workflow_dispatch로
# 실행한다.
# ⚠️ 일 1회로 실제로 발행되려면 이 워크플로우를 부르는 cron-job.org 잡의
# 실행 주기도 주 1회에서 일 1회로 바꿔야 한다(이 파일 변경만으론 실행
# 빈도가 자동으로 늘지 않음).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsfinal-art-weekly
  cancel-in-progress: false

jobs:
  art_weekly:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 오늘의 고전 명화 기사 생성
        run: python scripts/art_weekly_writer.py
        # 한쪽이 실패해도 다른 쪽 기사와 내보내기는 돌도록.
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}

      - name: 오늘의 문학작품 이야기 기사 생성
        run: python scripts/literature_writer.py
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}

      - name: 웹사이트 데이터 내보내기
        run: python scripts/export_articles.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update daily art feature"
          for i in 1 2 3 4 5; do
            git pull origin main -X ours --no-rebase
            git push && break
            echo "push failed (attempt $i) - another workflow pushed first, retrying"
            sleep $((RANDOM % 8 + 3))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
