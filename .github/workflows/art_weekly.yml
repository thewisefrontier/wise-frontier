on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsfinal-art-weekly
  cancel-in-progress: false

jobs:
  art_weekly:
    runs-on: ubuntu-latest

    steps:
      - name: ì½”ë“œ ì²´í¬?„ì›ƒ
        uses: actions/checkout@v5

      - name: Python ?¤ì •
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: ?¨í‚¤ì§€ ?¤ì¹˜
        run: pip install -r requirements.txt

      - name: ?´ë²ˆ ì£?ê³ ì „ ëª…í™” ê¸°ì‚¬ ?ì„±
        run: python scripts/art_weekly_writer.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}
          IMAGE_UPLOAD_URL: ${{ secrets.IMAGE_UPLOAD_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}

      - name: ?¹ì‚¬?´íŠ¸ ?°ì´???´ë³´?´ê¸°
        run: python scripts/export_articles.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIVEN_SERVICE_URI: ${{ secrets.AIVEN_SERVICE_URI }}

      - name: ë³€ê²½ì‚¬??ì»¤ë°‹ ë°??¸ì‹œ
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update weekly art feature"
          for i in 1 2 3 4 5; do
            git pull origin main -X ours --no-rebase
            git push && break
            echo "push failed (attempt $i) - another workflow pushed first, retrying"
            sleep $((RANDOM % 8 + 3))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
