<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NewsFinal Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f0f0f; --bg2: #161616; --bg3: #1e1e1e;
      --border: #2a2a2a; --text: #e8e0d0; --muted: #666;
      --accent: #c8a060; --accent2: #6090c8;
      --danger: #c85050; --success: #50c878;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Mono', monospace; min-height: 100vh; }

    /* 로그인 */
    #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: var(--bg2); border: 1px solid var(--border); padding: 40px; width: 400px; }
    .login-title { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--accent); margin-bottom: 8px; }
    .login-sub { font-size: 11px; color: var(--muted); margin-bottom: 24px; }
    .login-box input {
      width: 100%; padding: 10px 14px; background: var(--bg3);
      border: 1px solid var(--border); color: var(--text);
      font-family: 'IBM Plex Mono', monospace; font-size: 13px;
      margin-bottom: 12px; outline: none;
    }
    .login-box input:focus { border-color: var(--accent); }
    .login-error { font-size: 11px; color: var(--danger); margin-bottom: 12px; display: none; }

    .btn {
      padding: 10px 20px; font-family: 'IBM Plex Mono', monospace;
      font-size: 12px; font-weight: 700; cursor: pointer;
      border: none; transition: all 0.2s; letter-spacing: 0.05em;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: #e0b870; }
    .btn-danger { background: var(--danger); color: #fff; font-size: 11px; padding: 5px 12px; }
    .btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .btn-full { width: 100%; }

    /* 메인 */
    #app { display: none; }
    .header {
      background: var(--bg2); border-bottom: 2px solid var(--accent);
      padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
    }
    .header-title { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--accent); }
    .header-user { font-size: 11px; color: var(--muted); }
    .header-actions { display: flex; gap: 8px; align-items: center; }

    .container { display: grid; grid-template-columns: 200px 1fr; min-height: calc(100vh - 49px); }
    .sidebar { background: var(--bg2); border-right: 1px solid var(--border); padding: 16px 0; }
    .sidebar-item {
      padding: 9px 16px; font-size: 12px; color: var(--muted);
      cursor: pointer; border-left: 3px solid transparent; transition: all 0.15s;
    }
    .sidebar-item:hover { color: var(--text); background: var(--bg3); }
    .sidebar-item.active { color: var(--accent); border-left-color: var(--accent); background: var(--bg3); }
    .sidebar-divider { height: 1px; background: var(--border); margin: 8px 0; }

    .main { padding: 20px; overflow-y: auto; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
    .toolbar input, .toolbar select {
      padding: 7px 10px; background: var(--bg2); border: 1px solid var(--border);
      color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 12px; outline: none;
    }
    .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }
    .toolbar input { flex: 1; min-width: 180px; }

    .article-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .article-table th {
      text-align: left; padding: 8px 10px; font-size: 11px; color: var(--muted);
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .article-table th:nth-child(1) { width: 35%; }
    .article-table th:nth-child(2) { width: 15%; }
    .article-table th:nth-child(3) { width: 8%; }
    .article-table th:nth-child(4) { width: 8%; }
    .article-table th:nth-child(5) { width: 9%; }
    .article-table th:nth-child(6) { width: 6%; }
    .article-table th:nth-child(7) { width: 19%; }
    .article-table td { padding: 8px 10px; font-size: 12px; border-bottom: 1px solid var(--border); vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .article-table tr:hover td { background: var(--bg3); }
    .article-title-text {
      color: var(--text); cursor: pointer; display: block;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 360px;
    }
    .article-title-text:hover { color: var(--accent); }
    .tag { display: inline-block; padding: 1px 5px; font-size: 10px; background: var(--bg3); border: 1px solid var(--border); margin-right: 3px; }
    .tag-own { border-color: var(--accent); color: var(--accent); }
    .muted { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .actions { display: flex; gap: 4px; }
    .btn-sm { padding: 3px 8px; font-size: 10px; font-family: 'IBM Plex Mono', monospace; cursor: pointer; border: 1px solid var(--border); background: var(--bg3); color: var(--muted); }
    .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
    .btn-sm-danger { border-color: var(--danger); color: var(--danger); }
    .btn-sm-danger:hover { background: var(--danger); color: #fff; }

    /* 편집 패널 */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 99; }
    .overlay.open { display: block; }
    .edit-panel {
      display: none; position: fixed; top: 0; right: 0; width: 580px;
      height: 100vh; background: var(--bg2); border-left: 1px solid var(--border);
      z-index: 100; flex-direction: column;
    }
    .edit-panel.open { display: flex; }
    .edit-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .edit-title-label { font-size: 13px; font-weight: 700; color: var(--accent); }
    .edit-body { padding: 18px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .field-label { font-size: 10px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .field-input, .field-textarea, .field-select {
      width: 100%; padding: 8px 10px; background: var(--bg3); border: 1px solid var(--border);
      color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 12px; outline: none;
    }
    .field-input:focus, .field-textarea:focus, .field-select:focus { border-color: var(--accent); }
    .field-textarea { resize: vertical; min-height: 220px; line-height: 1.7; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .edit-footer { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

    /* 사용자 관리 */
    .user-table { width: 100%; border-collapse: collapse; }
    .user-table th { text-align: left; padding: 8px 10px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--border); }
    .user-table td { padding: 8px 10px; font-size: 12px; border-bottom: 1px solid var(--border); }
    .role-badge { padding: 2px 8px; font-size: 10px; font-weight: 700; }
    .role-admin { background: var(--accent); color: #000; }
    .role-reporter { background: var(--bg3); color: var(--muted); border: 1px solid var(--border); }

    .pagination { display: flex; gap: 4px; margin-top: 14px; justify-content: center; }
    .page-btn { padding: 5px 10px; background: var(--bg2); border: 1px solid var(--border); color: var(--muted); cursor: pointer; font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
    .page-btn:hover, .page-btn.active { border-color: var(--accent); color: var(--accent); }

    .toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 18px; background: var(--bg2); border: 1px solid var(--border); font-size: 12px; z-index: 200; display: none; }
    .toast.show { display: block; animation: fadeIn 0.2s; }
    .toast.success { border-color: var(--success); color: var(--success); }
    .toast.error { border-color: var(--danger); color: var(--danger); }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; } }
    .calendar-table { width: 100%; border-collapse: collapse; table-layout: auto; }
    .calendar-table th {
      text-align: left; padding: 8px 10px; font-size: 11px; color: var(--muted);
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .calendar-table td { padding: 8px 10px; font-size: 12px; border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .calendar-table td:nth-child(4) { white-space: normal; max-width: 320px; }
    .calendar-table tr:hover td { background: var(--bg3); }
    .calendar-table .actions { display: flex; gap: 4px; align-items: center; }

    .empty { text-align: center; padding: 50px; color: var(--muted); font-size: 13px; }
    .loading { text-align: center; padding: 30px; color: var(--muted); }

    /* 사용자 관리 섹션 - admin만 표시 */
    .admin-only { display: none; }
  </style>
</head>
<body>

<!-- 로그인 -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-title">NewsFinal Admin</div>
    <div class="login-sub">NewsFinal 편집 시스템</div>
    <div class="login-error" id="login-error"></div>
    <input type="email" id="login-email" placeholder="이메일" onkeydown="if(event.key==='Enter')login()" />
    <input type="password" id="login-pw" placeholder="비밀번호" onkeydown="if(event.key==='Enter')login()" />
    <button class="btn btn-primary btn-full" onclick="login()">로그인</button>
  </div>
</div>

<!-- 앱 -->
<div id="app">
  <div class="overlay" id="overlay" onclick="closeEdit()"></div>

  <div class="header">
    <div class="header-title">✦ NewsFinal Admin</div>
    <div class="header-actions">
      <span class="header-user" id="header-user"></span>
      <button class="btn btn-primary" style="font-size:11px;padding:7px 14px;" onclick="openNew()">+ 새 기사</button>
      <button class="btn btn-secondary" style="font-size:11px;padding:7px 14px;" onclick="logout()">로그아웃</button>
    </div>
  </div>

  <div class="container">
    <div class="sidebar">
      <div class="sidebar-item" onclick="showArticles('all',this)">📰 전체 기사</div>
      <div class="sidebar-item active" onclick="showArticles('own',this)">📰 NewsFinal 기사</div>
      <div class="sidebar-item" onclick="showArticles('cluster',this)">🔥 이슈</div>
      <div class="sidebar-item" onclick="showArticles('rss',this)">📡 수집 기사</div>
      <div class="sidebar-item" onclick="showArticles('unpublished',this)">📋 미발행 기사</div>
      <div class="sidebar-item" onclick="showNeedsReview(this)">⚠️ 검토 필요</div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-item" id="calendar-menu" onclick="showCalendar(this)">📅 경제 일정 관리</div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-item admin-only" id="user-menu" onclick="showUsers(this)">👥 사용자 관리</div>
      <div class="sidebar-item admin-only" id="prompt-menu" onclick="showPrompts(this)">✏️ 프롬프트 관리</div>
      <div class="sidebar-item admin-only" id="rss-menu" onclick="showRssSources(this)">📡 RSS 소스 관리</div>
      <div class="sidebar-item" id="stats-menu" onclick="showStats(this)">📊 발행 통계</div>
    </div>

    <div class="main" id="main-content">
      <div class="loading">로딩 중...</div>
    </div>
  </div>

  <!-- 편집 패널 -->
  <div class="edit-panel" id="edit-panel">
    <div class="edit-header">
      <div class="edit-title-label" id="edit-panel-title">기사 편집</div>
      <button class="btn-sm" onclick="closeEdit()">✕ 닫기</button>
    </div>
    <div class="edit-body">
      <input type="hidden" id="edit-id" />
      <div>
        <div class="field-label">제목</div>
        <input class="field-input" id="edit-title-ko" type="text" placeholder="기사 제목" />
      </div>
      <div>
        <div class="field-label">본문</div>
        <textarea class="field-textarea" id="edit-summary-ko" placeholder="기사 본문..."></textarea>
      </div>
      <div class="field-row">
        <div>
          <div class="field-label">카테고리</div>
          <select class="field-select" id="edit-category">
            <option value="">선택</option>
            <option value="경제">경제</option>
            <option value="금융/증권">금융/증권</option>
            <option value="자원/에너지">자원/에너지</option>
            <option value="산업/기업">산업/기업</option>
            <option value="정치">정치</option>
            <option value="사회">사회</option>
            <option value="IT·과학">IT·과학</option>
            <option value="글로벌경제">글로벌경제</option>
            <option value="브리핑">브리핑</option>
            <option value="종합">종합</option>
          </select>
        </div>
        <div>
          <div class="field-label">지역</div>
          <select class="field-select" id="edit-region">
            <option value="">선택</option>
            <option value="africa">아프리카</option>
            <option value="southeast_asia">동남아시아</option>
            <option value="eastern_europe">동유럽</option>
            <option value="middle_east">중동</option>
            <option value="central_asia">중앙아시아</option>
            <option value="south_asia">남아시아</option>
            <option value="latin_america">라틴아메리카</option>
            <option value="caribbean">카리브해</option>
            <option value="oceania">오세아니아</option>
            <option value="global">글로벌</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div>
          <div class="field-label">국가</div>
          <input class="field-select" id="edit-country" type="text" placeholder="예: 나이지리아" />
        </div>
        <div>
          <div class="field-label">출처</div>
          <input class="field-select" id="edit-source" type="text" placeholder="NewsFinal" />
        </div>
      </div>
      <div class="field-row">
        <div>
          <div class="field-label">바이라인</div>
          <input class="field-select" id="edit-byline" type="text" placeholder="뉴스파이널 편집국" />
        </div>
      </div>
      <div id="url-field">
        <div class="field-label">원문 URL</div>
        <input class="field-input" id="edit-url" type="text" placeholder="https://..." />
      </div>
      <div>
        <div class="field-label">대표 이미지</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <input class="field-input" id="edit-image-url" type="text" placeholder="이미지 URL" style="flex:1;" oninput="this.value ? showImagePreview(this.value) : removeImage()" />
          <button class="btn-sm" onclick="document.getElementById('image-file-input').click()">📁 업로드</button>
          <button class="btn-sm" onclick="generateImage()">✨ AI 생성</button>
          <button class="btn-sm" onclick="searchPixabay()">🔍 사진 검색</button>
          <button class="btn-sm" onclick="removeImage()">🗑 제거</button>
          <input type="file" id="image-file-input" accept="image/*" style="display:none;" onchange="uploadImage(this)" />
        </div>
        <div id="pixabay-results" style="margin-top:8px;display:none;grid-template-columns:repeat(4,1fr);gap:6px;"></div>
        <div id="image-preview" style="margin-top:8px;display:none;">
          <img id="image-preview-img" style="max-width:100%;max-height:200px;border:1px solid var(--border);" />
        </div>
      </div>
    </div>
    <div class="edit-footer">
      <button class="btn-sm btn-sm-danger admin-only" id="delete-btn" onclick="deleteArticle()">삭제</button>
      <button class="btn btn-secondary" style="font-size:11px;" onclick="closeEdit()">취소</button>
      <button class="btn btn-primary" style="font-size:11px;" onclick="saveArticle()">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // Supabase 설정 — 여기에 프로젝트 정보 입력
  const SUPABASE_URL = 'https://fotdngseksqaghvtcvqh.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_rT3kSEAAdM0DJlDW5fEWww_M37h6dDW'; // anon public key 입력

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let currentRole = null;
  let currentFilter = 'own';
  let currentPage = 0;
  let pageSize = 30;
  let searchTimer = null;
  let isNew = false;
  let currentSection = 'articles';

  // ── 인증 ─────────────────────────────────────────────

  async function login() {
    const email = document.getElementById('login-email').value.trim();
    const pw = document.getElementById('login-pw').value;
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';

    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) {
      errEl.textContent = '이메일 또는 비밀번호가 올바르지 않습니다.';
      errEl.style.display = 'block';
      return;
    }
    await initApp(data.user);
  }

  async function initApp(user) {
    currentUser = user;

    // 역할 조회
    const { data: roleData } = await sb.from('user_roles').select('role,name').eq('id', user.id).single();
    currentRole = roleData?.role || 'reporter';
    const userName = roleData?.name || user.email;

    document.getElementById('header-user').textContent = `${userName} (${currentRole === 'admin' ? '관리자' : '기자'})`;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';

    // Gemini API 키 자동 로드
    try {
      const { data: settingData } = await sb.from('settings').select('value').eq('key', 'gemini_api_key').single();
      if (settingData?.value) {
        sessionStorage.setItem('gemini_key', settingData.value);
      }
    } catch(e) {}

    // 관리자 전용 UI 표시
    if (currentRole === 'admin') {
      document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
    }

    showArticles('own', document.querySelector('.sidebar-item.active'));
  }

  async function logout() {
    await sb.auth.signOut();
    location.reload();
  }

  // 자동 로그인
  window.onload = async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) await initApp(session.user);
  };

  // ── 기사 목록 ─────────────────────────────────────────

  function showArticles(filter, el) {
    currentSection = 'articles';
    currentFilter = filter;
    currentPage = 0;
    document.querySelectorAll('.sidebar-item').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    loadArticles();
  }

  async function loadArticles() {
    document.getElementById('main-content').innerHTML = '<div class="loading">로딩 중...</div>';

    // 정렬 기준
    const sortBy = document.getElementById('sort-select')?.value || 'created_at';
    const sortAsc = sortBy === 'view_count' ? false : false;

    let query = sb.from('articles')
      .select('id,title_ko,title_en,source,category,country,region,created_at,subcategory,view_count,is_published', { count: 'exact' })
      .order(sortBy, { ascending: sortAsc })
      .range(currentPage * pageSize, (currentPage + 1) * pageSize - 1);

    if (currentFilter === 'own') query = query.eq('source', 'NewsFinal').eq('is_published', true);
    else if (currentFilter === 'rss') query = query.neq('source', 'NewsFinal');
    else if (currentFilter === 'cluster') query = query.eq('source', 'NewsFinal').ilike('subcategory', 'cluster_%');
    else if (currentFilter === 'unpublished') query = query.eq('source', 'NewsFinal').eq('is_published', false);

    const searchQ = document.getElementById('search-input')?.value?.trim();
    if (searchQ) query = query.or(`title_ko.ilike.%${searchQ}%,title_en.ilike.%${searchQ}%,country.ilike.%${searchQ}%,source.ilike.%${searchQ}%`);

    const region = document.getElementById('filter-region')?.value;
    const category = document.getElementById('filter-category')?.value;
    if (region) query = query.eq('region', region);
    if (category) query = query.eq('category', category);

    const { data, count, error } = await query;
    if (error) { document.getElementById('main-content').innerHTML = `<div class="empty">오류: ${error.message}</div>`; return; }
    renderArticles(data, count);
  }

  function renderArticles(articles, total) {
    const toolbar = `
      <div class="toolbar">
        <input type="text" id="search-input" placeholder="🔍 제목, 국가, 출처 검색..." oninput="onSearch()" />
        <select id="filter-region" onchange="loadArticles()">
          <option value="">전체 지역</option>
          <option value="africa">아프리카</option>
          <option value="southeast_asia">동남아시아</option>
          <option value="eastern_europe">동유럽</option>
          <option value="middle_east">중동</option>
          <option value="central_asia">중앙아시아</option>
          <option value="south_asia">남아시아</option>
          <option value="latin_america">라틴아메리카</option>
          <option value="caribbean">카리브해</option>
          <option value="global">글로벌</option>
        </select>
        <select id="filter-category" onchange="loadArticles()">
          <option value="">전체 분야</option>
          <option value="경제">경제</option>
          <option value="금융">금융</option>
          <option value="자원·에너지">자원·에너지</option>
          <option value="산업·기업">산업·기업</option>
          <option value="정치·외교">정치·외교</option>
          <option value="사회">사회</option>
          <option value="IT·과학">IT·과학</option>
          <option value="글로벌">글로벌</option>
        </select>
        <select id="sort-select" onchange="loadArticles()">
          <option value="created_at">최신순</option>
          <option value="view_count">조회수순</option>
        </select>
        <span style="font-size:11px;color:var(--muted);margin-left:auto;">총 ${total}건 | 총 조회 ${(articles||[]).reduce((s,a) => s + (a.view_count||0), 0).toLocaleString()}회</span>
        ${currentFilter === 'unpublished' ? `<button class="btn btn-primary" style="font-size:11px;" onclick="publishAll()">✅ 전체 발행</button>` : ''}
      </div>
    `;

    if (!articles?.length) {
      document.getElementById('main-content').innerHTML = toolbar + '<div class="empty">기사 없음</div>';
      return;
    }

    const rows = articles.map(a => {
      const isOwn = a.source === 'NewsFinal';
      const isUnpublished = isOwn && !a.is_published;
      const title = a.title_ko || a.title_en || '(제목없음)';
      const date = (a.created_at || '').slice(0, 10);
      const rowStyle = isUnpublished ? 'style="opacity:0.6;"' : '';
      const unpublishedBadge = isUnpublished ? '<span style="font-size:9px;padding:1px 5px;border:1px solid var(--muted);color:var(--muted);margin-left:4px;">미발행</span>' : '';
      return `
        <tr ${rowStyle}>
          <td style="max-width:380px;">
            <span class="article-title-text" onclick="openEdit(${a.id})" title="${title.replace(/"/g,'&quot;')}">${title}</span>${unpublishedBadge}
          </td>
          <td class="muted">${a.source || ''}</td>
          <td><span class="tag">${a.category || ''}</span></td>
          <td class="muted">${a.country || ''}</td>
          <td class="muted">${date}</td>
          <td class="muted">${a.view_count || 0}</td>
          <td class="actions">
            <button class="btn-sm" onclick="openEdit(${a.id})">편집</button>
            ${isUnpublished ? `<button class="btn-sm" style="border-color:var(--success);color:var(--success);" onclick="publishArticle(${a.id})">발행</button>` : ''}
            ${currentRole === 'admin' ? `<button class="btn-sm btn-sm-danger" onclick="confirmDelete(${a.id})">삭제</button>` : ''}
          </td>
        </tr>
      `;
    }).join('');

    const table = `
      <table class="article-table">
        <thead><tr>
          <th>제목</th><th>출처</th><th>분야</th><th>국가</th><th>날짜</th><th>조회</th><th>관리</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;

    const totalPages = Math.ceil(total / pageSize);
    let pagination = '';
    if (totalPages > 1) {
      const start = Math.max(0, currentPage - 2);
      const end = Math.min(totalPages - 1, currentPage + 2);
      pagination = '<div class="pagination">';
      if (start > 0) pagination += `<button class="page-btn" onclick="goPage(0)">1</button><span style="color:var(--muted);padding:0 4px">…</span>`;
      for (let i = start; i <= end; i++) pagination += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i+1}</button>`;
      if (end < totalPages-1) pagination += `<span style="color:var(--muted);padding:0 4px">…</span><button class="page-btn" onclick="goPage(${totalPages-1})">${totalPages}</button>`;
      pagination += '</div>';
    }

    document.getElementById('main-content').innerHTML = toolbar + table + pagination;
  }

  function onSearch() {
    clearTimeout(searchTimer);

  }

  function goPage(p) { currentPage = p; loadArticles(); window.scrollTo(0,0); }

  async function openEdit(id) {
    isNew = false;
    document.getElementById('edit-panel-title').textContent = '기사 편집';

    const { data, error } = await sb.from('articles').select('*').eq('id', id).single();
    if (error || !data) return;

    document.getElementById('edit-id').value = data.id;
    document.getElementById('edit-title-ko').value = data.title_ko || '';
    document.getElementById('edit-summary-ko').value = data.summary_ko || '';
    document.getElementById('edit-category').value = data.category || '';
    document.getElementById('edit-region').value = data.region || '';
    document.getElementById('edit-country').value = data.country || '';
    document.getElementById('edit-source').value = data.source || '';
    document.getElementById('edit-byline').value = data.byline || '뉴스파이널 편집국';
    document.getElementById('edit-url').value = data.url || '';
    document.getElementById('edit-image-url').value = data.image_url || '';
    if (data.image_url) showImagePreview(data.image_url);

    const isInternal = (data.url || '').startsWith('internal://');
    document.getElementById('url-field').style.display = isInternal ? 'none' : 'block';

    document.getElementById('edit-panel').classList.add('open');
    document.getElementById('overlay').classList.add('open');
  }

  function openNew() {
    isNew = true;
    document.getElementById('edit-panel-title').textContent = '새 기사 작성';
    ['edit-id','edit-title-ko','edit-summary-ko','edit-country','edit-url'].forEach(id => document.getElementById(id).value = '');

    document.getElementById('edit-region').value = '';
    document.getElementById('edit-source').value = 'NewsFinal';

  function closeEdit() {
    document.getElementById('edit-panel').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  }

  async function saveArticle() {
    const payload = {
      title_ko: document.getElementById('edit-title-ko').value,
      title_en: document.getElementById('edit-title-ko').value,
      summary_ko: document.getElementById('edit-summary-ko').value,
      category: document.getElementById('edit-category').value,
      region: document.getElementById('edit-region').value,
      country: document.getElementById('edit-country').value,
      source: document.getElementById('edit-source').value,
      byline: document.getElementById('edit-byline').value || '뉴스파이널 편집국',
      url: document.getElementById('edit-url').value,
      image_url: document.getElementById('edit-image-url').value || null,
    };

    if (isNew) {
      if (!payload.url) payload.url = `internal://manual/${Date.now()}`;
      payload.sent_telegram = 1;
      payload.score = 100;
      payload.created_at = new Date().toISOString().slice(0,16).replace('T',' ');
      const { error } = await sb.from('articles').insert(payload);
      if (error) { toast(`오류: ${error.message}`, 'error'); return; }
      toast('기사가 등록됐습니다', 'success');
    } else {
      const id = document.getElementById('edit-id').value;
      const { error } = await sb.from('articles').update(payload).eq('id', id);
      if (error) { toast(`오류: ${error.message}`, 'error'); return; }
      toast('저장됐습니다', 'success');
    }
    closeEdit();
    loadArticles();
  }

    if (!confirm('미발행 기사를 전체 발행하시겠습니까?')) return;
    const { error } = await sb.from('articles')
      .update({ is_published: true })

    if (error) { toast(`오류: ${error.message}`, 'error'); return; }

    const newRole = currentRoleVal === 'admin' ? 'reporter' : 'admin';

  const IMPORTANCE_LABEL = { high: '🔴 높음', medium: '🟡 중간', low: '⚪ 낮음' };

  async function showCalendar(el) {
    currentSection = 'calendar';
    document.querySelectorAll('.sidebar-item').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('main-content').innerHTML = '<div class="loading">로딩 중...</div>';

    const { data, error } = await sb.from('econ_events')
      .select('*')
      .gte('event_date', new Date(Date.now() - 7*86400000).toISOString().slice(0,10))
      .order('is_verified', { ascending: true })
      .order('event_date', { ascending: true })
      .order('event_time', { ascending: true });

    if (error) { document.getElementById('main-content').innerHTML = `<div class="empty">오류: ${error.message}</div>`; return; }

    const pendingCount = data.filter(ev => ev.is_verified === false).length;

    const html = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <span style="font-size:13px;font-weight:700;">경제 일정 관리</span>
        <div style="display:flex;gap:8px;">
          ${pendingCount > 0 ? `<span style="font-size:11px;color:var(--accent);align-self:center;">⏳ 검수 대기 ${pendingCount}건</span>` : ''}
          ${pendingCount > 0 ? `<button class="btn btn-primary" style="font-size:11px;background:var(--success);" onclick="approveAllEvents()">✅ 전체 승인</button>` : ''}
          <button class="btn btn-primary" style="font-size:11px;" onclick="openEventForm()">+ 일정 추가</button>
        </div>
      </div>
      <table class="calendar-table">
        <thead><tr>
          <th style="width:90px;">날짜</th><th style="width:70px;">시간</th>
          <th style="width:110px;">국가</th><th>제목</th>
          <th style="width:70px;">중요도</th><th style="width:70px;">상태</th><th style="width:120px;">관리</th>
        </tr></thead>
        <tbody>
          ${data.length === 0 ? '<tr><td colspan="7" class="empty">등록된 일정이 없습니다</td></tr>' : data.map(ev => {
            const pending = ev.is_verified === false;
            return `
            <tr ${pending ? 'style="background:rgba(200,160,96,0.08);"' : ''}>
              <td class="muted">${ev.event_date}</td>
              <td class="muted">${ev.event_time || '-'}</td>
              <td class="muted">${ev.country_flag || ''} ${ev.country || ''}</td>
              <td>${ev.title}${ev.description ? `<div style="font-size:10px;color:var(--muted);margin-top:2px;">${ev.description}</div>` : ''}${ev.source_url ? `<div style="margin-top:3px;"><a href="${ev.source_url}" target="_blank" rel="noopener" style="font-size:10px;color:var(--accent2);" onclick="event.stopPropagation();">🔗 출처 확인</a></div>` : (pending ? `<div style="font-size:10px;color:var(--danger);margin-top:3px;">⚠️ 출처 없음</div>` : '')}</td>
              <td>${IMPORTANCE_LABEL[ev.importance] || ev.importance}</td>
              <td>${pending ? '<span style="font-size:10px;color:var(--accent);">⏳ 대기</span>' : `<span style="font-size:10px;color:var(--success);">✅ 게시</span>${ev.source === 'gemini_trusted' ? '<div style="font-size:9px;color:var(--muted);margin-top:2px;">공식출처 자동</div>' : ''}`}</td>
              <td style="vertical-align:middle;white-space:nowrap;">
                <div style="display:flex;gap:4px;align-items:center;">
                ${pending ? `<button class="btn-sm" style="border-color:var(--success);color:var(--success);" onclick="approveEvent(${ev.id})">승인</button>` : ''}
                <button class="btn-sm" onclick="openEventForm(${ev.id})">편집</button>
                <button class="btn-sm btn-sm-danger" onclick="deleteEvent(${ev.id})">삭제</button>
                </div>
              </td>
            </tr>
          `}).join('')}
        </tbody>
      </table>
    `;
    document.getElementById('main-content').innerHTML = html;
  }

            </select>

        <div style="padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;">
          <button class="btn btn-secondary" style="font-size:11px;" onclick="document.getElementById('event-modal').remove()">취소</button>

        </div>

    `;
    document.body.appendChild(modal);

  async function saveEvent(id) {
    const payload = {
      event_date: document.getElementById('ev-date').value,
      event_time: document.getElementById('ev-time').value,
      country: document.getElementById('ev-country').value,
      country_flag: document.getElementById('ev-flag').value,
      title: document.getElementById('ev-title').value,
      description: document.getElementById('ev-desc').value,
      importance: document.getElementById('ev-importance').value,
      is_verified: true,  // Admin에서 직접 저장하는 것은 검수 완료로 간주
    };
    if (!id) payload.source = 'manual';
    if (!payload.title || !payload.event_date) { toast('날짜와 제목은 필수입니다', 'error'); return; }

    const { error } = id
      ? await sb.from('econ_events').update(payload).eq('id', id)
      : await sb.from('econ_events').insert(payload);

    if (error) { toast(`오류: ${error.message}`, 'error'); return; }
    toast('저장됐습니다', 'success');
    document.getElementById('event-modal')?.remove();
    showCalendar(document.getElementById('calendar-menu'));
  }

  async function deleteEvent(id) {
    if (!confirm('이 일정을 삭제하시겠습니까?')) return;
    const { error } = await sb.from('econ_events').delete().eq('id', id);
    if (error) { toast(`오류: ${error.message}`, 'error'); return; }
    toast('삭제됐습니다', 'success');
    showCalendar(document.getElementById('calendar-menu'));
  }

  async function approveEvent(id) {
    const { error } = await sb.from('econ_events').update({ is_verified: true }).eq('id', id);
    if (error) { toast(`오류: ${error.message}`, 'error'); return; }
    toast('승인됐습니다', 'success');
    showCalendar(document.getElementById('calendar-menu'));
  }

  async function aiRewrite(articleId, btn) {
    btn.disabled = true;
    btn.textContent = '처리 중...';

    const { data, error } = await supabase
      .from('articles')
      .select('id,title_ko,summary_ko,country,category')
      .eq('id', articleId)
      .single();

    if (error || !data) { btn.textContent = '오류'; return; }

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 2000,
          messages: [{
            role: 'user',
            content: `아래 기사는 여러 주제가 혼합된 기사입니다. 가장 중요하고 구체적인 하나의 토픽만 골라서 완성도 높은 단일 기사로 재작성하세요. 마크다운 없이 기사 문체로 작성하세요.

제목: ${data.title_ko}
내용: ${(data.summary_ko || '').slice(0, 1500)}

아래 형식으로만 출력하세요:
제목: (새로운 단일 토픽 제목)
본문: (재작성된 기사 본문)`
          }]
        })
      });

      const result = await response.json();
      const text = result.content?.[0]?.text || '';

      let newTitle = '', newBody = '';
      for (const line of text.split('\n')) {
        if (line.startsWith('제목:')) newTitle = line.replace('제목:', '').trim();
      }
      const bodyIdx = text.indexOf('본문:');
      if (bodyIdx >= 0) newBody = text.slice(bodyIdx + 3).trim();

      if (!newTitle || !newBody) throw new Error('파싱 실패');

      const { error: updateError } = await supabase
        .from('articles')
        .update({ title_ko: newTitle, title_en: newTitle, summary_ko: newBody, subcategory: 'rewritten' })
        .eq('id', articleId);

      if (updateError) throw updateError;

      btn.textContent = '✅ 완료';
      btn.style.background = 'var(--success)';
      btn.style.borderColor = 'var(--success)';

      const card = btn.closest('.article-item');
      card.querySelector('div[style*="font-weight:600"]').textContent = newTitle;
      card.querySelector('div[style*="line-height:1.5"]').textContent = newBody.slice(0, 200) + '...';
      card.style.borderLeftColor = 'var(--success)';

    } catch(e) {
      console.error(e);
      btn.textContent = '실패';
      btn.disabled = false;
    }
  }

  async function savePrompt(name, currentVersion) {
    const content = document.getElementById('prompt-edit-content').value;
    if (!content.trim()) { toast('내용을 입력하세요', 'error'); return; }

    // 현재 최신 버전 재확인 (동시 편집·중복 삽입 방지)
    const { data: latest } = await sb.from('prompts')
      .select('version')
      .eq('name', name)
      .order('version', { ascending: false })
      .limit(1)
      .single();
    const nextVersion = (latest?.version ?? currentVersion) + 1;

    // 기존 버전 비활성화
    await sb.from('prompts').update({ is_active: false }).eq('name', name);

    // 새 버전 저장
    const { error } = await sb.from('prompts').insert({
      name,
      content,
      version: nextVersion,
      is_active: true,
    });

    if (error) { toast(`오류: ${error.message}`, 'error'); return; }
    toast(`v${nextVersion}으로 저장됐습니다`, 'success');
    document.getElementById('prompt-modal')?.remove();
    showPrompts(document.getElementById('prompt-menu'));
  }

  async function uploadImage(input) {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { toast('5MB 이하 파일만 가능합니다', 'error'); return; }

    const secret = getUploadSecret();
    if (!secret) return;

    toast('업로드 중...', 'success');
    try {
      const formData = new FormData();
      formData.append('file', file);
      const res = await fetch(`${UPLOAD_WORKER_URL}/upload`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${secret}` },
        body: formData,
      });
      const data = await res.json();
      if (data.url) {
        document.getElementById('edit-image-url').value = data.url;
        showImagePreview(data.url);
        toast('업로드 완료!', 'success');
      } else {
        toast(`업로드 실패: ${data.error}`, 'error');
      }
    } catch(e) {
      toast(`업로드 실패: ${e.message}`, 'error');

  }

  async function generateImage() {
    const title = document.getElementById('edit-title-ko').value;
    const category = document.getElementById('edit-category').value;
    const country = document.getElementById('edit-country').value;

    if (!title) { toast('제목을 먼저 입력하세요', 'error'); return; }

    let geminiKey = sessionStorage.getItem('gemini_key');
    if (!geminiKey) {
      geminiKey = prompt('Gemini API Key 입력 (이번 세션에만 저장):');
      if (!geminiKey) return;
      sessionStorage.setItem('gemini_key', geminiKey);
    }

    toast('AI 이미지 생성 중...', 'success');

    try {
      const prompt = `뉴스 기사 대표 이미지. ${country ? country + ', ' : ''}${category ? category + ' 분야, ' : ''}주제: ${title}. 사실적이고 전문적인 보도사진 스타일. 텍스트 없음.`;

      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image:generateContent?key=${geminiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { responseModalities: ['IMAGE', 'TEXT'] }
        })
      });

      const data = await res.json();
      const imagePart = data.candidates?.[0]?.content?.parts?.find(p => p.inlineData);

      if (!imagePart) {
        toast('이미지 생성 실패 — ' + (data.error?.message || 'API 오류'), 'error');
        return;
      }

      const base64 = `data:${imagePart.inlineData.mimeType};base64,${imagePart.inlineData.data}`;

      // R2에 업로드
      const secret = getUploadSecret();
      if (secret) {
        try {
          const res2 = await fetch(`${UPLOAD_WORKER_URL}/upload`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${secret}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              base64: base64,
              mimeType: imagePart.inlineData.mimeType,
              filename: `ai_${Date.now()}.png`,
            }),
          });
          const uploadData = await res2.json();
          if (uploadData.url) {
            document.getElementById('edit-image-url').value = uploadData.url;
            showImagePreview(uploadData.url);
            toast('AI 이미지 생성 + 업로드 완료!', 'success');
            return;
          }
        } catch(e) {}
      }
      // 업로드 실패 시 base64로 임시 저장
      document.getElementById('edit-image-url').value = base64;
      showImagePreview(base64);
      toast('AI 이미지 생성 완료! (R2 업로드 실패 — base64 임시저장)', 'success');
    } catch(e) {
      toast(`생성 실패: ${e.message}`, 'error');
    }
  }

  async function searchPixabay() {
    const defaultQ = document.getElementById('edit-title-ko').value.slice(0, 50);
    const q = prompt('검색어 (영문 권장):', defaultQ);
    if (!q) return;

    const box = document.getElementById('pixabay-results');
    box.style.display = 'grid';
    box.innerHTML = '<div style="grid-column:1/-1;font-size:12px;">검색 중...</div>';

    try {
      const res = await fetch(`${PIXABAY_WORKER_URL}/?q=${encodeURIComponent(q)}`);
      const data = await res.json();
      const hits = data.hits || [];
      if (!hits.length) {
        box.innerHTML = '<div style="grid-column:1/-1;font-size:12px;">결과 없음</div>';
        return;
      }
      box.innerHTML = '';
      hits.forEach(h => {
        const img = document.createElement('img');
        img.src = h.previewURL;
        img.style.cssText = 'width:100%;height:70px;object-fit:cover;cursor:pointer;border:1px solid var(--border);border-radius:4px;';
        img.title = h.tags;
        img.onclick = () => {
          const choice = prompt('1 = 대표 이미지 설정 / 2 = 본문 커서 위치에 삽입', '1');
          if (choice === '1') {
            document.getElementById('edit-image-url').value = h.largeImageURL;
            showImagePreview(h.largeImageURL);
            box.style.display = 'none';
          } else if (choice === '2') {
            const ta = document.getElementById('edit-summary-ko');
            const pos = ta.selectionStart ?? ta.value.length;
            const insert = `\n![](${h.largeImageURL})\n`;
            ta.value = ta.value.slice(0, pos) + insert + ta.value.slice(pos);
            ta.focus();
            ta.selectionStart = ta.selectionEnd = pos + insert.length;
            toast('본문에 이미지가 삽입됐습니다', 'success');
          }
        };
        box.appendChild(img);
      });
    } catch (e) {
      box.innerHTML = `<div style="grid-column:1/-1;font-size:12px;color:red;">오류: ${e.message}</div>`;
    }
  }

        <input id="rss-name" placeholder="소스명" style="flex:1;min-width:120px;padding:6px 10px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:12px;">
        <input id="rss-category" placeholder="카테고리 (예: 경제)" style="width:130px;padding:6px 10px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:12px;">
        <input id="rss-subcategory" placeholder="서브카테고리" style="width:130px;padding:6px 10px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:12px;">
        <input id="rss-url" placeholder="RSS URL (https://...)" style="flex:2;min-width:200px;padding:6px 10px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:12px;">
        <button class="btn btn-primary" style="font-size:12px;" onclick="addRssSource()">+ 추가</button>
      </div>
      <table class="calendar-table">
        <thead><tr>
          <th>소스명</th><th style="width:80px;">카테고리</th><th style="width:100px;">서브카테고리</th><th>URL</th><th style="width:120px;">관리</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  async function addRssSource() {
    const name = document.getElementById('rss-name').value.trim();
    const category = document.getElementById('rss-category').value.trim();
    const subcategory = document.getElementById('rss-subcategory').value.trim() || category;
    const url = document.getElementById('rss-url').value.trim();

    if (!name || !category || !url) { toast('소스명, 카테고리, URL은 필수입니다.', 'error'); return; }
    if (!url.startsWith('http')) { toast('URL 형식이 잘못됐습니다.', 'error'); return; }

    const { error } = await sb.from('rss_sources').insert({ name, category, subcategory, url, is_active: true });
    if (error) {
      toast(error.code === '23505' ? '이미 등록된 URL입니다.' : `오류: ${error.message}`, 'error');
      return;
    }
    toast('소스가 추가되었습니다.');
    showRssSources(document.getElementById('rss-menu'));
  }

  async function toggleRssSource(id, active) {
    const { error } = await sb.from('rss_sources').update({ is_active: active }).eq('id', id);
    if (error) { toast(`오류: ${error.message}`, 'error'); return; }
    toast(active ? '활성화되었습니다.' : '중지되었습니다.');
    showRssSources(document.getElementById('rss-menu'));
  }

  async function deleteRssSource(id, name) {
    if (!confirm(`"${name}" 소스를 삭제할까요?\n(비활성화만 원하면 취소 후 ⏸ 중지를 사용하세요)`)) return;
    const { error } = await sb.from('rss_sources').delete().eq('id', id);
    if (error) { toast(`오류: ${error.message}`, 'error'); return; }
    toast('삭제되었습니다.');
    showRssSources(document.getElementById('rss-menu'));
  }

  // ── 발행 통계 ────────────────────────────────────────

  async function showStats(el) {
    currentSection = 'stats';
    document.querySelectorAll('.sidebar-item').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('main-content').innerHTML = '<div class="loading">로딩 중...</div>';

    // 자체기사(NewsFinal) 집계 + 조회수 델타 — DB RPC 병렬 호출
    const [statsRes, viewsRes] = await Promise.all([
      sb.rpc('admin_stats', { p_days: 30 }),
      sb.rpc('daily_views', { p_days: 30 })
    ]);
    const { data: stats, error } = statsRes;
    if (error) { document.getElementById('main-content').innerHTML = `<div class="empty">오류: ${error.message}</div>`; return; }
    const vdata = viewsRes.data || {};
    const vDaily = vdata.daily || [];
    const vTop = vdata.top || [];
    const vTopDay = vdata.top_day || null;

    const totalAllTime = stats.all_total || 0;
    const publishedAllTime = stats.all_published || 0;

    // 일별(KST)·카테고리 맵 구성
    const byDate = {};
    (stats.daily || []).forEach(r => { byDate[r.d] = { total: r.total, published: r.published }; });
    const byCategory = {};
    (stats.categories || []).forEach(r => { byCategory[r.cat] = r.cnt; });

    // 최근 30일 날짜 배열 (KST, 빈 날짜도 0으로 채움)
    const days = [];
    for (let i = 29; i >= 0; i--) {
      const d = new Date(Date.now() + 9 * 3600000 - i * 86400000).toISOString().slice(0, 10);
      days.push(d);
    }

    const counts = days.map(d => byDate[d]?.total || 0);
    const maxCount = Math.max(...counts, 1);
    const totalArticles = counts.reduce((s, c) => s + c, 0);
    const totalPublished = days.reduce((s, d) => s + (byDate[d]?.published || 0), 0);
    const avgPerDay = (totalArticles / 30).toFixed(1);
    const last7 = days.slice(-7).reduce((s, d) => s + (byDate[d]?.total || 0), 0);
    const avg7 = (last7 / 7).toFixed(1);

    const barsHtml = days.map((d, i) => {
      const c = byDate[d]?.total || 0;
      const p = byDate[d]?.published || 0;
      const heightPct = Math.round((c / maxCount) * 100);
      const label = d.slice(5).replace('-', '/');
      return `
        <div style="display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;" title="${d}: 생성 ${c}건 (발행 ${p}건)">
          <div style="font-size:9px;color:var(--muted);margin-bottom:2px;">${c > 0 ? c : ''}</div>
          <div style="width:100%;max-width:18px;height:120px;display:flex;align-items:flex-end;">
            <div style="width:100%;background:var(--accent);border-radius:2px 2px 0 0;height:${heightPct}%;min-height:${c > 0 ? '2px' : '0'};"></div>
          </div>
          <div style="font-size:9px;color:var(--muted);margin-top:4px;height:14px;white-space:nowrap;">${label}</div>
        </div>`;
    }).join('');

    const categoryRows = Object.entries(byCategory)
      .sort((a, b) => b[1] - a[1])
      .map(([cat, cnt]) => `
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;">
          <span>${cat}</span><span class="muted">${cnt}건</span>
        </div>`).join('');

    // ── 조회수 델타(스냅샷 기반) ──
    const vMax = Math.max(...vDaily.map(r => r.total), 1);
    const vSum30 = vDaily.reduce((s, r) => s + r.total, 0);
    const vTopDayTotal = (vDaily.find(r => r.day === vTopDay) || {}).total || 0;
    const vStep = Math.max(1, Math.ceil(vDaily.length / 8));
    const vBarsHtml = vDaily.map((r, i) => {
      const c = r.total;
      const hp = Math.round((c / vMax) * 100);
      const label = r.day.slice(5).replace('-', '/');
      return `
        <div style="display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;" title="${r.day}: +${c} 조회">
          <div style="font-size:9px;color:var(--muted);margin-bottom:2px;">${c > 0 ? c : ''}</div>
          <div style="width:100%;max-width:18px;height:120px;display:flex;align-items:flex-end;">
            <div style="width:100%;background:var(--accent);border-radius:2px 2px 0 0;height:${hp}%;min-height:${c > 0 ? '2px' : '0'};"></div>
          </div>
          <div style="font-size:9px;color:var(--muted);margin-top:4px;height:14px;white-space:nowrap;">${label}</div>
        </div>`;
    }).join('');
    const vChartBlock = vDaily.length === 0
      ? `<div class="empty" style="line-height:1.7;">조회수 증가 데이터는 매일 00:05(KST) 수집됩니다.<br><span class="muted">2일치가 쌓이면 내일부터 표시됩니다.</span></div>`
      : `<div style="display:flex;gap:2px;align-items:flex-end;">${vBarsHtml}</div>`;
    const vTopRows = vDaily.length === 0
      ? `<div class="muted" style="font-size:12px;padding:8px 0;">데이터 대기 중</div>`
      : (vTop.length === 0
        ? `<div class="muted" style="font-size:12px;padding:8px 0;">상승 기사 없음</div>`
        : vTop.map((r, i) => `
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;">
          <span style="color:var(--muted);width:18px;text-align:right;">${i + 1}</span>
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${(r.title_ko || '').replace(/"/g, '&quot;')}">${r.title_ko || '(제목 없음)'}</span>
          <span style="color:var(--accent);font-weight:700;white-space:nowrap;">+${r.delta}</span>
          <span class="muted" style="white-space:nowrap;">누적 ${r.view_count}</span>
        </div>`).join(''));

    document.getElementById('main-content').innerHTML = `
      <div style="font-size:13px;font-weight:700;margin-bottom:16px;">발행 통계 (최근 30일 · 자체기사)</div>
      <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;">
        <div style="flex:1;min-width:140px;background:var(--bg2);border:1px solid var(--border);padding:12px 16px;">
          <div style="font-size:11px;color:var(--muted);">자체기사 누적</div>
          <div style="font-size:20px;font-weight:700;color:var(--accent);">${(totalAllTime ?? 0).toLocaleString()}건</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px;">발행 ${(publishedAllTime ?? 0).toLocaleString()}건</div>
        </div>
        <div style="flex:1;min-width:140px;background:var(--bg2);border:1px solid var(--border);padding:12px 16px;">
          <div style="font-size:11px;color:var(--muted);">30일 생성</div>
          <div style="font-size:20px;font-weight:700;color:var(--accent);">${totalArticles.toLocaleString()}건</div>
        </div>
        <div style="flex:1;min-width:140px;background:var(--bg2);border:1px solid var(--border);padding:12px 16px;">
          <div style="font-size:11px;color:var(--muted);">발행됨</div>
          <div style="font-size:20px;font-weight:700;">${totalPublished.toLocaleString()}건</div>
        </div>
        <div style="flex:1;min-width:140px;background:var(--bg2);border:1px solid var(--border);padding:12px 16px;">
          <div style="font-size:11px;color:var(--muted);">일평균 (30일)</div>
          <div style="font-size:20px;font-weight:700;">${avgPerDay}건</div>
        </div>
        <div style="flex:1;min-width:140px;background:var(--bg2);border:1px solid var(--border);padding:12px 16px;">
          <div style="font-size:11px;color:var(--muted);">일평균 (최근 7일)</div>
          <div style="font-size:20px;font-weight:700;">${avg7}건</div>
        </div>
        <div style="flex:1;min-width:140px;background:var(--bg2);border:1px solid var(--border);padding:12px 16px;">
          <div style="font-size:11px;color:var(--muted);">조회수 증가 (측정일)</div>
          <div style="font-size:20px;font-weight:700;color:var(--accent);">+${vTopDayTotal.toLocaleString()}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px;">${vTopDay || '대기 중'}</div>
        </div>
        <div style="flex:1;min-width:140px;background:var(--bg2);border:1px solid var(--border);padding:12px 16px;">
          <div style="font-size:11px;color:var(--muted);">조회수 증가 (30일)</div>
          <div style="font-size:20px;font-weight:700;">+${vSum30.toLocaleString()}</div>
        </div>
      </div>
      <div style="background:var(--bg2);border:1px solid var(--border);padding:16px;margin-bottom:20px;">
        <div style="font-size:12px;font-weight:700;margin-bottom:12px;">일별 생성 건수 (자체기사)</div>
        <div style="display:flex;gap:2px;align-items:flex-end;">${barsHtml}</div>
      </div>
      <div style="background:var(--bg2);border:1px solid var(--border);padding:16px;margin-bottom:20px;">
        <div style="font-size:12px;font-weight:700;margin-bottom:12px;">일별 증가 조회수 (발행 자체기사)</div>
        ${vChartBlock}
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;">
        <div style="flex:1;min-width:280px;background:var(--bg2);border:1px solid var(--border);padding:16px;">
          <div style="font-size:12px;font-weight:700;margin-bottom:8px;">카테고리별 분포 (30일 · 자체기사)</div>
          ${categoryRows}
        </div>
        <div style="flex:1;min-width:280px;background:var(--bg2);border:1px solid var(--border);padding:16px;">
          <div style="font-size:12px;font-weight:700;margin-bottom:8px;">당일 상승 기사 Top 10 <span class="muted" style="font-weight:400;">(${vTopDay || '-'})</span></div>
          ${vTopRows}
        </div>
      </div>`;
  }

  // ── 토스트 ────────────────────────────────────────────

  function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast show ${type}`;
    setTimeout(() => el.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
