<!DOCTYPE html>
<html lang="ko">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4162743270017653" crossorigin="anonymous"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <meta name="description" content="NewsFinal 세계 날씨 — 프론티어마켓 및 주요국 실시간 날씨와 주말·주간 예보">
  <title>세계의 날씨 — NewsFinal</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7TKGYEM467"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-7TKGYEM467');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8f6f1; --bg2: #ffffff; --bg3: #f0ede6;
      --border: #ddd9d0; --text: #1a1a1a; --muted: #888;
      --accent: #8b5e2a; --accent2: #1a5fa8; --red: #c0392b; --green: #1a7a3c;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; font-size: 14px; line-height: 1.6; }

    header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 24px; }
    .header-top {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border); font-family: 'IBM Plex Mono', monospace;
      font-size: 10px; color: var(--muted); background: var(--bg3);
      margin: 0 -24px; padding: 5px 24px; gap: 16px; line-height: 1.4;
    }
    .ticker-strip { display: flex; overflow: hidden; flex: 1; }
    .ticker-track { display: flex; gap: 18px; white-space: nowrap; animation: ticker-scroll 90s linear infinite; }
    .ticker-strip:hover .ticker-track { animation-play-state: paused; }
    @keyframes ticker-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .ticker-item { display: flex; gap: 5px; align-items: center; white-space: nowrap; }
    .ticker-label { color: var(--muted); }
    .ticker-val { color: var(--text); font-weight: 500; }
    .up { color: var(--red); } .down { color: var(--accent2); }
    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; white-space: nowrap; }

    .header-main {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 0; border-bottom: 3px solid var(--text);
    }
    .logo { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 900; letter-spacing: -1px; color: var(--text); text-decoration: none; }
    .logo span { color: var(--accent); }
    .header-meta { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); text-align: right; }

    nav.page-nav { display: flex; gap: 0; overflow-x: auto; background: var(--bg3); border-bottom: 1px solid var(--border); }
    nav.page-nav a {
      padding: 9px 14px; font-size: 12px; font-weight: 500; color: var(--muted);
      text-decoration: none; border-right: 1px solid var(--border); white-space: nowrap;
      transition: color 0.2s, background 0.2s;
    }
    nav.page-nav a:first-child { border-left: 1px solid var(--border); }
    nav.page-nav a:hover, nav.page-nav a.active { color: var(--accent2); background: var(--bg2); }

    /* 메인과 동일한 레이아웃 */
    .container {
      max-width: 1400px; margin: 0 auto; padding: 24px;
      display: grid; grid-template-columns: 1fr 300px; gap: 24px;
    }

    .feed-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; padding-bottom: 10px; border-bottom: 2px solid var(--text);
    }
    .feed-title { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--accent); letter-spacing: 1px; }
    .feed-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); }

    /* 필터 탭 */
    .filter-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-tab {
      padding: 5px 12px; font-size: 11px; font-family: 'IBM Plex Mono', monospace;
      border: 1px solid var(--border); background: var(--bg2); color: var(--muted);
      cursor: pointer; transition: color 0.2s, background 0.2s;
    }
    .filter-tab:hover { color: var(--accent2); }
    .filter-tab.active { background: var(--accent2); color: #fff; border-color: var(--accent2); }

    /* 날씨 카드 — index.html article-card 스타일 */
    .weather-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-left: 3px solid var(--border); padding: 14px 16px;
      cursor: pointer; margin-bottom: 8px;
      transition: border-left-color 0.2s, background 0.2s;
    }
    .weather-card:hover { border-left-color: var(--accent2); background: var(--bg3); }
    .weather-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 8px; }
    .weather-card-country { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--accent2); font-weight: 700; padding: 2px 7px; border: 1px solid var(--accent2); background: var(--bg3); }
    .weather-card-time { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); white-space: nowrap; }
    .weather-card-title { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.4; }

    /* 사이드바 */
    .sidebar { display: flex; flex-direction: column; gap: 16px; }
    .widget { background: var(--bg2); border: 1px solid var(--border); }
    .widget-header {
      padding: 10px 14px; border-bottom: 2px solid var(--text);
      font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text);
      letter-spacing: 1px; text-transform: uppercase; display: flex; justify-content: space-between; font-weight: 500;
    }
    .cal-item {
      padding: 9px 14px; border-bottom: 1px solid var(--border);
      font-size: 12px; display: flex; gap: 8px; align-items: flex-start;
    }
    .cal-item:last-child { border-bottom: none; }
    .cal-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
    .cal-dot.high { background: #c0392b; }
    .cal-dot.medium { background: #c8a060; }
    .cal-dot.low { background: var(--muted); }
    .cal-meta { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); margin-bottom: 2px; }
    .cal-title { color: var(--text); line-height: 1.4; }

    .briefing-item { padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .briefing-item:last-child { border-bottom: none; }
    .briefing-region { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--accent); margin-bottom: 4px; }
    .briefing-title { font-size: 12px; color: var(--text); line-height: 1.5; cursor: pointer; }
    .briefing-title:hover { color: var(--accent); }

    /* 페이지네이션 */
    .pagination { display: flex; gap: 4px; justify-content: center; align-items: center; margin-top: 18px; flex-wrap: wrap; }
    .pagination button {
      min-width: 30px; padding: 5px 9px; font-size: 11px; font-family: 'IBM Plex Mono', monospace;
      border: 1px solid var(--border); background: var(--bg2); color: var(--muted); cursor: pointer;
      transition: color 0.2s, background 0.2s;
    }
    .pagination button:hover:not(:disabled) { color: var(--accent2); background: var(--bg3); }
    .pagination button.active { background: var(--accent2); color: #fff; border-color: var(--accent2); }
    .pagination button:disabled { opacity: 0.35; cursor: default; }
    .pagination .ellipsis { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); padding: 0 4px; }

    .empty { padding: 30px; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); }

    footer { border-top: 2px solid var(--text); background: var(--bg2); padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); margin-top: 40px; }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--accent); }

    @media (max-width: 1024px) { .container { grid-template-columns: 1fr 260px; } }
    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; padding: 16px; }
      .sidebar { display: none; }
      header { padding: 0 16px; }
      .header-top { margin: 0 -16px; padding: 5px 16px; }
      .logo { font-size: 24px; }
      footer { flex-direction: column; gap: 8px; text-align: center; padding: 16px; }
    }
    @media (max-width: 480px) {
      .logo { font-size: 20px; }
      header { padding: 0 12px; }
      .container { padding: 12px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="ticker-strip" id="ticker"><span style="color:var(--muted)">시세 로딩 중...</span></div>
    <div class="header-right">
      <div id="datetime"></div>
    </div>
  </div>
  <div class="header-main">
    <a href="/" class="logo">News<span>Final</span></a>
    <div class="header-meta">프론티어 미디어</div>
  </div>
  <nav class="page-nav">
    <a href="/">홈</a>
    <a href="/live.html">트렌드</a>
    <a href="/?category=경제">경제</a>
    <a href="/?category=금융">금융</a>
    <a href="/?category=자원·에너지">자원·에너지</a>
    <a href="/?category=산업·기업">산업·기업</a>
    <a href="/?category=정치·외교">정치·외교</a>
    <a href="/?category=사회">사회</a>
    <a href="/?category=IT·과학">IT·과학</a>
    <a href="/archive.html">아카이브</a>
    <a href="/calendar.html">경제 일정</a>

    <a href="/country.html">국가별</a>
    <a href="/weather.html" class="active">날씨</a>
  </nav>
</header>

<div class="container">
  <main>
    <div class="feed-header">
      <span class="feed-title">● 세계의 날씨</span>
      <span class="feed-count" id="weather-count">로딩 중...</span>
    </div>
    <div class="filter-tabs" id="filter-tabs"></div>
    <div id="weather-container"><div class="empty">날씨 데이터 로딩 중</div></div>
    <div class="pagination" id="pagination"></div>
  </main>

  <aside class="sidebar">
    <div class="widget">
      <div class="widget-header">
        <span>예정 일정</span>
        <a href="/calendar.html" style="font-size:10px;color:var(--accent2);text-decoration:none;">전체 →</a>
      </div>
      <div id="calendar-widget"><div class="empty">데이터 준비 중</div></div>
    </div>
    <div class="widget">
      <div class="widget-header">
        <span>오늘의 브리핑</span>
        <a href="/" style="font-size:10px;color:var(--accent2);text-decoration:none;">전체 →</a>
      </div>
      <div id="briefing-widget"><div class="empty">데이터 준비 중</div></div>
    </div>
  </aside>
</div>

<footer>
  <div>NEWSFINAL © 2026</div>
  <div>
    <a href="/about.html">소개</a> ·
    <a href="/privacy.html">개인정보처리방침</a> ·
    <a href="/terms.html">이용약관</a>
  </div>
</footer>

<script>
  function nowKST() {
    return new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function updateTime() {
    const now = nowKST();
    document.getElementById('datetime').textContent =
      `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())} KST`;
  }
  updateTime();
  setInterval(updateTime, 60000);

  const SUPABASE_URL = 'https://fotdngseksqaghvtcvqh.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_rT3kSEAAdM0DJlDW5fEWww_M37h6dDW';

  let allWeather = [];
  let currentFilter = 'all';
  let currentPage = 1;
  const PAGE_SIZE = 20;

  function formatTime(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr.replace(' ', 'T'));
    if (isNaN(d)) return dateStr;
    return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function classify(a) {
    const t = a.title_ko || a.title_en || '';
    if (t.includes('주말')) return 'weekend';
    if (t.includes('다음주')) return 'weekly';
    return 'today';
  }

  function renderFilters() {
    const counts = { all: allWeather.length, today: 0, weekend: 0, weekly: 0 };
    allWeather.forEach(a => counts[classify(a)]++);
    const labels = { all: '전체', today: '오늘', weekend: '주말 예보', weekly: '다음주 예보' };
    document.getElementById('filter-tabs').innerHTML = Object.keys(labels).map(key =>
      `<div class="filter-tab ${currentFilter===key?'active':''}" onclick="setFilter('${key}')">${labels[key]} (${counts[key]})</div>`
    ).join('');
  }

  function setFilter(key) {
    currentFilter = key;
    currentPage = 1;
    renderFilters();
    renderWeather();
  }

  function goPage(n) {
    currentPage = n;
    renderWeather();
    const main = document.querySelector('.feed-header');
    if (main) main.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderPagination(totalPages) {
    const box = document.getElementById('pagination');
    if (!box) return;
    if (totalPages <= 1) { box.innerHTML = ''; return; }

    const parts = [];
    parts.push(`<button onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`);

    const push = n => parts.push(`<button class="${n===currentPage?'active':''}" onclick="goPage(${n})">${n}</button>`);
    const ell = () => parts.push('<span class="ellipsis">…</span>');

    if (totalPages <= 7) {
      for (let i = 1; i <= totalPages; i++) push(i);
    } else {
      push(1);
      if (currentPage > 4) ell();
      const start = Math.max(2, currentPage - 1);
      const end = Math.min(totalPages - 1, currentPage + 1);
      for (let i = start; i <= end; i++) push(i);
      if (currentPage < totalPages - 3) ell();
      push(totalPages);
    }

    parts.push(`<button onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>›</button>`);
    box.innerHTML = parts.join('');
  }

  function renderWeather() {
    const container = document.getElementById('weather-container');
    let items = currentFilter === 'all' ? allWeather : allWeather.filter(a => classify(a) === currentFilter);
    items = [...items].sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));

    const total = items.length;
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    if (!total) {
      document.getElementById('weather-count').textContent = '0건';
      container.innerHTML = '<div class="empty">해당 리포트가 없습니다.</div>';
      renderPagination(1);
      return;
    }

    const start = (currentPage - 1) * PAGE_SIZE;
    const pageItems = items.slice(start, start + PAGE_SIZE);
    document.getElementById('weather-count').textContent =
      `${total}건 중 ${start + 1}\u2013${start + pageItems.length}`;

    container.innerHTML = pageItems.map(a => {
      const title = a.title_ko || a.title_en || '';
      return `
        <div class="weather-card" onclick="location.href='article?id=${a.id}'">
          <div class="weather-card-header">
            <div style="display:flex;gap:6px;align-items:center;">
              <span class="weather-card-country">${a.country || '기타'}</span>
            </div>
            <span class="weather-card-time">${formatTime(a.created_at)}</span>
          </div>
          <div class="weather-card-title">${title}</div>
        </div>`;
    }).join('');

    renderPagination(totalPages);
  }

  async function loadWeather() {
    try {
      const params = new URLSearchParams();
      params.set('select', 'id,title_ko,title_en,country,created_at');
      params.set('category', 'eq.날씨');
      params.set('is_published', 'eq.true');
      params.set('order', 'created_at.desc');
      params.set('limit', '1000');

      const res = await fetch(`${SUPABASE_URL}/rest/v1/articles?${params.toString()}`, {
        headers: { 'apikey': SUPABASE_ANON_KEY }
      });
      if (!res.ok) throw new Error();
      allWeather = await res.json();

      renderFilters();
      renderWeather();
    } catch (e) {
      document.getElementById('weather-container').innerHTML = '<div class="empty">날씨 데이터를 불러올 수 없습니다.</div>';
    }
  }

  async function loadBriefing() {
    try {
      const res = await fetch('data/articles.json');
      if (!res.ok) throw new Error();
      const raw = await res.json();
      renderBriefing(raw.filter(a => a.category !== '날씨'));
    } catch (e) {
      document.getElementById('briefing-widget').innerHTML = '<div class="empty">데이터를 불러올 수 없습니다</div>';
    }
  }

  function renderBriefing(articles) {
    const container = document.getElementById('briefing-widget');
    const now = nowKST();
    const today = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
    const todayArticles = articles.filter(a =>
      a.source === 'NewsFinal' && a.country &&
      !(a.subcategory || '').startsWith('cluster_') &&
      (a.created_at || '').startsWith(today)
    );
    const byCountry = {};
    todayArticles.forEach(a => {
      const c = a.country;
      if (!byCountry[c]) byCountry[c] = [];
      if (byCountry[c].length < 2) byCountry[c].push(a);
    });
    if (!Object.keys(byCountry).length) {
      container.innerHTML = '<div class="empty">오늘 브리핑 준비 중</div>';
      return;
    }
    container.innerHTML = Object.entries(byCountry).slice(0, 8).map(([country, items]) => `
      <div class="briefing-item">
        <div class="briefing-region">${country}</div>
        ${items.map(a => `<div class="briefing-title" onclick="location.href='article?id=${a.id}'">· ${a.title_ko || a.title_en}</div>`).join('')}
      </div>`).join('');
  }

  async function loadCalendarWidget() {
    const container = document.getElementById('calendar-widget');
    try {
      const now = nowKST();
      const today = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/econ_events?select=*&event_date=gte.${today}&is_verified=eq.true&order=event_date.asc,event_time.asc&limit=6`,
        { headers: { 'apikey': SUPABASE_ANON_KEY } }
      );
      if (!res.ok) throw new Error();
      const events = await res.json();
      if (!events.length) { container.innerHTML = '<div class="empty">예정된 일정이 없습니다</div>'; return; }
      container.innerHTML = events.map(ev => {
        const d = new Date(ev.event_date + 'T00:00:00');
        const dateStr = `${d.getMonth()+1}/${d.getDate()}`;
        return `<div class="cal-item">
          <div class="cal-dot ${ev.importance || 'medium'}"></div>
          <div>
            <div class="cal-meta">${dateStr}${ev.event_time ? ' ' + ev.event_time : ''} ${ev.country_flag || ''} ${ev.country || ''}</div>
            <div class="cal-title">${ev.title}</div>
          </div>
        </div>`;
      }).join('');
    } catch(e) {
      container.innerHTML = '<div class="empty">일정을 불러올 수 없습니다</div>';
    }
  }

  async function loadMarketData() {
    try {
      const res = await fetch('data/market_data.json');
      if (!res.ok) return;
      const data = await res.json();
      const indices = data.indices || [];
      if (!indices.length) return;
      const ticker = document.getElementById('ticker');
      if (!ticker) return;
      const itemsHtml = indices.map(m => {
        const sign = m.change_pct >= 0 ? '+' : '';
        const cls = m.change_pct >= 0 ? 'up' : 'down';
        return `<span class="ticker-item"><span class="ticker-label">${m.name}</span><span class="ticker-val ${cls}">${m.price.toLocaleString()} ${sign}${m.change_pct.toFixed(2)}%</span></span>`;
      }).join('');
      ticker.innerHTML = `<div class="ticker-track">${itemsHtml}${itemsHtml}</div>`;
    } catch(e) {}
  }

  loadMarketData();
  loadWeather();
  loadBriefing();
  loadCalendarWidget();
</script>
</body>
</html>
