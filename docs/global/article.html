<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta property="og:type" content="article">
  <meta property="og:title" content="NewsFinal Global">
  <link rel="canonical" href="https://global.newsfinal.co.kr/article.html" id="canonicalLink" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <title>NewsFinal Global</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8f6f1; --bg2: #ffffff; --bg3: #f0ede6;
      --border: #ddd9d0; --text: #1a1a1a; --muted: #888; --accent: #8b5e2a; --accent2: #1a5fa8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Noto Sans', sans-serif; font-size: 16px; line-height: 1.7; }
    header { background: var(--bg2); border-bottom: 3px solid var(--text); padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .logo { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 900; color: var(--text); text-decoration: none; }
    .logo span { color: var(--accent); }
    .lang-switch { display: flex; gap: 6px; }
    .lang-switch a, .lang-switch span {
      font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 6px 12px;
      border: 1px solid var(--border); text-decoration: none; color: var(--muted); background: var(--bg2);
    }
    .lang-switch a:hover { border-color: var(--accent); color: var(--accent); }
    .lang-switch .active { background: var(--text); color: #fff; border-color: var(--text); }
    main { max-width: 720px; margin: 0 auto; padding: 32px 24px 60px; }
    .back { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); text-decoration: none; margin-bottom: 20px; }
    .back:hover { color: var(--accent); }
    .category-badge {
      display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700;
      color: var(--accent2); border: 1px solid var(--accent2); padding: 3px 9px; margin-bottom: 12px;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    h1 { font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 900; margin-bottom: 14px; }
    .meta { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .hero-image { width: 100%; max-height: 420px; object-fit: cover; margin-bottom: 24px; background: var(--bg3); }
    .body { white-space: pre-wrap; font-size: 16px; }
    .body p { margin-bottom: 1.2em; }
    .empty { color: var(--muted); text-align: center; padding: 60px 0; }
    [lang="hi"] body, body.lang-hi { font-family: 'Noto Sans Devanagari', 'Noto Sans', sans-serif; }
    .source-link {
      margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border);
      font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted);
    }
    .share-btn { float: right; background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; cursor: pointer; color: var(--text); font-size: 12px; }
    .related { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border); }
    .related-title {
      font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700;
      letter-spacing: 0.08em; color: var(--text); margin-bottom: 14px; text-transform: uppercase;
    }
    .related-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
    .related-item:last-child { border-bottom: none; }
    .related-item-title { display: block; font-size: 14px; color: var(--text); text-decoration: none; }
    .related-item-title:hover { color: var(--accent); }
    .related-meta { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); margin-top: 4px; }
    footer {
      border-top: 1px solid var(--border); background: var(--bg2);
      padding: 24px; text-align: center; font-family: 'IBM Plex Mono', monospace;
      font-size: 11px; color: var(--muted);
    }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
      <a class="logo" href="index.html" id="homeLink">News<span>Final</span> Global</a>
      <a href="/" style="font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;border:1px solid var(--border);padding:5px 10px;">KR</a>
      <nav class="lang-switch" id="langSwitch"></nav>
    </div>
  </header>
  <main>
    <a class="back" id="backLink" href="index.html">&larr; Back</a>
    <div id="content"><div class="empty">Loading…</div></div>
  </main>
  <footer>
    <div>NEWSFINAL © 2026</div>
    <div style="margin-top:6px;">
      <a href="https://newsfinal.co.kr/about.html">About</a> ·
      <a href="https://newsfinal.co.kr/privacy.html">Privacy</a> ·
      <a href="https://newsfinal.co.kr/terms.html">Terms</a>
    </div>
  </footer>

  <script>
    const LANGS = {
      en: { name: "English", back: "← Back", notFound: "Article not found.", locale: "en-US", share: "🔗 Share", related: "Related Articles", copied: "Link copied." },
      hi: { name: "हिन्दी", back: "← वापस", notFound: "लेख नहीं मिला।", locale: "hi-IN", share: "🔗 साझा करें", related: "संबंधित लेख", copied: "लिंक कॉपी हो गया।" },
      fr: { name: "Français", back: "← Retour", notFound: "Article introuvable.", locale: "fr-FR", share: "🔗 Partager", related: "Articles similaires", copied: "Lien copié." },
      es: { name: "Español", back: "← Volver", notFound: "Artículo no encontrado.", locale: "es-ES", share: "🔗 Compartir", related: "Artículos relacionados", copied: "Enlace copiado." },
    };
    // domestic_kr_fetcher.py의 카테고리(한국어 원본) → 언어별 표시 라벨.
    const CATEGORY_LABELS = {
      "문화·예술": { en: "Culture", hi: "संस्कृति", fr: "Culture", es: "Cultura" },
      "경제": { en: "Economy", hi: "अर्थव्यवस्था", fr: "Économie", es: "Economía" },
      "정치·외교": { en: "Politics", hi: "राजनीति", fr: "Politique", es: "Política" },
      "IT·과학": { en: "Tech", hi: "तकनीक", fr: "Technologie", es: "Tecnología" },
      "사회": { en: "Society", hi: "समाज", fr: "Société", es: "Sociedad" },
      "글로벌": { en: "Korea", hi: "कोरिया", fr: "Corée", es: "Corea" },
    };
    const params = new URLSearchParams(location.search);
    const lang = LANGS[params.get('lang')] ? params.get('lang') : 'en';
    const id = params.get('id');

    document.documentElement.lang = lang;
    document.getElementById('homeLink').href = 'index.html?lang=' + lang;
    document.getElementById('backLink').href = 'index.html?lang=' + lang;
    document.getElementById('backLink').textContent = LANGS[lang].back;

    const switchEl = document.getElementById('langSwitch');
    Object.keys(LANGS).forEach(code => {
      const el = document.createElement(code === lang ? 'span' : 'a');
      if (code !== lang) el.href = 'article.html?lang=' + code + '&id=' + id;
      el.className = code === lang ? 'active' : '';
      el.textContent = code.toUpperCase();
      switchEl.appendChild(el);
    });

    function formatDate(str) {
      if (!str) return '';
      const d = new Date(str);
      if (isNaN(d)) return str;
      try {
        return new Intl.DateTimeFormat(LANGS[lang].locale, { dateStyle: 'medium', timeStyle: 'short' }).format(d);
      } catch (e) {
        return d.toISOString().slice(0, 16).replace('T', ' ');
      }
    }

    function bodyToParagraphs(text) {
      return (text || '')
        .split(/\n\s*\n/)
        .map(p => p.trim())
        .filter(Boolean)
        .map(p => `<p>${escapeHtml(p)}</p>`)
        .join('');
    }

    fetch('/data/global/' + lang + '.json')
      .then(r => r.json())
      .then(data => {
        const article = (data.articles || []).find(a => String(a.id) === String(id));
        const content = document.getElementById('content');
        if (!article) {
          content.innerHTML = '<div class="empty">' + LANGS[lang].notFound + '</div>';
          return;
        }
        document.title = article.title + ' — NewsFinal Global';
        const canonical = document.getElementById('canonicalLink');
        canonical.href = 'https://global.newsfinal.co.kr/article.html?lang=' + lang + '&id=' + id;
        document.querySelector('meta[property="og:title"]').setAttribute('content', article.title);

        let categoryHtml = '';
        const catLabel = CATEGORY_LABELS[article.category];
        if (catLabel) {
          categoryHtml = `<div class="category-badge">${escapeHtml(catLabel[lang] || catLabel.en)}</div>`;
        }

        let imageHtml = '';
        if (article.image_url) {
          imageHtml = `<img class="hero-image" src="${escapeHtml(article.image_url)}" alt="" loading="lazy" onerror="this.remove()">`;
        }

        const related = (data.articles || [])
          .filter(a => String(a.id) !== String(id) && a.category === article.category)
          .slice(0, 4);
        const relatedHtml = related.length ? `
          <div class="related">
            <div class="related-title">${escapeHtml(LANGS[lang].related)}</div>
            ${related.map(r => `
              <div class="related-item">
                <a class="related-item-title" href="article.html?lang=${lang}&id=${r.id}">${escapeHtml(r.title)}</a>
                <div class="related-meta">NewsFinal · ${escapeHtml(formatDate(r.created_at))}</div>
              </div>
            `).join('')}
          </div>
        ` : '';

        content.innerHTML = `
          ${categoryHtml}
          <h1>${escapeHtml(article.title)}</h1>
          <div class="meta">${escapeHtml(formatDate(article.created_at))}</div>
          ${imageHtml}
          <div class="body">${bodyToParagraphs(article.summary)}</div>
          <div class="source-link">ⓒ NewsFinal <button class="share-btn" onclick="shareArticle()">${escapeHtml(LANGS[lang].share)}</button></div>
          ${relatedHtml}
        `;
      })
      .catch(() => {
        document.getElementById('content').innerHTML = '<div class="empty">' + LANGS[lang].notFound + '</div>';
      });

    function escapeHtml(s) {
      return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function shareArticle() {
      const url = location.href;
      const title = document.title;
      if (navigator.share) {
        try { await navigator.share({ title, url }); } catch (e) {}
      } else {
        try {
          await navigator.clipboard.writeText(url);
          alert(LANGS[lang].copied);
        } catch (e) {
          prompt('URL:', url);
        }
      }
    }
  </script>
</body>
</html>
