    // canonical을 데이터 로딩 전, 파싱 즉시 실제 기사 주소로 고정 —
    // 그렇지 않으면 크롤러가 id 없는 일반 주소를 정본으로 읽어
    // "적절한 표준 태그가 포함된 대체 페이지"로 색인 제외되는 문제가 생김
    //
    // URL은 확장자 없는 형태(article?id=..)를 사용한다. Cloudflare Pages가
    // *.html?query 요청을 자동으로 확장자 없는 주소로 301 리디렉션하는
    // 내장 동작이 있어(끌 수 없음), canonical이 .html 버전을 가리키면
    // 구글이 "리디렉션이 포함된 페이지"로 색인 제외한다.
    (function() {
      var id = new URLSearchParams(location.search).get('id');
      if (id) {
        var link = document.querySelector('link[rel="canonical"]');
        if (link) link.setAttribute('href', 'https://newsfinal.co.kr/article?id=' + encodeURIComponent(id));
      }
    })();
  </script>

<script>

  const REGION_KO = {
    'africa': '아프리카', 'southeast_asia': '동남아시아',
    'eastern_europe': '동유럽', 'middle_east': '중동',

    'north_america': '북미', 'east_asia': '동아시아', 'europe': '유럽',
  };
  function regionKo(r) { return REGION_KO[r] || r || ''; }
  // 상단 [업데이트] 블록을 걷어내고 원 본문만 반환한다. 요약·메타 설명 전용.
// 본문 렌더에는 쓰지 않는다 — 독자에게는 업데이트가 맨 위에 보여야 한다.
// 카드나 검색 스니펫에 "■ 8월 4일 12:31 — …"이 먼저 나오면 무슨 사건인지
// 알 수 없으므로, 사건을 설명하는 원 본문 리드를 쓴다.
function stripUpdates(text) {
  const s = String(text || '');
  if (!s.replace(/^\s+/, '').startsWith('[업데이트]')) return s;
  const i = s.indexOf('\n────────');
  if (i === -1) return s;
  const rest = s.slice(i + 1);
  const nl = rest.indexOf('\n');
  return nl === -1 ? '' : rest.slice(nl + 1).replace(/^\n+/, '');
}

function cleanBody(text) {
    if (!text) return '';
    text = text
      .replace(/\*\*(.+?)\*\*/g, '$1')
      .replace(/\*(.+?)\*/g, '$1')
      .replace(/^#{1,6}\s+/gm, '')
      .replace(/\[.{1,20}=.{1,30}\]/g, '')
      // 같은 줄에 내용이 이어지는 프리픽스 태그만 제거. 국가 헤더([베트남] 등)는 보존.
      .replace(/^\[.{1,30}\][ \t]*(?=\S)/gm, '');
    const promoPatterns = [
      /[^.]*텔레그램 채널[^.]*\./g,
      /[^.]*구독[^.]*프리미엄[^.]*\./g,
      /[^.]*ET Prime[^.]*\./g,
      /[^.]*뉴스레터[^.]*구독[^.]*\./g,
      /[^.]*앱[^.]*다운로드[^.]*\./g,
      /[^.]*더 많은 정보[^.]*방문[^.]*\./g,
    ];
    promoPatterns.forEach(p => { text = text.replace(p, ''); });
    return text.trim();
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function nowKST() {
    return new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
  }

  function updateDatetime() {
    const now = nowKST();
    const el = document.getElementById('datetime');
    if (el) el.textContent = `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())} KST`;
  }
  updateDatetime();
  setInterval(updateDatetime, 30000);

  async function loadMarketData() {
    try {
      const res = await fetch('/data/market_data.json');
      if (!res.ok) return;
      const data = await res.json();
      const indices = data.indices || [];
      if (!indices.length) return;
      const ticker = document.getElementById('ticker');
      if (!ticker) return;
      const itemsHtml = indices.map(m => {
        const sign = m.change_pct >= 0 ? '+' : '';
        const cls = m.change_pct >= 0 ? 'up' : 'down';
        return `<span class="ticker-item"><span class="ticker-label">${m.name}</span><span class="ticker-val ${cls}">${m.price.toLocaleString()} ${sign}${m.change_pct.toFixed(2)}%</span></span>`;
      }).join('');
      ticker.innerHTML = `<div class="ticker-track">${itemsHtml}${itemsHtml}</div>`;
    } catch(e) {}
  }

  // 현재 보고 있는 기사 1건을 Supabase에서 직접(라이브) 조회한다.
  // loadArticle()이 항상 이 경로를 쓴다 — articles.json(export_articles.py가
  // 주기적으로만 재생성하는 스냅샷)에 의존하면 DB를 고쳐도 다음 재생성 전까지
  // 화면에 옛 내용이 남는다.
  async function fetchArticleFromSupabase(id) {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/articles?id=eq.${encodeURIComponent(id)}&is_published=eq.true&select=*`,
        { headers: { 'apikey': SUPABASE_ANON_KEY } }
      );
      if (!res.ok) return null;
      const rows = await res.json();
      return rows[0] || null;
    } catch(e) { return null; }
  }


  // 업데이트 기록 공개 필터 — /js/update-log-filter.js 공용 모듈(위 module 스크립트에서
  // window.publicUpdateLog로 로드됨). 2026-09-01, 이 파일에 로컬 복붙본이 따로 있다가
  // export_articles.py/functions/article.js의 8/9 화이트리스트→블랙리스트 수정이 반영
  // 안 돼 재발(id=118417)한 걸 계기로 공용 모듈로 통합.

  async function loadArticle() {
    const params = new URLSearchParams(location.search);
    const id = params.get('id');

    if (!id) {
      document.getElementById('article-wrapper').innerHTML = '<div class="error">기사를 찾을 수 없습니다.</div>';
      return;
    }

    try {
      // 본문은 항상 Supabase에서 라이브 조회한다 — DB를 고쳐도 다음 스냅샷
      // 재생성 전까지 옛 내용이 계속 보이는 문제(실사고 2026-08-16, id=79327:
      // 오역된 영화 제목을 DB에서 고쳤는데도 화면엔 그대로 남아있었음)를 막기 위함.
      // articles.json은 "관련 기사" 목록용으로만 병렬로 같이 가져온다.
      const [article, articles] = await Promise.all([
        fetchArticleFromSupabase(id),
        fetch('data/articles.json').then(res => res.json()).catch(() => []),
      ]);

      if (!article) {
        document.getElementById('article-wrapper').innerHTML = '<div class="error">기사를 찾을 수 없습니다.</div>';
        return;
      }

      renderArticle(article, articles);

      // view_count 증가
      fetch(`${SUPABASE_URL}/rest/v1/rpc/increment_view_count`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ article_id: parseInt(id) })
      }).catch(() => {});

    } catch(e) {
      document.getElementById('article-wrapper').innerHTML = '<div class="error">오류가 발생했습니다.</div>';
    }
  }

  function formatUpdateTime(str) {
    if (!str) return '';
    const d = new Date(str.replace(' ', 'T'));
    if (!isNaN(d)) {
      const mo = String(d.getMonth()+1).padStart(2,'0');
      const dy = String(d.getDate()).padStart(2,'0');
      const hh = String(d.getHours()).padStart(2,'0');
      const mm = String(d.getMinutes()).padStart(2,'0');
      return `${mo}/${dy} ${hh}:${mm}`;
    }
    return str.slice(-11);
  }

  function formatDate(str) {
    if (!str) return '';
    const d = new Date(str.replace(' ', 'T'));
    return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  async function shareArticle() {
    const url = location.href;
    const title = document.title;
    if (navigator.share) {
      try { await navigator.share({ title, url }); } catch(e) {}
    } else {
      try {
        await navigator.clipboard.writeText(url);
        alert('링크가 복사되었습니다.');
      } catch(e) {
        prompt('링크를 복사하세요:', url);
      }
    }
  }

  // 언어 토글(2026-09-03 신설) — summary_en이 실제로 채워진 기사(현재는
  // 글로벌 마켓 동향/뉴욕증시 개장 등 국제성 카테고리만 번역됨)에 한해
  // 표시. title_en은 번역 안 된 기사도 title_ko 복사값이 항상 들어있어
  // (article_store.py 계열 payload 관례) 게이트 기준으로 못 씀 — 반드시
  // summary_en 비어있는지로 판단한다.
  let currentLang = 'ko';
  let cachedArticle = null, cachedAllArticles = null;

  function toggleLang() {
    currentLang = currentLang === 'en' ? 'ko' : 'en';
    if (cachedArticle) renderArticle(cachedArticle, cachedAllArticles);
  }

  function renderArticle(a, allArticles) {
    cachedArticle = a;
    cachedAllArticles = allArticles;
    const hasEnglish = !!(a.summary_en && a.summary_en.trim());
    const lang = (currentLang === 'en' && hasEnglish) ? 'en' : 'ko';
    // title은 document.title/meta 등 "HTML을 파싱하지 않는" 컨텍스트에도 쓰이므로
    // 원문 그대로 두고, innerHTML 템플릿에 넣을 때만 titleHtml(이스케이프됨)을 쓴다
    // (2026-09-03 보안 점검 — esc()를 여기서 적용하면 document.title에 "&amp;"처럼
    // 문자 그대로 보이는 이중 인코딩 버그가 생긴다).
    const title = lang === 'en' ? (a.title_en || a.title_ko || '') : (a.title_ko || a.title_en || '');
    const titleHtml = window.esc(title);
    // 2026-09-03 보안 점검: DB 본문을 이스케이프 없이 innerHTML에 넣고 있었다(XSS).
    // cleanBody() 직후, p/ul/h2 구조화·이미지 마크다운 변환보다 먼저 이스케이프해서
    // 원문에 진짜 <script> 등이 있어도 텍스트로만 남게 한다 — 이스케이프는 <,>,&,",'만
    // 건드리므로 마크다운에 쓰는 []()*  문자는 그대로 남아 이후 변환 로직에 영향 없다.
    const body = window.esc(cleanBody(lang === 'en' ? (a.summary_en || a.summary_ko || '') : (a.summary_ko || a.summary_en || '')));

    // 문단(빈 줄) 단위로 먼저 블록을 나눈 뒤 블록별로 처리한다.
    // ⚠️ 실사고(2026-08-17, id=80581 다이제스트): 예전엔 \n\n을 플레이스홀더로
    // 먼저 치환하고 나서 split('\n')을 했는데, 그러면 문단 경계가 진짜 개행이
    // 아니게 되어 split이 그 지점을 못 끊었다. 그 결과 불릿("- ") 줄 바로 뒤에
    // 빈 줄이 오면 다음 섹션 전체가 그 불릿 <li> 안으로 통째로 흡수됐다.
    // 블록을 먼저 나누면 이런 교차 오염이 구조적으로 불가능하다.
    // ⚠️ 또한 이전엔 전체를 바깥 <p>로 한 번 더 감쌌는데, <p> 안에 <ul>이 들어가는
    // 건 HTML 파서가 허용하지 않아 브라우저가 <p>를 강제로 끊고 빈 <p></p>를
    // 끼워넣었다(id=80581에서 재확인). 블록마다 <p>·<ul>을 스스로 완결된
    // 형태로 내보내고, 바깥에서는 더 이상 <p>로 감싸지 않는다.
    // 다이제스트 등의 "[섹션 소제목]" 줄은 <h2>로 승격(SEO 헤더 구조).
    const SECTION_RE = /^\[(.+)\]$/;
    const htmlBlocks = body.split(/\n\n+/).map((block) => {
      const acc = block.split('\n').reduce((acc, line) => {
        const trimmed = line.trim();
        const sectionMatch = trimmed.match(SECTION_RE);
        if (sectionMatch) {
          acc.inList = false;
          acc.parts.push({ type: 'h2', text: sectionMatch[1] });
        } else if (trimmed.startsWith('- ')) {
          if (!acc.inList) { acc.parts.push({ type: 'ul', items: [] }); acc.inList = true; }
          acc.parts[acc.parts.length - 1].items.push(trimmed.slice(2));
        } else {
          acc.inList = false;
          const last = acc.parts[acc.parts.length - 1];
          if (last && last.type === 'p') { last.lines.push(line); }
          else { acc.parts.push({ type: 'p', lines: [line] }); }
        }
        return acc;
      }, { parts: [], inList: false });
      return acc.parts.map((p) => {
        if (p.type === 'ul') return `<ul>${p.items.map((i) => `<li>${i}</li>`).join('')}</ul>`;
        if (p.type === 'h2') return `<h2>${p.text}</h2>`;
        return `<p>${p.lines.join('<br>')}</p>`;
      }).join('');
    });
    const processedBody = htmlBlocks.join('');

    const bodyHtml = processedBody
      .replace(/!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)/g, '<img src="$2" alt="$1" loading="lazy" style="max-width:100%;border-radius:6px;margin:8px 0;display:block;">')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

    const myCountries = new Set(a.countries && a.countries.length ? a.countries : (a.country ? [a.country] : []));
    const related = (allArticles || [])
      .filter(r => r.id !== a.id && r.source === 'NewsFinal')
      .map(r => {
        let score = 0;
        const rCountries = r.countries && r.countries.length ? r.countries : (r.country ? [r.country] : []);
        if (rCountries.some(c => myCountries.has(c))) score += 10;
        if (r.category === a.category) score += 3;
        if (r.region === a.region) score += 1;
        return { article: r, score };
      })
      .filter(x => x.score > 0)
      .sort((x, y) => y.score - x.score || (y.article.created_at || '').localeCompare(x.article.created_at || ''))
      .slice(0, 4)
      .map(x => x.article);

    // 후속기사 연결(2026-09-02) — gemini_writer.py의 find_continuing_story()가
    // 판정해 저장한 continuation_of_id를 명시적으로 표시한다. 기존 "관련 기사"는
    // 국가/카테고리/지역이 겹치는 최근 기사를 점수로 골라 보여줄 뿐 "이 기사가
    // 저 기사의 후속이다"라는 연결은 전혀 나타내지 못했다(사용자 지적:
    // "후속 기사로 나가는 거면 이전 기사와 관련 기사로 묶어야 하고").
    const prevArticle = a.continuation_of_id
      ? (allArticles || []).find(r => r.id === a.continuation_of_id)
      : null;
    const nextArticle = (allArticles || []).find(r => r.continuation_of_id === a.id) || null;

    document.title = `${title} — NewsFinal`;
    document.querySelector('meta[name="description"]')?.setAttribute('content', cleanBody(stripUpdates(a.summary_ko || '')).slice(0, 150));
    document.querySelector('meta[property="og:title"]')?.setAttribute('content', `${title} — NewsFinal`);
    document.querySelector('meta[property="og:description"]')?.setAttribute('content', cleanBody(stripUpdates(a.summary_ko || '')).slice(0, 150));
    document.querySelector('link[rel="canonical"]')?.setAttribute('href', `https://newsfinal.co.kr/article?id=${a.id}`);
    if (a.image_url) document.querySelector('meta[property="og:image"]')?.setAttribute('content', a.image_url);

    document.getElementById('article-wrapper').innerHTML = `
      <a class="back-btn" href="/">← 홈으로</a>

      ${a.source === 'NewsFinal' && ['trend_','realtrend_','extrend_'].some(p=>(a.subcategory||'').startsWith(p)) ? `<div class="trend-badge"><span class="dot"></span>TREND</div>` : ''}

      <div class="article-tags">
        ${a.category ? `<a class="tag" href="/?category=${encodeURIComponent(a.category)}">${window.esc(a.category)}</a>` : ''}
        ${a.subcategory && a.subcategory !== a.category
          && !a.subcategory.startsWith('cluster_')
          && !a.subcategory.startsWith('solo_')
          && !a.subcategory.startsWith('digest_')
          && !a.subcategory.startsWith('trend_')
          && !a.subcategory.startsWith('realtrend_')
          && !a.subcategory.startsWith('extrend_')
          && !a.subcategory.startsWith('weather_')
          && !a.subcategory.endsWith('briefing')
          ? `<span class="tag">${window.esc(a.subcategory)}</span>` : ''}
        ${a.region && regionKo(a.region) !== a.category ? `<span class="tag">${window.esc(regionKo(a.region))}</span>` : ''}
        ${a.countries && a.countries.length > 0
          ? a.countries.map(c => `<a class="tag" href="/?country=${encodeURIComponent(c)}">${window.esc(c)}</a>`).join('')
          : (a.country ? `<a class="tag" href="/?country=${encodeURIComponent(a.country)}">${window.esc(a.country)}</a>` : '')}
      </div>

      <h1 class="article-title">${titleHtml}</h1>

      ${hasEnglish ? `<button onclick="toggleLang()" style="margin:0 0 12px;background:none;border:1px solid var(--border);border-radius:6px;padding:4px 12px;cursor:pointer;color:var(--accent2);font-size:12px;">${lang === 'en' ? '🇰🇷 한국어로 보기' : '🇺🇸 Read in English'}</button>` : ''}

      <div class="article-meta">
        <span>${window.esc(a.byline || '뉴스파이널 편집국')}</span>
        ${a.first_published_at && a.first_published_at !== a.created_at
          ? `<span>🕐 최초 게시: ${formatDate(a.first_published_at)}</span><span>🔄 최종 업데이트: ${formatDate(a.created_at)}</span>`
          : `<span>🕐 ${formatDate(a.created_at)}</span>`}
        ${a.region ? `<span>🌍 ${window.esc(regionKo(a.region))}</span>` : ''}
        ${a.country ? `<span>📍 ${window.esc(a.country)}</span>` : ''}
      </div>

      ${(prevArticle || nextArticle) ? `
        <div style="margin:12px 0;padding:10px 14px;background:rgba(26,95,168,0.06);border-radius:8px;border-left:3px solid var(--accent2);font-size:13px;line-height:1.7;">
          ${prevArticle ? `<div>⬅️ 이전 보도: <a href="/article?id=${prevArticle.id}" style="color:var(--accent2);">${window.esc(prevArticle.title_ko || prevArticle.title_en)}</a></div>` : ''}
          ${nextArticle ? `<div>➡️ 후속 기사: <a href="/article?id=${nextArticle.id}" style="color:var(--accent2);">${window.esc(nextArticle.title_ko || nextArticle.title_en)}</a></div>` : ''}
        </div>` : ''}

      ${a.summary_3lines ? `
        <div style="margin:16px 0;padding:14px 16px;background:rgba(26,95,168,0.06);border-radius:8px;border-left:3px solid var(--accent2);">
          <div style="font-weight:700;color:var(--accent2);font-size:13px;margin-bottom:8px;">📌 3줄 요약</div>
          <ul style="margin:0;padding-left:18px;">
            ${a.summary_3lines.split(/\\n|\n/).filter(l => l.trim()).map(l => `<li style="margin-bottom:4px;font-size:14px;line-height:1.6;">${window.esc(l.trim().replace(/^[*\-•]\s*/,''))}</li>`).join('')}
          </ul>
        </div>` : ''}

      ${publicUpdateLog(a.update_log).length > 0 ? `
        <div style="margin:12px 0;border-left:3px solid var(--accent2);font-family:'IBM Plex Mono',monospace;font-size:11px;">
          <div style="padding:6px 10px;font-weight:700;color:var(--accent2);border-bottom:1px solid var(--border);">업데이트 기록</div>
          ${publicUpdateLog(a.update_log).reverse().map((l, i) => `
            <div style="display:flex;gap:10px;padding:4px 10px;${i===0?'background:rgba(26,95,168,0.06);color:var(--text);font-weight:600;':'color:var(--muted);'}">
              <span style="min-width:78px;flex-shrink:0;">${formatUpdateTime(l.timestamp)}</span>
              <span>${window.esc(l.note || '업데이트')}</span>
            </div>`).join('')}
        </div>` : ''}

      ${a.image_url ? `<img class="article-hero" src="${window.esc(a.image_url)}" alt="${titleHtml}" loading="lazy" style="width:100%;max-height:420px;object-fit:cover;border-radius:8px;margin:16px 0 8px;display:block;">`+ (window.imageCreditLabel(a.image_url, a.image_credit) ? `<div style="font-size:12px;color:#888;margin:0 0 12px;text-align:right;">${window.esc(window.imageCreditLabel(a.image_url, a.image_credit))}</div>` : '') : ''}

      <div class="article-body">
        ${bodyHtml}
      </div>

      ${a.investment_idea ? `
        <div style="margin:24px 0;padding:16px 18px;background:rgba(200,140,20,0.07);border-radius:8px;border-left:3px solid #c88c14;">
          <div style="font-weight:700;color:#c88c14;font-size:13px;margin-bottom:8px;">💡 투자 아이디어</div>
          <div style="font-size:14px;line-height:1.8;color:var(--text);">${window.esc(a.investment_idea).replace(/\\n|\n/g,'<br>')}</div>
        </div>` : ''}

      <div class="source-link">ⓒ NewsFinal <button onclick="shareArticle()" style="float:right;background:none;border:1px solid var(--border);border-radius:6px;padding:4px 12px;cursor:pointer;color:var(--text);font-size:12px;">🔗 공유</button></div>

      ${related.length ? `
        <div class="related">
          <div class="related-title">관련 기사</div>
          ${related.map(r => `
            <div class="related-item">
              <a class="related-item-title" href="/article?id=${r.id}">${window.esc(r.title_ko || r.title_en)}</a>
              <div class="related-meta">NewsFinal · ${(r.created_at || '').slice(0,10)}</div>
            </div>
          `).join('')}
        </div>
      ` : ''}
    `;
  }

  loadMarketData();
  loadArticle();
</script>
</body>
</html>
